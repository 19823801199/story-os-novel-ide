<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NovelCraft × Story OS</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--surface:#1c2128;--ink:#e6edf3;--muted:#7d8590;--rule:#30363d;--accent:#7c3aed;--accent2:#06b6d4;--success:#3fb950;--warning:#d29922;--danger:#f85149;--radius:8px;--radius-lg:12px;--font:system-ui,-apple-system,sans-serif;--nav-w:56px;--side-w:240px;--tr:.2s ease}
[data-theme="light"]{--bg:#fff;--bg2:#f6f8fa;--bg3:#e1e4e8;--surface:#fff;--ink:#24292e;--muted:#586069;--rule:#e1e4e8}
[data-theme="warm"]{--bg:#fdf6e3;--bg2:#f5f0e0;--bg3:#ebe3d0;--surface:#fefbf3;--ink:#3d3522;--muted:#8a7a52;--rule:#dcd5c0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;overflow:hidden}
#app{display:flex;height:100vh}
#navbar{width:var(--nav-w);background:var(--bg2);border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
.nav-item{width:40px;height:40px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--muted);transition:var(--tr)}
.nav-item:hover{background:var(--bg3);color:var(--ink)}
.nav-item.active{background:var(--accent);color:#fff}
#sidebar{width:var(--side-w);background:var(--bg2);border-right:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--rule);font-weight:600;font-size:14px;color:var(--muted)}
.sidebar-section{flex:1;overflow-y:auto;padding:8px}
#main{flex:1;overflow-y:auto;position:relative}
.page{display:none;padding:24px;animation:fadeIn .2s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-title{font-size:16px;font-weight:600;margin-bottom:12px}
.btn{padding:6px 14px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--bg3);color:var(--ink);cursor:pointer;font-size:13px;transition:var(--tr)}
.btn:hover{background:var(--rule)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-secondary{background:var(--bg3)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-sm{padding:3px 8px;font-size:12px}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--rule);border-radius:var(--radius);color:var(--ink);font-size:14px;font-family:var(--font)}
.form-textarea{min-height:80px;resize:vertical}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-success{background:rgba(63,185,80,.15);color:var(--success)}
.badge-warning{background:rgba(210,153,34,.15);color:var(--warning)}
.badge-danger{background:rgba(248,81,73,.15);color:var(--danger)}
.badge-info{background:rgba(6,182,212,.15);color:var(--accent2)}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}.grid-4{grid-template-columns:repeat(4,1fr)}
.stat-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:16px;text-align:center}
.stat-value{font-size:28px;font-weight:700;color:var(--accent)}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px}
.empty-state{text-align:center;padding:32px;color:var(--muted)}
.text-muted{color:var(--muted)}.text-sm{font-size:13px}.text-lg{font-size:18px}.text-xl{font-size:24px;font-weight:700}
.text-center{text-align:center}.text-right{text-align:right}
.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}
.mb-1{margin-bottom:8px}.mb-2{margin-bottom:16px}.mb-3{margin-bottom:24px}
.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}.flex-col{flex-direction:column}
.gap-1{gap:8px}.gap-2{gap:16px}.w-full{width:100%}
.editor-layout{display:grid;grid-template-columns:220px 1fr 300px;gap:0;height:calc(100vh - 0px);margin:-24px}
.chapter-list{border-right:1px solid var(--rule);overflow-y:auto;background:var(--bg2)}
.chapter-list-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--rule);transition:var(--tr)}
.chapter-list-item:hover{background:var(--bg3)}
.chapter-list-item.active{background:var(--surface);border-left:3px solid var(--accent)}
.chapter-editor{display:flex;flex-direction:column;overflow:hidden}
.chapter-editor textarea{flex:1;width:100%;background:var(--bg);color:var(--ink);border:none;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px;font-size:15px;line-height:1.8;resize:none;outline:none;font-family:var(--font)}
.chapter-editor-bar{padding:8px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--bg2);font-size:13px;color:var(--muted)}
.copilot-panel{border-left:1px solid var(--rule);overflow-y:auto;background:var(--bg2);padding:12px}
.copilot-section{margin-bottom:16px}
.copilot-section h4{font-size:13px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.action-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:10px;margin-bottom:8px}
.action-card .action-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.action-card .action-title{font-size:13px;font-weight:600}
.action-card .action-desc{font-size:12px;color:var(--muted);line-height:1.4}
.action-card .action-actions{display:flex;gap:4px;margin-top:6px}
.severity-critical{border-left:3px solid var(--danger)}
.severity-warning{border-left:3px solid var(--warning)}
.severity-info{border-left:3px solid var(--accent2)}
.severity-pass{border-left:3px solid var(--success)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius-lg);padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:18px;font-weight:600}
.modal-close{cursor:pointer;font-size:20px;color:var(--muted);background:none;border:none}
#toastContainer{position:fixed;top:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--rule);color:var(--ink);font-size:14px;animation:fadeIn .2s ease;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.toast-success{border-left:3px solid var(--success)}.toast-error{border-left:3px solid var(--danger)}.toast-info{border-left:3px solid var(--accent2)}
.cmd-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;z-index:1500;padding-top:15vh}
.cmd-overlay.active{display:flex}
.cmd-box{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius-lg);width:500px;max-width:90vw;overflow:hidden}
.cmd-input{width:100%;padding:12px 16px;background:var(--bg);border:none;border-bottom:1px solid var(--rule);color:var(--ink);font-size:15px;outline:none}
.cmd-list{max-height:300px;overflow-y:auto}
.cmd-item{padding:8px 16px;cursor:pointer;transition:var(--tr)}
.cmd-item:hover,.cmd-item.active{background:var(--bg3)}
.tree-item{padding:6px 0;padding-left:16px}.tree-children{margin-left:20px}
.char-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:12px;cursor:pointer;transition:var(--tr)}
.char-card:hover{border-color:var(--accent)}
.char-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff}
.consistency-item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule)}
.consistency-item:last-child{border-bottom:none}
.rule-toggle{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule)}
.switch{position:relative;width:36px;height:20px;background:var(--bg3);border-radius:10px;cursor:pointer;transition:var(--tr)}
.switch.on{background:var(--accent)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:var(--tr)}
.switch.on::after{left:18px}
@media(max-width:768px){#sidebar{display:none}.editor-layout{grid-template-columns:1fr}.chapter-list,.copilot-panel{display:none}.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
<div id="navbar">
<a class="nav-item active" data-page="dashboard" title="仪表盘" onclick="navigate('dashboard')">📊</a>
<a class="nav-item" data-page="editor" title="章节编辑" onclick="navigate('editor')">✍️</a>
<a class="nav-item" data-page="characters" title="人物中心" onclick="navigate('characters')">👥</a>
<a class="nav-item" data-page="plot" title="剧情规划" onclick="navigate('plot')">📐</a>
<a class="nav-item" data-page="worldbuilding" title="世界观" onclick="navigate('worldbuilding')">🌍</a>
<a class="nav-item" data-page="consistency" title="一致性检查" onclick="navigate('consistency')">🔍</a>
<a class="nav-item" data-page="data" title="数据中心" onclick="navigate('data')">💾</a>
<a class="nav-item" data-page="settings" title="设置" onclick="navigate('settings')">⚙️</a>
</div>
<div id="sidebar"><div class="sidebar-header"><span id="sidebarTitle">导航</span></div><div class="sidebar-section" id="sidebarContent"></div></div>
<div id="main">
<div class="page active" id="page-dashboard"></div>
<div class="page" id="page-editor"></div>
<div class="page" id="page-characters"></div>
<div class="page" id="page-plot"></div>
<div class="page" id="page-worldbuilding"></div>
<div class="page" id="page-consistency"></div>
<div class="page" id="page-data"></div>
<div class="page" id="page-settings"></div>
</div>
</div>
<div id="modalContainer"></div>
<div id="toastContainer"></div>
<div class="cmd-overlay" id="cmdOverlay"><div class="cmd-box"><input class="cmd-input" id="cmdInput" placeholder="输入命令..." oninput="filterCmd()" /><div class="cmd-list" id="cmdList"></div></div></div>
<script>
"use strict";
/* ============================================================
 * Story OS Novel IDE - v0.2.0
 * Phase 4 - Unified Story Runtime
 * Single source of truth: StoryStore -> StoryState
 * ============================================================ */
var APP_VERSION='0.2.0';
var STORY_STATE_VERSION='phase4';
var SCHEMA_VERSION=2;

// ===== GENRE_CONFIG =====
var GENRE_CONFIG={
fantasy:{name:'玄幻',worldFields:[{key:'cultivationSystem',label:'修炼体系',required:true}],storyArcs:['废柴觉醒','奇遇得宝','宗门大比','秘境探险','生死之战','突破瓶颈','复仇雪恨','登顶巅峰'],characterFields:{protagonist:[{key:'aptitude',label:'根骨资质'}],supporting:[{key:'cultivation',label:'修炼功法'}]},inspirationSeeds:['主角在垃圾堆捡到上古神器']},
xianxia:{name:'仙侠',worldFields:[{key:'realmSystem',label:'境界体系',required:true}],storyArcs:['凡人修仙','拜入宗门','筑基结丹','元婴化神','渡劫飞升'],characterFields:{protagonist:[{key:'spirit',label:'灵根'}],supporting:[{key:'sect',label:'门派'}]},inspirationSeeds:['散修在废墟中找到上古功法']},
urban:{name:'都市',worldFields:[{key:'citySetting',label:'城市设定',required:true}],storyArcs:['平凡日常','意外获得','商战风云','逆袭人生'],characterFields:{protagonist:[{key:'job',label:'职业'}],supporting:[{key:'company',label:'公司'}]},inspirationSeeds:['上班族意外获得透视眼']},
scifi:{name:'科幻',worldFields:[{key:'techLevel',label:'科技水平',required:true}],storyArcs:['星际探索','文明冲突','AI觉醒','时空穿梭'],characterFields:{protagonist:[{key:'role',label:'角色定位'}],supporting:[{key:'faction',label:'阵营'}]},inspirationSeeds:['星际拓荒者在未知星球发现遗迹']},
mystery:{name:'悬疑',worldFields:[{key:'era',label:'时代背景',required:true}],storyArcs:['日常','案件','调查','真相','反转'],characterFields:{protagonist:[{key:'skill',label:'专长'}],supporting:[{key:'relation',label:'与死者关系'}]},inspirationSeeds:['密室杀人案的死者留下死亡讯息']},
wuxia:{name:'武侠',worldFields:[{key:'jianghu',label:'江湖格局',required:true}],storyArcs:['入江湖','拜师','奇遇','恩怨','决战'],characterFields:{protagonist:[{key:'sect',label:'门派'}],supporting:[{key:'weapon',label:'武器'}]},inspirationSeeds:['少年为父报仇踏入江湖']},
romance:{name:'言情',worldFields:[{key:'setting',label:'背景设定',required:true}],storyArcs:['相遇','误会','心动','阻碍','告白','在一起'],characterFields:{protagonist:[{key:'trait',label:'性格特点'}],supporting:[{key:'role',label:'角色定位'}]},inspirationSeeds:['雨天在咖啡店偶遇陌生人']},
history:{name:'历史',worldFields:[{key:'dynasty',label:'朝代',required:true}],storyArcs:['起兵','征战','建国','治国','盛衰'],characterFields:{protagonist:[{key:'title',label:'身份'}],supporting:[{key:'faction',label:'阵营'}]},inspirationSeeds:['穿越到乱世成为一方诸侯']},
horror:{name:'恐怖',worldFields:[{key:'setting',label:'场景设定',required:true}],storyArcs:['日常','异变','调查','恐怖','真相'],characterFields:{protagonist:[{key:'background',label:'背景'}],supporting:[{key:'secret',label:'秘密'}]},inspirationSeeds:['老宅搬入后夜间总有脚步声']},
game:{name:'游戏',worldFields:[{key:'gameWorld',label:'游戏世界',required:true}],storyArcs:['进入游戏','升级','组队','副本','PK','巅峰'],characterFields:{protagonist:[{key:'class',label:'职业'}],supporting:[{key:'guild',label:'公会'}]},inspirationSeeds:['全服第一玩家意外被困游戏中']},
other:{name:'其他',worldFields:[{key:'custom',label:'自定义',required:true}],storyArcs:['起','承','转','合'],characterFields:{protagonist:[{key:'custom',label:'自定义'}],supporting:[{key:'custom',label:'自定义'}]},inspirationSeeds:['一个普通人发现生活开始不对劲']}
};

// ===== StoryStore: Unified Data Access Layer =====
var StoryStore=(function(){
  var STORAGE_KEY='novelcraft_unified_v1';
  var OLD_NC_KEY='novelcraft_pro_v1';
  var OLD_WENSI_KEY='wensi_books_v9';

  var _state=createEmptyState();

  function createEmptyState(){
    return{
      _schema:SCHEMA_VERSION,
      _stateVersion:STORY_STATE_VERSION,
      meta:{title:'未命名小说',genre:'fantasy',dailyGoal:4000,createdAt:0,theme:'dark',fontSize:15,autoSave:true},
      chapters:[],characters:[],relationships:[],world:{setting:{},locations:[],factions:[],rules:[]},
      timeline:[],foreshadowing:[],conflicts:[],
      narrative_state:{currentArc:'',paceScore:0,tensionLevel:0,activeConflicts:[],pendingForeshadows:[],characterPresence:{},lastAnalysis:0,aiSuggestions:{},issues:[],changeLedger:[]},
      _lastParseResult:null
    };
  }

  function uid(){return'_'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);}
  function deepClone(o){return JSON.parse(JSON.stringify(o));}

  // ===== Phase 5.1: schema helpers (normalize / migrate / validate / structuredDiff) =====
  var COLLECTIONS=['chapters','characters','relationships','timeline','foreshadowing','conflicts'];
  var ID_PREFIX={chapters:'chapter',characters:'character',relationships:'relationship',timeline:'timeline',foreshadowing:'foreshadow',conflicts:'conflict'};
  var CHANGE_TYPES=['add','remove','update'];
  var META_DEFAULTS={title:'未命名小说',genre:'fantasy',dailyGoal:4000,createdAt:0,theme:'dark',fontSize:15,autoSave:true};

  function hashString(str){var h=5381;for(var i=0;i<str.length;i++){h=((h<<5)+h)+str.charCodeAt(i);h=h&0xFFFFFFFF;}return(h>>>0).toString(16);}
  function hashObj(obj){return hashString(JSON.stringify(obj));}
  function pad3(n){var s=String(n);while(s.length<3)s='0'+s;return s;}
  function isPlainObject(v){return!!v&&typeof v==='object'&&!Array.isArray(v);}
  function asArray(v){return Array.isArray(v)?v:[];}
  function asObject(v){return isPlainObject(v)?v:{};}
  function asString(v,d){return typeof v==='string'?v:((v===undefined||v===null)?d:String(v));}
  function asNumber(v,d){var n=typeof v==='number'?v:parseFloat(v);return isFinite(n)?n:d;}

  // Deterministic, testable entity ids: <prefix>_001, <prefix>_002, ...
  function nextEntityId(prefix,list){
    var max=0;
    asArray(list).forEach(function(item){
      var m=/^([a-z]+)_(\d+)$/.exec(asString(item&&item.id,''));
      if(m&&m[1]===prefix){var n=parseInt(m[2],10);if(n>max)max=n;}
    });
    return prefix+'_'+pad3(max+1);
  }
  function collectFunctionPaths(value,path,out){
    out=out||[];path=path||'$';
    if(typeof value==='function'){out.push(path);return out;}
    if(Array.isArray(value)){value.forEach(function(v,i){collectFunctionPaths(v,path+'['+i+']',out);});return out;}
    if(isPlainObject(value)){Object.keys(value).forEach(function(k){collectFunctionPaths(value[k],path+'.'+k,out);});return out;}
    return out;
  }
  function stripFunctions(value){
    if(typeof value==='function')return undefined;
    if(Array.isArray(value)){for(var i=value.length-1;i>=0;i--){var sv=stripFunctions(value[i]);if(sv===undefined)value.splice(i,1);else value[i]=sv;}return value;}
    if(isPlainObject(value)){Object.keys(value).forEach(function(k){var sv=stripFunctions(value[k]);if(sv===undefined)delete value[k];else value[k]=sv;});return value;}
    return value;
  }

  // normalize: pure + idempotent. Never mutates the input, never uses randomness.
  function normalize(input){
    var warnings=[];
    var src=isPlainObject(input)?input:{};
    if(Array.isArray(input))warnings.push('normalize: expected object, got array');
    var out=createEmptyState();
    out._schema=asNumber(src._schema,SCHEMA_VERSION);
    out._stateVersion=STORY_STATE_VERSION;
    delete out.relationships;
    out.relationships=[];
    delete out._lastParseResult;
    out._lastParseResult=(src._lastParseResult===undefined?null:deepClone(src._lastParseResult));

    // meta
    out.meta=asObject(src.meta);
    Object.keys(META_DEFAULTS).forEach(function(k){if(out.meta[k]===undefined)out.meta[k]=META_DEFAULTS[k];});
    out.meta.title=asString(out.meta.title,META_DEFAULTS.title);
    out.meta.genre=asString(out.meta.genre,META_DEFAULTS.genre);
    out.meta.dailyGoal=asNumber(out.meta.dailyGoal,META_DEFAULTS.dailyGoal);
    out.meta.createdAt=asNumber(out.meta.createdAt,META_DEFAULTS.createdAt);
    out.meta.theme=asString(out.meta.theme,META_DEFAULTS.theme);
    out.meta.fontSize=asNumber(out.meta.fontSize,META_DEFAULTS.fontSize);
    out.meta.autoSave=out.meta.autoSave!==false;

    // world
    var worldIn=asObject(src.world);
    out.world={setting:asObject(worldIn.setting),locations:[],factions:asArray(worldIn.factions),rules:asArray(worldIn.rules)};
    if(worldIn.outlines!==undefined)out.world.outlines=asArray(worldIn.outlines);
    var locations=[];
    if(worldIn.locations!==undefined&&!Array.isArray(worldIn.locations))warnings.push('world.locations: expected array');
    asArray(worldIn.locations).forEach(function(loc){
      loc=asObject(loc);
      var id=asString(loc.id,'');
      if(!id||locations.some(function(x){return x.id===id;})){id=nextEntityId('location',locations);warnings.push('world.locations: assigned id '+id);}
      locations.push({id:id,name:asString(loc.name,''),category:asString(loc.category,'其他'),description:asString(loc.description,''),attributes:asObject(loc.attributes)});
    });
    out.world.locations=locations;

    // chapters
    if(src.chapters!==undefined&&!Array.isArray(src.chapters))warnings.push('chapters: expected array, got '+typeof src.chapters);
    var chapters=[];
    asArray(src.chapters).forEach(function(ch,idx){
      ch=asObject(ch);
      var id=asString(ch.id,'');
      if(!id||chapters.some(function(x){return x.id===id;})){id=nextEntityId('chapter',chapters);warnings.push('chapters: assigned id '+id);}
      var analysis=asObject(ch.aiAnalysis);
      chapters.push({
        id:id,title:asString(ch.title,'第'+(idx+1)+'章'),summary:asString(ch.summary,''),
        content:asString(ch.content,''),wordCount:asNumber(ch.wordCount,0),status:asString(ch.status,'未写'),
        order:asNumber(ch.order,idx),
        aiAnalysis:{characters:asArray(analysis.characters),locations:asArray(analysis.locations),events:asArray(analysis.events),
          foreshadowHits:asArray(analysis.foreshadowHits),emotions:asArray(analysis.emotions),timeHints:asArray(analysis.timeHints),
          lastParsed:asNumber(analysis.lastParsed,0)}
      });
    });
    out.chapters=chapters;

    // characters
    if(src.characters!==undefined&&!Array.isArray(src.characters))warnings.push('characters: expected array');
    var characters=[];
    asArray(src.characters).forEach(function(c,idx){
      c=asObject(c);
      var id=asString(c.id,'');
      if(!id||characters.some(function(x){return x.id===id;})){id=nextEntityId('character',characters);warnings.push('characters: assigned id '+id);}
      var presence=asObject(c.presence),profile=asObject(c.aiProfile);
      characters.push({
        id:id,name:asString(c.name,'未命名'),gender:asString(c.gender,''),age:asString(c.age,''),
        charType:asString(c.charType,'supporting'),tags:asArray(c.tags),fields:asObject(c.fields),
        relations:asArray(c.relations).map(function(r){r=asObject(r);return{targetId:asString(r.targetId,''),type:asString(r.type,'')};}),
        presence:{firstAppear:asNumber(presence.firstAppear,0),lastAppear:asNumber(presence.lastAppear,0),
          chapterIds:asArray(presence.chapterIds),appearCount:asNumber(presence.appearCount,0)},
        aiProfile:{arcStage:asString(profile.arcStage,''),consistencyScore:asNumber(profile.consistencyScore,100),
          importance:asNumber(profile.importance,idx===0?10:5)}
      });
    });
    out.characters=characters;

    // relationships (top-level; mirrored from characters[].relations for backward compat)
    var relationships=[];
    asArray(src.relationships).forEach(function(r){
      r=asObject(r);
      var fromId=asString(r.fromId!==undefined?r.fromId:(r.sourceId!==undefined?r.sourceId:''),'');
      var toId=asString(r.toId!==undefined?r.toId:(r.targetId!==undefined?r.targetId:''),'');
      if(!fromId&&!toId)return;
      var id=asString(r.id,'');
      if(!id||relationships.some(function(x){return x.id===id;}))id=nextEntityId('relationship',relationships);
      relationships.push({id:id,fromId:fromId,toId:toId,type:asString(r.type,''),note:asString(r.note,'')});
    });
    out.characters.forEach(function(c){
      c.relations.forEach(function(rel){
        if(!rel.targetId)return;
        var exists=relationships.some(function(r){return r.fromId===c.id&&r.toId===rel.targetId&&r.type===rel.type;});
        if(!exists)relationships.push({id:nextEntityId('relationship',relationships),fromId:c.id,toId:rel.targetId,type:rel.type,note:''});
      });
    });
    out.relationships=relationships;

    // timeline
    var timeline=[];
    asArray(src.timeline).forEach(function(t){
      t=asObject(t);
      var id=asString(t.id,'');
      if(!id||timeline.some(function(x){return x.id===id;}))id=nextEntityId('timeline',timeline);
      timeline.push({id:id,date:asString(t.date,''),event:asString(t.event,''),chapterId:(t.chapterId===undefined?null:t.chapterId),type:asString(t.type,'event')});
    });
    out.timeline=timeline;

    // foreshadowing
    var foreshadowing=[];
    asArray(src.foreshadowing).forEach(function(f){
      f=asObject(f);
      var id=asString(f.id,'');
      if(!id||foreshadowing.some(function(x){return x.id===id;}))id=nextEntityId('foreshadow',foreshadowing);
      foreshadowing.push({id:id,content:asString(f.content,''),chapterPlaced:asNumber(f.chapterPlaced,0),
        chapterExpected:asNumber(f.chapterExpected,0),status:asString(f.status,'pending'),note:asString(f.note,''),
        linkedChapterId:(f.linkedChapterId===undefined?null:f.linkedChapterId)});
    });
    out.foreshadowing=foreshadowing;

    // conflicts
    var conflicts=[];
    asArray(src.conflicts).forEach(function(c){
      c=asObject(c);
      var id=asString(c.id,'');
      if(!id||conflicts.some(function(x){return x.id===id;}))id=nextEntityId('conflict',conflicts);
      conflicts.push({id:id,type:asString(c.type,'person_vs_person'),description:asString(c.description,''),
        parties:asArray(c.parties),status:asString(c.status,'active'),chapterStarted:asNumber(c.chapterStarted,0),
        chapterResolved:(c.chapterResolved===undefined?null:c.chapterResolved)});
    });
    out.conflicts=conflicts;

    // narrative_state (+ audit ledger stays inside the single source of truth)
    var ns=asObject(src.narrative_state);
    out.narrative_state={
      currentArc:asString(ns.currentArc,''),paceScore:asNumber(ns.paceScore,0),tensionLevel:asNumber(ns.tensionLevel,0),
      activeConflicts:asArray(ns.activeConflicts),pendingForeshadows:asArray(ns.pendingForeshadows),
      characterPresence:asObject(ns.characterPresence),lastAnalysis:asNumber(ns.lastAnalysis,0),
      aiSuggestions:asObject(ns.aiSuggestions),issues:asArray(ns.issues),changeLedger:asArray(ns.changeLedger)
    };

    // contracts must be pure data: strip executable values
    var fnPaths=collectFunctionPaths(out);
    if(fnPaths.length){stripFunctions(out);warnings.push('normalize: stripped functions at '+fnPaths.join(', '));}
    return {state:out,warnings:warnings};
  }

  function migrateState(raw){
    var migration={from:null,to:SCHEMA_VERSION,applied:[]};
    if(!isPlainObject(raw)){migration.from='invalid';migration.applied.push('reset:non-object');return{state:createEmptyState(),migration:migration};}
    if(raw._stateVersion!==undefined||raw._schema!==undefined){
      var from=asNumber(raw._schema,0);
      migration.from=from||null;
      if(from&&from<SCHEMA_VERSION){
        var upgraded=deepClone(raw);
        upgraded._schema=SCHEMA_VERSION;
        upgraded._stateVersion=STORY_STATE_VERSION;
        migration.applied.push('schema:'+from+'->'+SCHEMA_VERSION);
        return{state:upgraded,migration:migration};
      }
      if(from&&from>SCHEMA_VERSION){migration.applied.push('schema:future');return{state:raw,migration:migration};}
      migration.applied.push('schema:current');
      return{state:raw,migration:migration};
    }
    if(raw.project||raw.worldbuilding||raw.timelines||raw.foreshadows){
      migration.from='legacy-novelcraft';migration.applied.push('migrateFromNC');
      return{state:migrateFromNC(raw),migration:migration};
    }
    if(raw.title!==undefined&&Array.isArray(raw.chapters)){
      migration.from='legacy-wensi';migration.applied.push('migrateFromWensi');
      return{state:migrateFromWensi(raw),migration:migration};
    }
    migration.from='unknown';migration.applied.push('adopt:as-is');
    return{state:raw,migration:migration};
  }

  // validate: pure data contract check -> ValidationResult
  function validateState(state,checkedAt){
    var errors=[],warnings=[];
    var now=typeof checkedAt==='number'?checkedAt:Date.now();
    if(!isPlainObject(state))return{valid:false,errors:['state: expected plain object'],warnings:warnings,checkedAt:now};
    if(asNumber(state._schema,0)>SCHEMA_VERSION)errors.push('state._schema '+state._schema+' is newer than supported '+SCHEMA_VERSION);
    var fnPaths=collectFunctionPaths(state);
    if(fnPaths.length)errors.push('state contains executable values at '+fnPaths.join(', '));
    if(!isPlainObject(state.meta))errors.push('meta: expected object');
    if(!isPlainObject(state.world))errors.push('world: expected object');
    else{
      if(!isPlainObject(state.world.setting))errors.push('world.setting: expected object');
      ['locations','factions','rules'].forEach(function(k){if(!Array.isArray(state.world[k]))errors.push('world.'+k+': expected array');});
    }
    if(!isPlainObject(state.narrative_state))errors.push('narrative_state: expected object');
    COLLECTIONS.forEach(function(key){
      var list=state[key];
      if(!Array.isArray(list)){errors.push(key+': expected array');return;}
      var seen={};
      list.forEach(function(item,idx){
        if(!isPlainObject(item)){errors.push(key+'['+idx+']: expected object');return;}
        if(typeof item.id!=='string'||!item.id){errors.push(key+'['+idx+'].id: missing');return;}
        if(seen[item.id])errors.push(key+': duplicate id '+item.id);else seen[item.id]=true;
      });
    });
    var charIds={};
    asArray(state.characters).forEach(function(c){if(c&&typeof c.id==='string')charIds[c.id]=true;});
    asArray(state.relationships).forEach(function(r){
      if(!isPlainObject(r))return;
      if(r.fromId&&!charIds[r.fromId])errors.push('relationships['+r.id+'].fromId: unknown character '+r.fromId);
      if(r.toId&&!charIds[r.toId])errors.push('relationships['+r.id+'].toId: unknown character '+r.toId);
    });
    asArray(state.characters).forEach(function(c){
      if(!isPlainObject(c))return;
      asArray(c.relations).forEach(function(r){if(r&&r.targetId&&!charIds[r.targetId])warnings.push('characters['+c.id+'].relations -> unknown character '+r.targetId);});
    });
    asArray(state.chapters).forEach(function(c){
      if(!isPlainObject(c))return;
      if(typeof c.wordCount!=='number'||c.wordCount<0||!isFinite(c.wordCount))errors.push('chapters['+c.id+'].wordCount: invalid');
      if(!isPlainObject(c.aiAnalysis))errors.push('chapters['+c.id+'].aiAnalysis: expected object');
    });
    asArray(state.foreshadowing).forEach(function(f){
      if(!isPlainObject(f))return;
      if(typeof f.chapterPlaced!=='number'||f.chapterPlaced<0)errors.push('foreshadowing['+f.id+'].chapterPlaced: invalid');
      if(typeof f.chapterExpected!=='number'||f.chapterExpected<0)errors.push('foreshadowing['+f.id+'].chapterExpected: invalid');
    });
    asArray(state.conflicts).forEach(function(c){if(isPlainObject(c)&&!Array.isArray(c.parties))errors.push('conflicts['+c.id+'].parties: expected array');});
    return{valid:errors.length===0,errors:errors,warnings:warnings,checkedAt:now};
  }

  // structuredDiff: keyed-array aware, returns {changes:[{path,before,after,changeType}]}
  function isKeyedArray(v){return Array.isArray(v)&&v.every(function(x){return isPlainObject(x)&&typeof x.id==='string';});}
  function diffValue(before,after,path,out){
    if(hashObj(before)===hashObj(after))return out;
    if(isKeyedArray(before)&&isKeyedArray(after)){
      var bMap={},aMap={};
      before.forEach(function(x){bMap[x.id]=x;});
      after.forEach(function(x){aMap[x.id]=x;});
      Object.keys(bMap).forEach(function(id){if(!(id in aMap))out.push({path:path+'.'+id,before:bMap[id],after:null,changeType:'remove'});});
      Object.keys(aMap).forEach(function(id){
        if(!(id in bMap))out.push({path:path+'.'+id,before:null,after:aMap[id],changeType:'add'});
        else diffValue(bMap[id],aMap[id],path+'.'+id,out);
      });
      return out;
    }
    if(isPlainObject(before)&&isPlainObject(after)){
      var keys={};
      Object.keys(before).forEach(function(k){keys[k]=1;});
      Object.keys(after).forEach(function(k){keys[k]=1;});
      Object.keys(keys).sort().forEach(function(k){diffValue(before[k],after[k],path+'.'+k,out);});
      return out;
    }
    var bUndef=before===undefined,aUndef=after===undefined;
    out.push({path:path,before:bUndef?null:before,after:aUndef?null:after,changeType:bUndef?'add':(aUndef?'remove':'update')});
    return out;
  }
  function structuredDiff(before,after){
    var changes=diffValue(isPlainObject(before)?before:{},isPlainObject(after)?after:{},'',[]);
    changes.forEach(function(c){if(c.path.charAt(0)==='.')c.path=c.path.slice(1);});
    changes.sort(function(a,b){return a.path<b.path?-1:(a.path>b.path?1:0);});
    return{changes:changes};
  }

  // Controlled path access (the only write path used by ChangeSet apply)
  function collectionOfPath(path){
    var seg=asString(path,'').split('.');
    if(seg[0]==='world'&&seg[1]==='locations')return{key:'world.locations',prefix:'location'};
    if(COLLECTIONS.indexOf(seg[0])>=0)return{key:seg[0],prefix:ID_PREFIX[seg[0]]};
    return null;
  }
  function listOfCollection(key){
    if(key==='world.locations')return _state.world.locations;
    return _state[key];
  }
  function valueAtPath(path){
    var col=collectionOfPath(path);
    if(!col)return undefined;
    var list=listOfCollection(col.key);
    var seg=asString(path,'').split('.');
    var rest=(col.key==='world.locations')?seg.slice(2):seg.slice(1);
    if(rest.length===0)return deepClone(list);
    var item=asArray(list).find(function(x){return x&&x.id===rest[0];});
    if(!item)return undefined;
    var cur=item;
    for(var i=1;i<rest.length;i++){if(cur===undefined||cur===null)return undefined;cur=cur[rest[i]];}
    return cur===undefined?undefined:deepClone(cur);
  }
  function rebuildRelationshipMirror(){
    var byFrom={};
    _state.relationships.forEach(function(r){if(!byFrom[r.fromId])byFrom[r.fromId]=[];byFrom[r.fromId].push({targetId:r.toId,type:r.type});});
    _state.characters.forEach(function(c){c.relations=byFrom[c.id]?byFrom[c.id].slice():[];});
  }
  function applyChangeToState(change){
    if(!isPlainObject(change))return{ok:false,errors:['change: expected object']};
    var path=asString(change.path,'');
    var changeType=asString(change.changeType===undefined?change.type:change.changeType,'update');
    if(CHANGE_TYPES.indexOf(changeType)<0)return{ok:false,errors:['changeType: unknown '+changeType]};
    var col=collectionOfPath(path);
    if(!col)return{ok:false,errors:['path: unsupported '+path]};
    var list=listOfCollection(col.key);
    if(!Array.isArray(list))return{ok:false,errors:['path: collection '+col.key+' is not an array']};
    var seg=path.split('.');
    var rest=(col.key==='world.locations')?seg.slice(2):seg.slice(1);
    if(changeType==='add'){
      var entity=deepClone(change.after);
      if(!isPlainObject(entity))return{ok:false,errors:['add: after must be an object']};
      if(typeof entity.id!=='string'||!entity.id)entity.id=nextEntityId(col.prefix,list);
      if(list.some(function(x){return x&&x.id===entity.id;}))return{ok:false,errors:['add: id exists '+entity.id]};
      list.push(entity);
      if(col.key==='relationships')rebuildRelationshipMirror();
      if(col.key==='conflicts'&&_state.narrative_state.activeConflicts.indexOf(entity.id)<0)_state.narrative_state.activeConflicts.push(entity.id);
      return{ok:true,changeType:'add',path:path,applied:entity};
    }
    var targetId=rest[0];
    var idx=asArray(list).findIndex(function(x){return x&&x.id===targetId;});
    if(idx<0)return{ok:false,errors:['target not found: '+targetId]};
    if(changeType==='remove'){
      var removed=list[idx];
      list.splice(idx,1);
      if(col.key==='conflicts')_state.narrative_state.activeConflicts=_state.narrative_state.activeConflicts.filter(function(id){return id!==removed.id;});
      if(col.key==='relationships')rebuildRelationshipMirror();
      return{ok:true,changeType:'remove',path:path};
    }
    if(rest.length<2)return{ok:false,errors:['update: path must be <collection>.<id>.<field>']};
    var fields=rest.slice(1);
    if(fields[0]==='id')return{ok:false,errors:['update: id is immutable']};
    var target=list[idx];
    var cursor=target;
    for(var i=0;i<fields.length-1;i++){
      if(!isPlainObject(cursor[fields[i]]))cursor[fields[i]]={};
      cursor=cursor[fields[i]];
    }
    cursor[fields[fields.length-1]]=deepClone(change.after);
    if(col.key==='foreshadowing'&&fields[0]==='status'){
      _state.narrative_state.pendingForeshadows=_state.foreshadowing.filter(function(f){return f.status==='pending';}).map(function(f){return f.id;});
    }
    if(col.key==='relationships')rebuildRelationshipMirror();
    return{ok:true,changeType:'update',path:path};
  }

  // Phase 5.1 import pipeline: parse -> migration -> normalization -> validation -> commit
  function pipelineFromRaw(raw){
    var mig=migrateState(raw);
    var norm=normalize(mig.state);
    var validation=validateState(norm.state);
    return{ok:validation.valid,migration:mig.migration,normalized:norm.state,
      normalizationWarnings:norm.warnings||[],validation:validation};
  }
  function commitRaw(raw){
    var r=pipelineFromRaw(raw);
    if(!r.ok)return{ok:false,stage:'validate',errors:r.validation.errors,warnings:r.validation.warnings,migration:r.migration};
    _state=r.normalized;
    persist();
    return{ok:true,migration:r.migration,warnings:(r.validation.warnings||[]).concat(r.normalizationWarnings||[])};
  }

  function load(){
    try{
      var raw=localStorage.getItem(STORAGE_KEY);
      if(raw){
        var res=commitRaw(JSON.parse(raw));
        if(res.ok)return;
        console.error('[StoryStore] load: stored state failed validation, keeping empty state',res.errors);
      }
      var oldNC=localStorage.getItem(OLD_NC_KEY);
      if(oldNC){
        var resNC=commitRaw(JSON.parse(oldNC));
        if(resNC.ok)return;
      }
      var oldWensi=localStorage.getItem(OLD_WENSI_KEY);
      if(oldWensi){
        var books=JSON.parse(oldWensi);
        var book=Array.isArray(books)&&books.length>0?books[0]:null;
        if(book&&book.data){
          var resW=commitRaw(book.data);
          if(resW.ok)return;
        }
      }
    }catch(e){console.error('[StoryStore] load error:',e);}
    _state=createEmptyState();
  }

  var _saveTimer=null;
  function persist(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(_state));}catch(e){console.error('[StoryStore] persist error:',e);}
  }

  // Public API
  return{
    get state(){return _state;},
    getMeta:function(){return _state.meta;},
    setMeta:function(key,val){_state.meta[key]=val;persist();},
    // Chapters
    getChapters:function(){return _state.chapters;},
    getChapter:function(id){return _state.chapters.find(function(c){return c.id===id;});},
    getChapterByIdx:function(idx){return _state.chapters[idx];},
    addChapter:function(data){var ch={id:uid(),title:data.title||('第'+(_state.chapters.length+1)+'章'),content:data.content||'',summary:data.summary||'',wordCount:data.wordCount||0,status:'未写',order:_state.chapters.length,aiAnalysis:{characters:[],locations:[],events:[],foreshadowHits:[],emotions:[],timeHints:[],lastParsed:0}};_state.chapters.push(ch);persist();return ch;},
    updateChapter:function(id,patch){var ch=this.getChapter(id);if(!ch)return null;for(var k in patch)if(k!=='id')ch[k]=patch[k];persist();return ch;},
    deleteChapter:function(id){var idx=_state.chapters.findIndex(function(c){return c.id===id;});if(idx<0)return false;_state.chapters.splice(idx,1);_state.chapters.forEach(function(c,i){c.order=i;});persist();return true;},
    // Characters
    getCharacters:function(){return _state.characters;},

// ===== StoryEngine =====
var StoryEngine={
  parseText:function(text){
    var result={characters:[],foreshadows:[],events:[],timeHints:[],emotions:[],locations:[]};
    if(!text||!text.trim())return result;
    var fsMatches=text.match(/\[\[伏笔:([^\]]+)\]\]/g)||[];
    fsMatches.forEach(function(m){var content=m.replace(/^\[\[伏笔:/,'').replace(/\]\]$/,'');result.foreshadows.push({content:content.replace(/^FS\w+\s*/,''),raw:m});});
    var knownChars=StoryStore.getCharacters().map(function(c){return c.name;}).filter(function(n){return n&&n!=='未命名';});
    knownChars.forEach(function(name){if(!name)return;var regex=new RegExp(name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');var matches=text.match(regex);if(matches)result.characters.push({name:name,count:matches.length});});
    var newNames=this._detectNewNames(text,knownChars);
    newNames.forEach(function(n){result.characters.push({name:n,count:1,isNew:true});});
    var locKeywords=['客栈','宗门','森林','宫殿','山洞','城市','村庄','山谷','河边','桥上'];
    var knownLocs=StoryStore.getWorld().locations.map(function(l){return l.name;}).filter(function(n){return n;});
    knownLocs.concat(locKeywords).forEach(function(loc){if(text.indexOf(loc)>=0)result.locations.push(loc);});
    var exclCount=(text.match(/[！!]/g)||[]).length;
    var quesCount=(text.match(/[？?]/g)||[]).length;
    if(exclCount>3)result.emotions.push('excited');
    if(quesCount>3)result.emotions.push('suspense');
    var eventKeywords=['杀','战','逃','救','发现','背叛','突破','觉醒','结婚','死亡','出生'];
    eventKeywords.forEach(function(kw){if(text.indexOf(kw)>=0)result.events.push(kw);});
    var timePatterns=['第二天','三天后','一年后','夜晚','清晨','黄昏','黎明','三年后','十年后','片刻后','与此同时'];
    timePatterns.forEach(function(tp){if(text.indexOf(tp)>=0)result.timeHints.push(tp);});
    return result;
  },
  _detectNewNames:function(text,knownChars){
    var candidates=text.match(/[\u4e00-\u9fa5]{2,4}/g)||[];
    var freq={};
    candidates.forEach(function(c){freq[c]=(freq[c]||0)+1;});
    return Object.keys(freq).filter(function(k){return freq[k]>=2&&!knownChars.includes(k)&&k.length>=2&&k.length<=4;}).sort(function(a,b){return freq[b]-freq[a];}).slice(0,5);
  },
  syncFromChapter:function(content,chapterIdx){
    var parseResult=this.parseText(content);
    StoryStore.setLastParseResult(parseResult);
    var ch=StoryStore.getChapterByIdx(chapterIdx);
    if(ch){
      ch.aiAnalysis={
        characters:parseResult.characters.map(function(c){return c.name;}),
        locations:Array.from(new Set(parseResult.locations)),
        events:Array.from(new Set(parseResult.events)),
        foreshadowHits:parseResult.foreshadows.map(function(f){return f.content;}),
        emotions:parseResult.emotions,
        timeHints:parseResult.timeHints,
        lastParsed:0
      };
    }
    // Update character presence - idempotent
    parseResult.characters.forEach(function(pc){
      var char=StoryStore.getCharacters().find(function(c){return c.name===pc.name;});
      if(char&&!pc.isNew){
        if(char.presence.chapterIds.indexOf(chapterIdx)<0)char.presence.chapterIds.push(chapterIdx);
        // Only increment if this chapter is new
        if(char.presence.lastAppear<chapterIdx){char.presence.appearCount+=pc.count;char.presence.lastAppear=chapterIdx;}
        if(char.presence.firstAppear===0||char.presence.firstAppear>chapterIdx)char.presence.firstAppear=chapterIdx;
      }
    });
    // Update characterPresence map
    var presence={};
    StoryStore.getCharacters().forEach(function(c){presence[c.name]=c.presence.appearCount;});
    StoryStore.setNarrativeState('characterPresence',presence);
    StoryStore.persist();
    // [StoryEngine] parse complete
    return parseResult;
  },
  // ===== Phase 5.1: parse-only proposal. Never writes StoryState. =====
  proposeChapterChanges:function(content,chapterIdx,options){
    var chapter=StoryStore.getChapterByIdx(chapterIdx);
    if(!chapter)return null;
    var text=content||'';
    var parsed=this.parseText(text);
    var createdAt=(options&&typeof options.now==='number')?options.now:Date.now();
    var drafts=[];

    function evidenceFor(needle){
      var s=String(needle||'');
      var idx=text.indexOf(s);
      var start=idx<0?0:idx;
      return StoryContract.makeEvidence('chapter',chapter.id,start,start+s.length,text.substr(start,s.length));
    }
    function targetOf(entityType,entityId,displayName){
      return{entityType:entityType,entityId:entityId,displayName:displayName||''};
    }

    // 1) chapter.aiAnalysis
    var beforeAnalysis=StoryStore.valueAtPath('chapters.'+chapter.id+'.aiAnalysis');
    var afterAnalysis={
      characters:parsed.characters.map(function(c){return c.name;}),
      locations:Array.from(new Set(parsed.locations)),
      events:Array.from(new Set(parsed.events)),
      foreshadowHits:parsed.foreshadows.map(function(f){return f.content;}),
      emotions:parsed.emotions.slice(),
      timeHints:parsed.timeHints.slice(),
      lastParsed:createdAt
    };
    drafts.push({
      actionId:'chapter:'+chapter.id+':aiAnalysis',
      type:'update',
      target:targetOf('chapter',chapter.id,chapter.title),
      path:'chapters.'+chapter.id+'.aiAnalysis',
      before:beforeAnalysis,
      after:afterAnalysis,
      reason:'章节解析：结构化标注（人物/地点/事件/伏笔/情绪/时间提示）',
      evidence:[StoryContract.makeEvidence('chapter',chapter.id,0,text.length,text.slice(0,80))]
    });

    // 2) existing character presence (idempotent with legacy syncFromChapter semantics)
    parsed.characters.forEach(function(pc){
      if(pc.isNew)return;
      var char=StoryStore.getCharacters().find(function(c){return c.name===pc.name;});
      if(!char)return;
      var beforePresence=StoryStore.valueAtPath('characters.'+char.id+'.presence')||{};
      var afterPresence=JSON.parse(JSON.stringify(beforePresence));
      afterPresence.chapterIds=Array.isArray(afterPresence.chapterIds)?afterPresence.chapterIds:[];
      if(afterPresence.chapterIds.indexOf(chapterIdx)<0)afterPresence.chapterIds.push(chapterIdx);
      if((afterPresence.lastAppear||0)<chapterIdx){
        afterPresence.appearCount=(afterPresence.appearCount||0)+pc.count;
        afterPresence.lastAppear=chapterIdx;
      }
      if(!afterPresence.firstAppear||afterPresence.firstAppear>chapterIdx)afterPresence.firstAppear=chapterIdx;
      drafts.push({
        actionId:'chapter:'+chapter.id+':presence:'+char.id,
        type:'update',
        target:targetOf('character',char.id,char.name),
        path:'characters.'+char.id+'.presence',
        before:beforePresence,
        after:afterPresence,
        reason:'章节解析：角色出场统计',
        evidence:[evidenceFor(pc.name)]
      });
    });

    // 3) new characters (deterministic ids, no randomness)
    var reservedCharIds=[];
    parsed.characters.forEach(function(pc){
      if(!pc.isNew)return;
      if(StoryStore.getCharacters().some(function(c){return c.name===pc.name;}))return;
      var id=StoryStore.nextId('characters',reservedCharIds);
      if(!id)return;
      reservedCharIds.push(id);
      drafts.push({
        actionId:'chapter:'+chapter.id+':character:add:'+pc.name,
        type:'add',
        target:targetOf('character',id,pc.name),
        path:'characters.'+id,
        before:null,
        after:{id:id,name:pc.name,gender:'',age:'',charType:'supporting',tags:[],fields:{},relations:[],
          presence:{firstAppear:chapterIdx,lastAppear:chapterIdx,chapterIds:[chapterIdx],appearCount:pc.count||1},
          aiProfile:{arcStage:'',consistencyScore:100,importance:5}},
        reason:'章节解析：发现新角色',
        evidence:[evidenceFor(pc.name)]
      });
    });

    // 4) new foreshadowing entities from [[伏笔:...]] markers
    var reservedFsIds=[];
    parsed.foreshadows.forEach(function(f){
      if(StoryStore.getForeshadows().some(function(x){return x.content===f.content;}))return;
      var id=StoryStore.nextId('foreshadowing',reservedFsIds);
      if(!id)return;
      reservedFsIds.push(id);
      drafts.push({
        actionId:'chapter:'+chapter.id+':foreshadow:add:'+f.content,
        type:'add',
        target:targetOf('foreshadow',id,f.content),
        path:'foreshadowing.'+id,
        before:null,
        after:{id:id,content:f.content,chapterPlaced:chapterIdx,chapterExpected:0,status:'pending',note:'',linkedChapterId:null},
        reason:'章节解析：发现伏笔标记',
        evidence:[evidenceFor(f.raw||f.content)]
      });
    });

    return ChangeSetRuntime.propose({
      source:'StoryEngine.proposeChapterChanges',
      operation:'parse_chapter',
      changes:drafts,
      baseStateHash:StoryStore.hash(StoryStore.state)
    },{now:createdAt});
  }
};

  var prevChapters=s.chapters.slice(0,chapterIdx).map(function(c,i){return{index:i,title:c.title,summary:(c.summary||'').slice(0,80),wordCount:c.wordCount||0,characters:c.aiAnalysis?c.aiAnalysis.characters:[]};});
  var protagonist=s.characters.find(function(c){return c.charType==='protagonist';});
  return{
    storyState:{
      meta:{title:s.meta.title,genre:s.meta.genre,chapterCount:s.chapters.length,characterCount:s.characters.length,foreshadowCount:s.foreshadowing.length,conflictCount:s.conflicts.length},
      narrative_state:s.narrative_state,

      foreshadowing:s.foreshadowing.filter(function(f){return f.status==='pending';}).map(function(f){return{id:f.id,content:f.content,chapterPlaced:f.chapterPlaced,chapterExpected:f.chapterExpected,status:f.status};}),
      conflicts:s.conflicts.map(function(c){return{id:c.id,description:c.description,status:c.status,parties:c.parties};}),
      timeline:s.timeline.slice(-5),
      chapters:s.chapters
    },
    chapter:{index:chapterIdx,title:ch.title||'',contentPreview:(ch.content||'').slice(-500),wordCount:ch.wordCount||0,status:ch.status||'未写',parsedCharacters:ch.aiAnalysis?ch.aiAnalysis.characters:[]},
    analysis:{protagonist:protagonist?protagonist.name:'',antagonists:s.characters.filter(function(c){return c.tags&&c.tags.some(function(t){return['反派','敌人','宿敌'].includes(t);})||c.relations&&c.relations.some(function(r){return r.type==='仇敌';});}).map(function(c){return c.name;}),recentEvents:s.timeline.slice(-3).map(function(t){return t.event;}),paceScore:s.narrative_state.paceScore,tensionLevel:s.narrative_state.tensionLevel,issues:s.narrative_state.issues},
    context:{prevChapters:prevChapters,genreConfig:GENRE_CONFIG[s.meta.genre]||GENRE_CONFIG.other}
  };
}

// ===== Phase 5.1: Runtime Contracts (pure data only, no executable values) =====
var CONTRACT_VERSION='5.1';
var StoryContract=(function(){
  var STATUS={PROPOSED:'PROPOSED',VALIDATING:'VALIDATING',VALID:'VALID',APPROVED:'APPROVED',
    APPLIED:'APPLIED',VERIFIED:'VERIFIED',REJECTED:'REJECTED',FAILED:'FAILED'};
  var STATUS_LIST=['PROPOSED','VALIDATING','VALID','APPROVED','APPLIED','VERIFIED','REJECTED','FAILED'];
  var CHANGE_TYPES=['add','remove','update'];

  function isPlainObject(v){return!!v&&typeof v==='object'&&!Array.isArray(v);}
  function collectFunctionPaths(value,path,out){
    out=out||[];path=path||'$';
    if(typeof value==='function'){out.push(path);return out;}
    if(Array.isArray(value)){value.forEach(function(v,i){collectFunctionPaths(v,path+'['+i+']',out);});return out;}
    if(isPlainObject(value)){Object.keys(value).forEach(function(k){collectFunctionPaths(value[k],path+'.'+k,out);});return out;}
    return out;
  }
  function deterministicId(prefix,payload){return prefix+'_'+StoryStore.hash(payload);}

  // --- contract factories (pure data) ---
  function makeEntityRef(entityType,entityId,displayName){
    return{entityType:String(entityType||''),entityId:String(entityId||''),displayName:String(displayName||'')};
  }
  function makeEvidence(sourceType,sourceId,start,end,excerpt){
    return{sourceType:String(sourceType||''),sourceId:String(sourceId||''),
      start:(typeof start==='number'?start:0),end:(typeof end==='number'?end:0),excerpt:String(excerpt||'')};
  }
  function makeStateChange(fields){
    fields=fields||{};
    var t=fields.target||{};
    return{
      changeId:String(fields.changeId||''),
      actionId:String(fields.actionId||''),
      type:String(fields.type||'update'),
      target:makeEntityRef(t.entityType,t.entityId,t.displayName),
      path:String(fields.path||''),
      before:(fields.before===undefined?null:fields.before),
      after:(fields.after===undefined?null:fields.after),
      reason:String(fields.reason||''),
      evidence:(Array.isArray(fields.evidence)?fields.evidence:[]).map(function(e){
        return makeEvidence(e&&e.sourceType,e&&e.sourceId,e&&e.start,e&&e.end,e&&e.excerpt);
      }),
      timestamp:(typeof fields.timestamp==='number'?fields.timestamp:0)
    };
  }
  function makeChangeSet(fields){
    fields=fields||{};
    return{
      changeSetId:String(fields.changeSetId||''),
      source:String(fields.source||''),
      operation:String(fields.operation||''),
      changes:(Array.isArray(fields.changes)?fields.changes:[]).slice(),
      createdAt:(typeof fields.createdAt==='number'?fields.createdAt:0),
      status:String(fields.status||STATUS.PROPOSED),
      baseStateHash:String(fields.baseStateHash||''),
      approval:(fields.approval===undefined?null:fields.approval),
      errors:(Array.isArray(fields.errors)?fields.errors:[]).slice(),
      warnings:(Array.isArray(fields.warnings)?fields.warnings:[]).slice()
    };
  }
  function makeValidationResult(valid,errors,warnings,checkedAt){
    return{valid:!!valid,errors:(errors||[]).slice(),warnings:(warnings||[]).slice(),
      checkedAt:(typeof checkedAt==='number'?checkedAt:0)};
  }
  function makeChangeSetId(source,operation,changes){
    return deterministicId('cs',{source:String(source||''),operation:String(operation||''),
      shape:(changes||[]).map(function(c){return{actionId:c.actionId,type:c.type,path:c.path};})});
  }
  function makeChangeId(changeSetId,path,index){return deterministicId('chg',changeSetId+'|'+path+'|'+index);}

  // --- contract validation ---
  function validateChangeSet(changeSet,checkedAt){
    var errors=[],warnings=[];
    if(!isPlainObject(changeSet))return makeValidationResult(false,['changeSet: expected plain object'],[],checkedAt);
    if(typeof changeSet.changeSetId!=='string'||changeSet.changeSetId.indexOf('cs_')!==0)errors.push('changeSetId: must be a cs_ id');
    if(!changeSet.source)errors.push('source: required');
    if(!changeSet.operation)errors.push('operation: required');
    if(!Array.isArray(changeSet.changes))errors.push('changes: expected array');
    if(STATUS_LIST.indexOf(changeSet.status)<0)errors.push('status: unknown '+changeSet.status);
    if(typeof changeSet.createdAt!=='number')errors.push('createdAt: expected number');
    if(typeof changeSet.baseStateHash!=='string'||!changeSet.baseStateHash)warnings.push('baseStateHash: missing (stale detection disabled)');
    var fnPaths=collectFunctionPaths(changeSet);
    if(fnPaths.length)errors.push('changeSet: executable values at '+fnPaths.join(', '));
    (changeSet.changes||[]).forEach(function(ch,idx){
      var at='changes['+idx+']';
      if(!isPlainObject(ch)){errors.push(at+': expected object');return;}
      if(typeof ch.changeId!=='string'||ch.changeId.indexOf('chg_')!==0)errors.push(at+'.changeId: must be a chg_ id');
      if(!ch.actionId)errors.push(at+'.actionId: required');
      if(CHANGE_TYPES.indexOf(ch.type)<0)errors.push(at+'.type: must be add|remove|update');
      if(!isPlainObject(ch.target)||!ch.target.entityType||!ch.target.entityId)errors.push(at+'.target: entityType and entityId required');
      if(typeof ch.path!=='string'||ch.path.split('.').length<2)errors.push(at+'.path: must be a dotted path');
      if(typeof ch.reason!=='string'||!ch.reason)warnings.push(at+'.reason: empty');
      if(typeof ch.timestamp!=='number')errors.push(at+'.timestamp: expected number');
      if(!('before' in ch)||!('after' in ch))errors.push(at+': before and after are required (may be null)');
      if(!Array.isArray(ch.evidence))errors.push(at+'.evidence: expected array');
      else ch.evidence.forEach(function(e,i){
        if(!isPlainObject(e)){errors.push(at+'.evidence['+i+']: expected object');return;}
        if(!e.sourceType)errors.push(at+'.evidence['+i+'].sourceType: required');
        if(typeof e.sourceId!=='string')errors.push(at+'.evidence['+i+'].sourceId: expected string');
        if(typeof e.start!=='number'||typeof e.end!=='number')errors.push(at+'.evidence['+i+']: start/end must be numbers');
      });
    });
    return makeValidationResult(errors.length===0,errors,warnings,checkedAt);
  }

  return{
    CONTRACT_VERSION:CONTRACT_VERSION,STATUS:STATUS,STATUS_LIST:STATUS_LIST,CHANGE_TYPES:CHANGE_TYPES,
    makeEntityRef:makeEntityRef,makeEvidence:makeEvidence,makeStateChange:makeStateChange,
    makeChangeSet:makeChangeSet,makeValidationResult:makeValidationResult,
    makeChangeSetId:makeChangeSetId,makeChangeId:makeChangeId,
    validateChangeSet:validateChangeSet,collectFunctionPaths:collectFunctionPaths
  };
})();

// ===== Phase 5.1: ChangeSet lifecycle runtime =====
var ChangeSetRuntime=(function(){
  var S=StoryContract.STATUS;

  function isPlainObject(v){return!!v&&typeof v==='object'&&!Array.isArray(v);}
  function nowOf(options){return(options&&typeof options.now==='number')?options.now:Date.now();}
  function currentStateHash(){return StoryStore.hash(StoryStore.state);}
  function ledger(){return StoryStore.getChangeLedger();}
  function isAlreadyApplied(changeSetId){
    return ledger().some(function(e){return e.changeSetId===changeSetId&&(e.status===S.APPLIED||e.status===S.VERIFIED);});
  }
  function padIdx(n){var s=String(n);while(s.length<3)s='0'+s;return s;}

  function propose(input,options){
    input=input||{};
    var createdAt=nowOf(options);
    var shape=(input.changes||[]).map(function(c,idx){
      return{
        actionId:c.actionId||('action_'+padIdx(idx+1)),
        type:c.type||'update',
        target:c.target||{entityType:'state',entityId:'state',displayName:''},
        path:c.path||'',
        before:(c.before===undefined?null:c.before),
        after:(c.after===undefined?null:c.after),
        reason:c.reason||'',
        evidence:c.evidence||[],
        timestamp:(c.timestamp===undefined?createdAt:c.timestamp)
      };
    });
    var changeSetId=StoryContract.makeChangeSetId(input.source||'',input.operation||'',shape);
    var changes=shape.map(function(c,idx){
      return StoryContract.makeStateChange({
        changeId:StoryContract.makeChangeId(changeSetId,c.path,idx),
        actionId:c.actionId,type:c.type,target:c.target,path:c.path,before:c.before,after:c.after,
        reason:c.reason,evidence:c.evidence,timestamp:c.timestamp
      });
    });
    return StoryContract.makeChangeSet({
      changeSetId:changeSetId,source:input.source||'',operation:input.operation||'',changes:changes,
      createdAt:createdAt,status:S.PROPOSED,baseStateHash:input.baseStateHash||currentStateHash()
    });
  }

  function validate(changeSet,options){
    var at=nowOf(options);
    if(!isPlainObject(changeSet))return{ok:false,status:S.REJECTED,validation:StoryContract.makeValidationResult(false,['changeSet: expected object'],[],at)};
    changeSet.status=S.VALIDATING;
    var validation=StoryContract.validateChangeSet(changeSet,at);
    var errors=validation.errors.slice(),warnings=validation.warnings.slice();
    changeSet.warnings=warnings;
    if(errors.length){
      changeSet.status=S.REJECTED;changeSet.errors=errors;
      return{ok:false,status:S.REJECTED,validation:StoryContract.makeValidationResult(false,errors,warnings,at)};
    }
    changeSet.errors=[];changeSet.status=S.VALID;
    return{ok:true,status:S.VALID,validation:StoryContract.makeValidationResult(true,[],warnings,at)};
  }

  function approve(changeSet,approver,options){
    if(!isPlainObject(changeSet))return{ok:false,status:null,errors:['changeSet: expected object']};
    if(changeSet.status===S.PROPOSED){
      var v=validate(changeSet,options);
      if(!v.ok)return{ok:false,status:changeSet.status,errors:v.validation.errors};
    }
    if(changeSet.status!==S.VALID)return{ok:false,status:changeSet.status,errors:['approve: status must be VALID, got '+changeSet.status]};
    changeSet.status=S.APPROVED;
    changeSet.approval={approver:String(approver||'author'),approvedAt:nowOf(options)};
    return{ok:true,status:S.APPROVED,errors:[]};
  }

  function reject(changeSet,reason,options){
    if(!isPlainObject(changeSet))return{ok:false,status:null,errors:['changeSet: expected object']};
    changeSet.status=S.REJECTED;
    changeSet.rejection={reason:String(reason||''),rejectedAt:nowOf(options)};
    return{ok:true,status:S.REJECTED,errors:[]};
  }

  function checkPreconditions(changeSet){
    var failures=[];
    (changeSet.changes||[]).forEach(function(ch){
      if(ch.type==='add')return;
      var current=StoryStore.valueAtPath(ch.path);
      var expected=(ch.before===undefined?null:ch.before);
      if(current===undefined&&expected===null)return;
      if(StoryStore.hash(current)!==StoryStore.hash(expected))failures.push(ch.path);
    });
    return failures;
  }

  function verify(changeSet,before,after,options){
    var errors=[],warnings=[];
    var diff=StoryStore.structuredDiff(before,after);
    var byPath={};
    diff.changes.forEach(function(c){byPath[c.path]=c;});
    var proposed={};
    (changeSet.changes||[]).forEach(function(ch){
      proposed[ch.path]=true;
      var observed=byPath[ch.path];
      if(!observed){errors.push('verify: no observed change at '+ch.path);return;}
      if(observed.changeType!==ch.type)errors.push('verify: '+ch.path+' expected '+ch.type+' observed '+observed.changeType);
      if(StoryStore.hash(observed.after)!==StoryStore.hash(ch.after))errors.push('verify: '+ch.path+' after value mismatch');
    });
    diff.changes.forEach(function(c){if(!proposed[c.path])warnings.push('verify: unproposed change at '+c.path);});
    return{valid:errors.length===0,errors:errors,warnings:warnings,checkedAt:nowOf(options),changes:diff.changes};
  }

  function apply(changeSet,options){
    var at=nowOf(options);
    if(!isPlainObject(changeSet))return{ok:false,status:null,errors:['changeSet: expected object']};
    // gate 1: contract validity
    var validation=StoryContract.validateChangeSet(changeSet,at);
    if(!validation.valid){
      changeSet.status=S.REJECTED;changeSet.errors=validation.errors;
      return{ok:false,status:S.REJECTED,errors:validation.errors};
    }
    // gate 2: duplicate (never apply the same ChangeSet twice)
    if(isAlreadyApplied(changeSet.changeSetId))return{ok:false,status:changeSet.status,errors:['duplicate_changeset']};
    // gate 3: stale base state (must not overwrite newer state)
    if(changeSet.baseStateHash&&changeSet.baseStateHash!==currentStateHash()){
      return{ok:false,status:changeSet.status,errors:['stale_changeset']};
    }
    // gate 4: preconditions (before must match current state)
    var failed=checkPreconditions(changeSet);
    if(failed.length)return{ok:false,status:changeSet.status,errors:['precondition_failed: '+failed.join(', ')],paths:failed};
    // gate 5: approval
    if(changeSet.status!==S.APPROVED)return{ok:false,status:changeSet.status,errors:['changeset_not_approved']};

    var before=StoryStore.snapshot();
    changeSet.status=S.APPLIED;
    var results=[];
    try{
      results=AIExecutionLayerBridge.applyChangeSet(changeSet);
    }catch(e){
      StoryStore.rollback(before);
      changeSet.status=S.FAILED;changeSet.errors=[String((e&&e.message)||e)];
      return{ok:false,status:S.FAILED,errors:changeSet.errors};
    }
    var failedWrites=results.filter(function(r){return !r.ok;});
    if(failedWrites.length){
      StoryStore.rollback(before);
      changeSet.status=S.FAILED;
      changeSet.errors=failedWrites.map(function(r){return r.path+': '+(r.errors||[]).join('; ');});
      return{ok:false,status:S.FAILED,errors:changeSet.errors,results:results};
    }
    var after=StoryStore.snapshot();
    var verification=verify(changeSet,before,after,options);
    if(!verification.valid){
      StoryStore.rollback(before);
      changeSet.status=S.FAILED;changeSet.errors=verification.errors;
      return{ok:false,status:S.FAILED,errors:verification.errors,verification:verification};
    }
    changeSet.status=S.VERIFIED;
    StoryStore.appendChangeLedger({
      changeSetId:changeSet.changeSetId,source:changeSet.source,operation:changeSet.operation,
      status:S.VERIFIED,appliedAt:at,appliedCount:results.length,
      stateHashBefore:StoryStore.hash(before),stateHashAfter:StoryStore.hash(after)
    });
    return{ok:true,status:S.VERIFIED,results:results,verification:verification,changes:verification.changes};
  }

  function getLedger(){return ledger().slice();}
  function resetLedger(){StoryStore.clearChangeLedger();}

  return{
    STATUS:S,propose:propose,validate:validate,approve:approve,reject:reject,apply:apply,verify:verify,
    getLedger:getLedger,resetLedger:resetLedger,checkPreconditions:checkPreconditions
  };
})();

function runCopilot(){
  if(!curChId)return;
  var ch=StoryStore.getChapter(curChId);if(!ch)return;
  var idx=StoryStore.getChapters().indexOf(ch);
  var result=AIRuntime.runActionPlan(idx);
  _lastActionPlans=result.plans;
  // Render issues
  var issuesEl=document.getElementById('copilotIssues');if(issuesEl){
    if(result.analysis.issues.length===0){issuesEl.innerHTML='<p class="text-muted text-sm">未发现问题</p>';}
    else{issuesEl.innerHTML=result.analysis.issues.map(function(i){return'<div class="action-card severity-'+(i.severity==='critical'?'critical':i.severity==='warning'?'warning':'info')+'"><div class="action-header"><span class="action-title">'+i.type+'</span><span class="badge badge-'+(i.severity==='critical'?'danger':i.severity==='warning'?'warning':'info')+'">'+i.severity+'</span></div><div class="action-desc">'+i.reason+'</div></div>';}).join('');}
  }
  // Render action plans
  var actionsEl=document.getElementById('copilotActions');if(actionsEl){
    if(result.plans.length===0){actionsEl.innerHTML='<p class="text-muted text-sm">无建议动作</p>';}
    else{actionsEl.innerHTML=result.plans.map(function(p){var sev=p.priority>=8?'critical':p.priority>=5?'warning':'info';return'<div class="action-card severity-'+sev+'"><div class="action-header"><span class="action-title">'+p.action+'</span><span class="badge badge-'+(p.priority>=8?'danger':p.priority>=5?'warning':'info')+'">P'+p.priority+'</span></div><div class="action-desc">'+p.reason+'</div>'+(p.requiresApproval?'<div class="action-actions"><button class="btn btn-sm btn-primary" onclick="approveAction(\''+p.id+'\')">采用</button><button class="btn btn-sm" onclick="rejectAction(\''+p.id+'\')">忽略</button></div>':'<div class="badge badge-info">诊断</div>')+'</div>';}).join('');}
  }
}

function approveAction(planId){
  var plan=_lastActionPlans.find(function(p){return p.id===planId;});if(!plan)return;
  var result=AIRuntime.ActionPlan.executeWithApproval([plan],[planId]);
  toast('已执行: '+plan.action,'success');
  runCopilot();
}
function rejectAction(planId){
  _lastActionPlans=_lastActionPlans.filter(function(p){return p.id!==planId;});
  toast('已忽略','info');
  var actionsEl=document.getElementById('copilotActions');if(actionsEl){
    actionsEl.innerHTML=_lastActionPlans.map(function(p){var sev=p.priority>=8?'critical':p.priority>=5?'warning':'info';return'<div class="action-card severity-'+sev+'"><div class="action-header"><span class="action-title">'+p.action+'</span></div><div class="action-desc">'+p.reason+'</div></div>';}).join('')||'<p class="text-muted text-sm">无建议动作</p>';
  }
}

function runConsistencyCheck(){
  var s=StoryStore.state;
  var ctx=buildAIContext(Math.max(0,s.chapters.length-1));
  var result=AIDecisionLayer.evaluate(ctx);
  var el=document.getElementById('consistencyResults');if(!el)return;
  var dims=[
    {icon:'⏰',name:'时间线一致性',rule:'timeline_conflict',desc:'检查故事时间线是否有矛盾'},
    {icon:'👤',name:'人物年龄/能力',rule:'power_level_conflict',desc:'检查人物能力是否超出当前境界'},
    {icon:'🔗',name:'人物关系',rule:'relationship_inconsistency',desc:'检查人物关系是否有矛盾'},
    {icon:'⚙️',name:'世界观规则',rule:'world_rule_conflict',desc:'检查世界观设定是否有矛盾'},
    {icon:'📌',name:'伏笔遗漏',rule:'foreshadow_overdue',desc:'检查是否有未回收的伏笔'},
    {icon:'📊',name:'角色一致性',rule:'character_inconsistency',desc:'检查角色行为是否一致'},
    {icon:'🚶',name:'闲置角色',rule:'unused_character',desc:'检查是否有未出场的角色'},
    {icon:'📈',name:'弧光停滞',rule:'arc_stagnation',desc:'检查主角成长弧光是否停滞'}
  ];
  el.innerHTML='<div class="card">'+dims.map(function(d){
    var issue=result.issues.find(function(i){return i.type===d.rule;});
    var pass=!issue;
    return'<div class="consistency-item"><span class="consistency-icon">'+d.icon+'</span><div class="consistency-content"><div class="consistency-name">'+d.name+(pass?' <span class="badge badge-success">通过</span>':' <span class="badge badge-danger">问题</span>')+'</div><div class="consistency-desc">'+(pass?d.desc:issue.reason)+'</div></div></div>';
  }).join('')+'</div><div class="card"><div class="card-title">检查摘要</div><p class="text-sm">通过: '+dims.filter(function(d){return!result.issues.find(function(i){return i.type===d.rule;});}).length+'/'+dims.length+'</p><p class="text-sm">问题: '+result.issues.length+'</p><p class="text-sm">建议: '+result.decisions.length+'</p><p class="text-muted text-sm mt-1">检查基于真实 StoryState 数据和规则系统，无随机模拟。</p></div>';
  toast('一致性检查完成','success');
}

function runRegressionTests(){
  var result=AIRuntime.runRegressionTests();
  var el=document.getElementById('aiRuntimeResult');if(!el)return;
  el.innerHTML='<div class="card"><div class="card-title">回归测试结果</div>'+result.results.map(function(r){return'<div class="consistency-item"><span class="consistency-icon">'+(r.pass?'✅':'❌')+'</span><div class="consistency-content"><div class="consistency-name">Test '+r.id+': '+r.name+'</div><div class="consistency-desc">'+(r.pass?'通过':'失败')+'</div></div></div>';}).join('')+'<p class="text-sm mt-1">总计: '+result.results.filter(function(r){return r.pass;}).length+'/'+result.results.length+' 通过</p></div>';
  toast('回归测试完成: '+result.results.filter(function(r){return r.pass;}).length+'/'+result.results.length+'通过',result.allPass?'success':'error');
}

function showCharModal(charId){
  var c=charId?StoryStore.getCharacter(charId):null;
  showModal('人物'+(c?'编辑':'新建'),'<div class="form-group"><label class="form-label">姓名</label><input class="form-input" id="m-char-name" value="'+(c?c.name:'')+'" /></div><div class="grid grid-2"><div class="form-group"><label class="form-label">性别</label><input class="form-input" id="m-char-gender" value="'+(c?c.gender:'')+'" /></div><div class="form-group"><label class="form-label">年龄</label><input class="form-input" id="m-char-age" value="'+(c?c.age:'')+'" /></div></div><div class="form-group"><label class="form-label">类型</label><select class="form-select" id="m-char-type"><option value="protagonist"'+(c&&c.charType==='protagonist'?' selected':'')+'>主角</option><option value="supporting"'+(!c||c.charType==='supporting'?' selected':'')+'>配角</option><option value="antagonist"'+(c&&c.charType==='antagonist'?' selected':'')+'>反派</option></select></div><div class="form-group"><label class="form-label">能力</label><textarea class="form-textarea" id="m-char-ability">'+(c&&c.fields?c.fields.ability||'':'')+'</textarea></div><div class="form-group"><label class="form-label">背景</label><textarea class="form-textarea" id="m-char-bg">'+(c&&c.fields?c.fields.background||'':'')+'</textarea></div><div class="flex gap-1 mt-2"><button class="btn btn-primary" onclick="saveCharFromModal('+(c?"'"+c.id+"'":'null')+')" style="flex:1">'+(c?'保存':'创建')+'</button>'+(c?'<button class="btn btn-danger" onclick="deleteChar(\''+c.id+'\')">删除</button>':'')+'</div>');
}

function saveCharFromModal(id){
  var data={name:document.getElementById('m-char-name').value.trim()||'未命名',gender:document.getElementById('m-char-gender').value,age:document.getElementById('m-char-age').value,charType:document.getElementById('m-char-type').value,fields:{ability:document.getElementById('m-char-ability').value,background:document.getElementById('m-char-bg').value}};
  if(id){StoryStore.updateCharacter(id,data);}else{StoryStore.addCharacter(data);}
  closeModal();rChar(document.getElementById('page-characters'));renderSidebar('characters');toast('已保存','success');
}
function deleteChar(id){if(!confirm('确认删除？'))return;StoryStore.deleteCharacter(id);closeModal();rChar(document.getElementById('page-characters'));renderSidebar('characters');toast('已删除','success');}

function showForeshadowModal(){
  showModal('添加伏笔','<div class="form-group"><label class="form-label">伏笔内容</label><textarea class="form-textarea" id="m-fs-content"></textarea></div><div class="grid grid-2"><div class="form-group"><label class="form-label">埋设章节</label><input class="form-input" type="number" id="m-fs-plant" value="0" /></div><div class="form-group"><label class="form-label">预期回收章节</label><input class="form-input" type="number" id="m-fs-resolve" value="0" /></div></div><button class="btn btn-primary w-full" onclick="saveForeshadow()">添加</button>');
}
function saveForeshadow(){StoryStore.addForeshadow({content:document.getElementById('m-fs-content').value,chapterPlaced:parseInt(document.getElementById('m-fs-plant').value)||0,chapterExpected:parseInt(document.getElementById('m-fs-resolve').value)||0});closeModal();rPlot(document.getElementById('page-plot'));toast('已添加','success');}

function showWBModal(){
  var cats=['地图','国家','宗门','城市','秘境','组织','势力','职业','境界','技能','功法','法宝','装备','货币','植物','妖兽','种族','历史','神话'];
  showModal('新增世界观设定','<div class="form-group"><label class="form-label">分类</label><select class="form-select" id="m-wb-cat">'+cats.map(function(c){return'<option value="'+c+'">'+c+'</option>';}).join('')+'</select></div><div class="form-group"><label class="form-label">名称</label><input class="form-input" id="m-wb-name" /></div><div class="form-group"><label class="form-label">描述</label><textarea class="form-textarea" id="m-wb-desc"></textarea></div><button class="btn btn-primary w-full" onclick="saveWB()">添加</button>');
}
function saveWB(){var name=document.getElementById('m-wb-name').value.trim();if(!name){toast('请输入名称','error');return;}StoryStore.addLocation({name:name,category:document.getElementById('m-wb-cat').value,description:document.getElementById('m-wb-desc').value});closeModal();rWB(document.getElementById('page-worldbuilding'));toast('已添加','success');}

function showModal(title,content){var c=document.getElementById('modalContainer');c.innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-header"><span class="modal-title">'+title+'</span><button class="modal-close" onclick="closeModal()">×</button></div>'+content+'</div></div>';}
function closeModal(){document.getElementById('modalContainer').innerHTML='';}
function toast(msg,type){var c=document.getElementById('toastContainer');var t=document.createElement('div');t.className='toast toast-'+(type||'info');t.textContent=msg;c.appendChild(t);setTimeout(function(){t.remove();},3000);}

function exportData(){var data=StoryStore.exportJSON();var blob=new Blob([data],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='novel-data.json';a.click();toast('已导出','success');}
function importData(input){var file=input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){var res;try{res=StoryStore.importJSON(e.target.result);}catch(err){res={ok:false,errors:[String((err&&err.message)||err)]};}if(res&&res.ok){navigate(curPage);toast('已导入','success');}else{toast('导入失败：'+((res&&res.errors&&res.errors[0])||'数据不合法'),'error');}};reader.readAsText(file);}
function resetData(){if(!confirm('确认重置所有数据？'))return;StoryStore.reset();navigate('dashboard');toast('已重置','success');}

// Command palette
var _cmdItems=[{label:'仪表盘',action:function(){navigate('dashboard');}},{label:'章节编辑',action:function(){navigate('editor');}},{label:'人物中心',action:function(){navigate('characters');}},{label:'剧情规划',action:function(){navigate('plot');}},{label:'世界观',action:function(){navigate('worldbuilding');}},{label:'一致性检查',action:function(){navigate('consistency');}},{label:'数据中心',action:function(){navigate('data');}},{label:'设置',action:function(){navigate('settings');}},{label:'新建章节',action:function(){addChapter();}},{label:'新增人物',action:function(){showCharModal();}},{label:'AI分析',action:function(){runAIRuntime();}},{label:'回归测试',action:function(){runRegressionTests();}}];
var _cmdIdx=0;
function filterCmd(){var q=document.getElementById('cmdInput').value.toLowerCase();var filtered=_cmdItems.filter(function(i){return i.label.toLowerCase().indexOf(q)>=0;});var list=document.getElementById('cmdList');list.innerHTML=filtered.map(function(i,idx){return'<div class="cmd-item'+(idx===_cmdIdx?' active':'')+'" onclick="'+(i.cmd||'')+'selectCmd('+idx+')">'+i.label+'</div>';}).join('');_cmdFiltered=filtered;}
var _cmdFiltered=[];
function selectCmd(idx){if(_cmdFiltered[idx])_cmdFiltered[idx].action();closeCmd();}
function closeCmd(){document.getElementById('cmdOverlay').classList.remove('active');document.getElementById('cmdInput').value='';}
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('cmdOverlay').classList.add('active');document.getElementById('cmdInput').focus();filterCmd();}
  if(e.key==='Escape')closeCmd();
});

// ===== Init =====
StoryStore.load();
setTheme(StoryStore.getMeta().theme||'dark');
document.body.style.fontSize=(StoryStore.getMeta().fontSize||15)+'px';
navigate('dashboard');
// [Init] NovelCraft x Story OS initialized
</script>
