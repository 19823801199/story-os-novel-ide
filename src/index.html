// ===== Phase 6: MemoryIndex（派生索引，可丢弃重建；绝不成为第二事实来源）=====
function normalizeToken(text){
  return String(text==null?'':text).toLowerCase()
    .replace(/[\s、,，。.;；:：!！?？"'“”‘’()（）\[\]【】<>《》\-—_/\\|+=*&^%$#@~`]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function bigramsOf(text){
  var t=normalizeToken(text).replace(/ /g,'');
  var out=[];
  for(var i=0;i<t.length-1;i++)out.push(t.slice(i,i+2));
  if(t.length===1)out.push(t);
  return out;
}
var MemoryIndex=(function(){
  var _index=null,_rev=-1,_sig='';
  function signature(s){
    var chapters=s.chapters||[];
    var locs=(s.world&&s.world.locations)?s.world.locations:(s.locations||[]);
    return [chapters.length,(s.characters||[]).length,locs.length,(s.foreshadowing||[]).length,
      (s.conflicts||[]).length,(s.relationships||[]).length,(s.timeline||[]).length,
      chapters.map(function(c){return String(c.content||'').length;}).join('.')].join('|');
  }
  function item(type,id,text,extra){
    var it={type:type,id:String(id||''),text:String(text||''),chapterId:(extra&&extra.chapterId)||'',chapterIndex:(extra&&extra.chapterIndex===undefined?-1:extra.chapterIndex)};
    if(extra)Object.keys(extra).forEach(function(k){it[k]=extra[k];});
    return it;
  }
  function build(){
    var s=StoryStore.snapshot();
    var idx={builtAt:Date.now(),revision:StoryStore.getRevision(),byKey:{},postings:{},
      chapters:{},characters:{},locations:{},events:{},foreshadowing:{},timeline:{},aliasToCharacter:{},
      counts:{chapters:0,characters:0,locations:0,events:0,foreshadowing:0,timeline:0,relationships:0,summaries:0}};
    function put(it){
      var key=it.type+':'+it.id;
      idx.byKey[key]=it;
      bigramsOf(it.text).forEach(function(g){(idx.postings[g]=idx.postings[g]||[]).push(key);});
    }
    s.chapters.forEach(function(c,i){
      idx.chapters[c.id]=item('chapter',c.id,String(c.title||'')+'\n'+String(c.content||''),{chapterId:c.id,chapterIndex:i,title:c.title||''});
      put(idx.chapters[c.id]);idx.counts.chapters++;
      (c.aiAnalysis&&c.aiAnalysis.events?c.aiAnalysis.events:[]).forEach(function(ev,k){
        var id=c.id+':event:'+k;
        idx.events[id]=item('event',id,String(ev),{chapterId:c.id,chapterIndex:i});
        put(idx.events[id]);idx.counts.events++;
      });
    });
    s.characters.forEach(function(c){
      var text=[c.name,(c.aliases||[]).join(' '),(c.tags||[]).join(' '),c.charType,
        (c.fields&&c.fields.personality)||'',(c.fields&&c.fields.ability)||'',(c.fields&&c.fields.goal)||''].join(' ');
      idx.characters[c.id]=item('character',c.id,text,{name:c.name,charType:c.charType,
        appearCount:(c.presence&&c.presence.appearCount)||0,aliases:(c.aliases||[]).slice()});
      put(idx.characters[c.id]);idx.counts.characters++;
      [c.name].concat(c.aliases||[]).concat((c.fields&&c.fields.aliases)||[]).forEach(function(a){
        var n=normalizeToken(a);
        if(n&&!idx.aliasToCharacter[n])idx.aliasToCharacter[n]=c.id;
      });
    });
    (s.world&&s.world.locations?s.world.locations:[]).forEach(function(l){
      idx.locations[l.id]=item('location',l.id,[l.name,l.description||''].join(' '),{name:l.name});
      put(idx.locations[l.id]);idx.counts.locations++;
    });
    s.foreshadowing.forEach(function(f){
      var chIdx=-1;
      s.chapters.forEach(function(c,i){if(i===f.chapterPlaced)chIdx=i;});
      idx.foreshadowing[f.id]=item('foreshadow',f.id,[f.content,f.note||''].join(' '),
        {status:f.status,chapterPlaced:f.chapterPlaced,chapterExpected:f.chapterExpected,chapterIndex:chIdx});
      put(idx.foreshadowing[f.id]);idx.counts.foreshadowing++;
    });
    s.timeline.forEach(function(t,i){
      var id=t.id||('timeline_'+i);
      idx.timeline[id]=item('timeline',id,[t.time||'',t.event||''].join(' '),{time:t.time||''});
      put(idx.timeline[id]);idx.counts.timeline++;
    });
    (s.relationships||[]).forEach(function(r){
      var id=r.id||('rel_'+r.fromId+'_'+r.toId);
      idx.byKey['relationship:'+id]=item('relationship',id,[r.fromId,r.toId,r.type||''].join(' '),{fromId:r.fromId,toId:r.toId});
      idx.counts.relationships++;
    });
    var summaries=(s.narrative_state&&s.narrative_state.chapterSummaries)||{};
    Object.keys(summaries).forEach(function(cid){
      var sum=summaries[cid];
      idx.byKey['summary:'+cid]=item('summary',cid,[sum.summary||'',(sum.keyFacts||[]).join(' '),(sum.events||[]).join(' ')].join(' '),
        {chapterId:cid,sourceHash:sum.sourceHash,generatedBy:sum.generatedBy,valid:ChapterSummary.isValid(sum)});
      idx.counts.summaries++;
    });
    var volumes=(s.narrative_state&&s.narrative_state.volumeSummaries)||{};
    Object.keys(volumes).forEach(function(vid){
      idx.byKey['volume:'+vid]=item('volume',vid,[volumes[vid].summary||''].join(' '),{volumeId:vid});
    });
    var volKeys=(s.narrative_state&&s.narrative_state.volumeSummaries)||{};
    idx.counts.volumes=Object.keys(volKeys).length;
    _index=idx;_rev=StoryStore.getRevision();_sig=signature(s);
    return idx;
  }
  function ensure(){
    var s=StoryStore.state;
    if(_index&&_rev===StoryStore.getRevision()&&_sig===signature(s))return _index;
    return build();
  }
  return{
    rebuild:function(){return build();},
    ensure:ensure,
    get:function(){return ensure();},
    invalidate:function(){_index=null;_rev=-1;_sig='';return true;},
    stats:function(){
      var idx=ensure();
      return{revision:idx.revision,builtAt:idx.builtAt,counts:idx.counts,
        postings:Object.keys(idx.postings).length,items:Object.keys(idx.byKey).length,cached:_index===idx};
    },
    counts:function(){return ensure().counts;},
    // 混合检索：exact match + keyword + normalized token(bigram) + entity reference（确定性排序）
    search:function(query,options){
      var opts=options||{};
      var idx=ensure();
      var q=String(query==null?'':query);
      var results={};
      function bump(key,score,reason){
        if(!results[key])results[key]={key:key,score:0,reasons:[]};
        results[key].score+=score;
        if(reason&&results[key].reasons.indexOf(reason)<0)results[key].reasons.push(reason);
      }
      var typeFilter=opts.types?(Array.isArray(opts.types)?opts.types:[opts.types]):null;
      // 1) 实体引用
      var resolved=null;
      try{resolved=StoryEngine.resolveEntity(q);}catch(e){resolved=null;}
      if(resolved&&resolved.status==='resolved'&&resolved.entityRef){
        var key=resolved.entityRef.entityType+':'+resolved.entityRef.entityId;
        if(idx.byKey[key])bump(key,10,'entity:'+resolved.matchedBy);
      }
      var nq=normalizeToken(q);
      if(nq){
        // 2) exact / 包含匹配
        Object.keys(idx.byKey).forEach(function(k){
          var it=idx.byKey[k];
          var nt=normalizeToken(it.text);
          if(!nt)return;
          if(nt===nq)bump(k,8,'exact');
          else if(q.length>=2&&it.text.indexOf(q)>=0)bump(k,5,'substring');
        });
        // 3) bigram / 关键词
        bigramsOf(q).forEach(function(g){
          (idx.postings[g]||[]).forEach(function(k){bump(k,1,'bigram:'+g);});
        });
      }
      var items=Object.keys(results).map(function(k){
        var r=results[k],it=idx.byKey[k];
        return{type:it.type,id:it.id,score:r.score,source:(it.chapterId||it.type),excerpt:String(it.text||'').slice(0,80),
          chapterId:it.chapterId||'',chapterIndex:(it.chapterIndex===undefined?-1:it.chapterIndex),
          reasons:r.reasons.slice()};
      }).filter(function(x){
        if(opts.minScore&&x.score<opts.minScore)return false;
        if(typeFilter&&typeFilter.indexOf(x.type)<0)return false;
        return true;
      }).sort(function(a,b){
        if(b.score!==a.score)return b.score-a.score;
        if(a.type!==b.type)return a.type<b.type?-1:1;
        return a.id<b.id?-1:(a.id>b.id?1:0);
      });
      var limit=(typeof opts.limit==='number'&&opts.limit>0)?opts.limit:20;
      return{query:q,total:items.length,items:items.slice(0,limit)};
    },
    // Memory Levels: L0 当前章节 / L1 最近章节 / L2 长期事实 / L3 历史摘要
    levels:function(chapterIdx,options){
      var opts=options||{};
      var idx=ensure();
      var s=StoryStore.snapshot();
      var recent=(typeof opts.recent==='number')?opts.recent:3;
      var L0=[],L1=[],L2=[],L3=[];
      var ch=s.chapters[chapterIdx];
      if(ch&&idx.chapters[ch.id])L0.push(idx.chapters[ch.id]);
      for(var i=Math.max(0,chapterIdx-recent);i<chapterIdx;i++){
        var c=s.chapters[i];
        if(c&&idx.chapters[c.id])L1.push(idx.chapters[c.id]);
      }
      s.characters.forEach(function(c){if(idx.characters[c.id])L2.push(idx.characters[c.id]);});
      s.foreshadowing.forEach(function(f){if(idx.foreshadowing[f.id])L2.push(idx.foreshadowing[f.id]);});
      s.timeline.forEach(function(t,i){var id=t.id||('timeline_'+i);if(idx.timeline[id])L2.push(idx.timeline[id]);});
      Object.keys(idx.byKey).forEach(function(k){
        var it=idx.byKey[k];
        if(it.type==='location'||it.type==='relationship'||it.type==='event')L2.push(it);
        if(it.type==='summary'||it.type==='volume')L3.push(it);
      });
      function cost(list){return list.reduce(function(n,x){return n+ContextBudgeter.estimate(x.text);},0);}
      return{L0:L0,L1:L1,L2:L2,L3:L3,
        stats:{L0:{items:L0.length,estimatedTokens:cost(L0)},L1:{items:L1.length,estimatedTokens:cost(L1)},
          L2:{items:L2.length,estimatedTokens:cost(L2)},L3:{items:L3.length,estimatedTokens:cost(L3)}}};
    }
  };
})();

// ===== Phase 6: ChapterSummary / VolumeSummary（派生数据；绑定 chapterId + sourceHash）=====
var ChapterSummarySchema={
  name:'ChapterSummary',
  MAX_SUMMARY:600,
  validate:function(obj){
    var errors=[];
    if(!obj||typeof obj!=='object'||Array.isArray(obj))return{valid:false,errors:['summary: expected object']};
    if(typeof obj.summary!=='string'||!obj.summary.length)errors.push('summary: required string');
    if(typeof obj.summary==='string'&&obj.summary.length>ChapterSummarySchema.MAX_SUMMARY)errors.push('summary: too long (>'+ChapterSummarySchema.MAX_SUMMARY+')');
    ['keyFacts','characters','events','unresolved'].forEach(function(k){
      if(obj[k]!==undefined&&!Array.isArray(obj[k]))errors.push(k+': expected array');
    });
    var fns=StoryContract.collectFunctionPaths(obj);
    if(fns.length)errors.push('summary: executable values at '+fns.join(', '));
    return{valid:errors.length===0,errors:errors};
  }
};
var ChapterSummary={
  CONTRACT_FIELDS:['chapterId','sourceHash','summary','keyFacts','characters','events','unresolved','generatedBy','generatedAt'],
  hashOf:function(text){return StoryStore.hash(String(text==null?'':text));},
  all:function(){return (StoryStore.getNarrativeState().chapterSummaries)||{};},
  get:function(chapterId){return ChapterSummary.all()[String(chapterId)]||null;},
  isValid:function(summary){
    if(!summary||!summary.chapterId)return false;
    var ch=StoryStore.getChapter(summary.chapterId);
    if(!ch)return false;
    return summary.sourceHash===ChapterSummary.hashOf(ch.content);
  },
  list:function(){
    var all=ChapterSummary.all();
    return Object.keys(all).sort().map(function(k){
      var s=all[k];s.valid=ChapterSummary.isValid(s);return s;
    });
  },
  // 确定性摘要（无 LLM 时）：只做结构化摘录，不虚构文学总结
  deterministic:function(chapterId,options){
    var opts=options||{};
    var ch=StoryStore.getChapter(chapterId);
    if(!ch)return null;
    var text=String(ch.content||'');
    var analysis=ch.aiAnalysis||{};
    var chapters=StoryStore.getChapters();
    var idx=chapters.indexOf(ch);
    var opening=text.slice(0,40);
    var ending=text.slice(Math.max(0,text.length-40));
    var events=(analysis.events||[]).slice(0,6);
    var chars=(analysis.characters||[]).slice(0,10);
    var unresolved=StoryStore.getForeshadows().filter(function(f){return f.chapterPlaced===idx&&f.status==='pending';})
      .map(function(f){return f.content;});
    var summary='『'+(ch.title||('第'+(idx+1)+'章'))+'』开头：'+opening+
      (events.length?('；事件：'+events.join('、')):'')+
      (text?('；结尾：'+ending):'');
    return{
      chapterId:String(chapterId),
      sourceHash:ChapterSummary.hashOf(text),
      summary:summary.slice(0,ChapterSummarySchema.MAX_SUMMARY),
      keyFacts:events.concat(unresolved),
      characters:chars,
      events:events,
      unresolved:unresolved,
      generatedBy:'deterministic',
      generatedAt:(typeof opts.now==='number')?opts.now:Date.now()
    };
  },
  // 存储派生数据也必须经 ChangeSet（唯一写入路径）
  store:function(summary,options){
    var opts=options||{};
    if(!summary||!summary.chapterId)return null;
    var path='narrative_state.chapterSummaries.'+summary.chapterId;
    var current=ChapterSummary.get(summary.chapterId);
    var cs=ChangeSetRuntime.propose({
      source:String(opts.source||'ChapterSummary.store'),
      operation:'store_chapter_summary',
      reason:'保存章节摘要（派生数据）',
      evidence:[],
      changes:[{actionId:'summary:'+summary.chapterId,type:current?'update':'add',
        target:{entityType:'chapter',entityId:summary.chapterId,displayName:summary.chapterId},
        path:path,before:current,after:summary,
        reason:'章节摘要（generatedBy='+summary.generatedBy+'）',evidence:[],confidence:0.9}],
      baseStateHash:StoryStore.hash(StoryStore.state)
    },opts);
    cs.origin='derived';
    if(opts.auditId)cs.auditId=opts.auditId;
    if(summary.generatedBy==='llm'&&opts.providerResult){
      var r=opts.providerResult;
      cs.llm={provider:r.provider,model:r.model,requestId:r.requestId,
        promptHash:opts.promptHash||'',usage:r.usage,latencyMs:r.latencyMs};
    }
    ChangeSetRuntime.validate(cs,opts);
    if(!cs.status||cs.status!=='VALID')return{ok:false,changeSet:cs,errors:cs.errors||[]};
    ChangeSetRuntime.approve(cs,String(opts.approver||'derived:chapter-summary'),opts);
    var res=ChangeSetRuntime.apply(cs,opts);
    return{ok:!!res.ok,changeSet:cs,errors:res.errors||[],verified:res.verification||null};
  },
  // 生成：LLM 可用则用模型（经 schema 校验），否则确定性摘要
  generate:function(chapterId,options){
    var opts=options||{};
    var det=ChapterSummary.deterministic(chapterId,opts);
    if(!det)return null;
    var provider=ProviderRuntime.resolve(opts);
    if(!provider)return{summary:det,source:'deterministic',providerResult:null,errors:[],store:opts.store===true?ChapterSummary.store(det,opts):null};
    var ch=StoryStore.getChapter(chapterId);
    var res=ProviderRuntime.complete(provider,{input:String(ch.content||''),chapterId:String(chapterId),task:'chapter_summary',
      system:'你是章节摘要器。只输出 JSON：{"summary":"...","keyFacts":[],"characters":[],"events":[],"unresolved":[]}（不虚构情节）'},
      {schema:ChapterSummarySchema,timeoutMs:opts.timeoutMs,maxRetries:opts.maxRetries,maxTokens:opts.maxTokens,
        budget:{maxInputTokens:opts.maxInputTokens,maxOutputTokens:opts.maxOutputTokens},signal:opts.signal});
    function finish(r){
      if(!r||!r.success||!r.structured||!ChapterSummarySchema.validate(r.structured).valid){
        return{summary:det,source:'deterministic',providerResult:r||null,errors:r&&r.error?[r.error]:[],
          store:opts.store===true?ChapterSummary.store(det,opts):null};
      }
      var s=r.structured;
      var llmSummary={chapterId:String(chapterId),sourceHash:ChapterSummary.hashOf(ch.content),
        summary:String(s.summary).slice(0,ChapterSummarySchema.MAX_SUMMARY),
        keyFacts:Array.isArray(s.keyFacts)?s.keyFacts.slice(0,20):[],
        characters:Array.isArray(s.characters)?s.characters.slice(0,20):[],
        events:Array.isArray(s.events)?s.events.slice(0,20):[],
        unresolved:Array.isArray(s.unresolved)?s.unresolved.slice(0,20):[],
        generatedBy:'llm',generatedAt:(typeof opts.now==='number')?opts.now:Date.now()};
      return{summary:llmSummary,source:'llm',providerResult:r,errors:[],
        store:opts.store===true?ChapterSummary.store(llmSummary,{source:'ChapterSummary.generate',providerResult:r,promptHash:res.requestId,auditId:opts.auditId,now:opts.now}):null};
    }
    if(isThenable(res))return res.then(finish);
    return finish(res);
  }
};
var VolumeSummary={
  GROUP_SIZE:5,
  keyFor:function(groupIndex){return 'volume_'+String(Number(groupIndex)+1);},
  groupOf:function(chapterIdx){return Math.floor(Number(chapterIdx)/VolumeSummary.GROUP_SIZE);},
  all:function(){return (StoryStore.getNarrativeState().volumeSummaries)||{};},
  build:function(groupIndex,options){
    var opts=options||{};
    var chapters=StoryStore.getChapters();
    var start=Number(groupIndex)*VolumeSummary.GROUP_SIZE;
    var group=chapters.slice(start,start+VolumeSummary.GROUP_SIZE);
    if(!group.length)return null;
    var parts=[],facts=[],chars=[];
    group.forEach(function(c,i){
      var s=ChapterSummary.get(c.id);
      if(s&&ChapterSummary.isValid(s)){parts.push(s.summary);facts=facts.concat(s.keyFacts||[]);chars=chars.concat(s.characters||[]);}
      else parts.push('『'+(c.title||('第'+(start+i+1)+'章'))+'』'+(String(c.content||'').slice(0,40)));
    });
    var summary={
      volumeId:VolumeSummary.keyFor(groupIndex),
      groupIndex:Number(groupIndex),
      chapterIds:group.map(function(c){return c.id;}),
      chapterCount:group.length,
      summary:('第'+(start+1)+'-'+(start+group.length)+'章：'+parts.join(' ')).slice(0,1200),
      keyFacts:facts.slice(0,30),
      characters:chars.filter(function(v,i){return chars.indexOf(v)===i;}).slice(0,30),
      generatedBy:opts.generatedBy||'deterministic',
      generatedAt:(typeof opts.now==='number')?opts.now:Date.now()
    };
    if(opts.store===true){
      var path='narrative_state.volumeSummaries.'+summary.volumeId;
      var current=VolumeSummary.all()[summary.volumeId]||null;
      var cs=ChangeSetRuntime.propose({source:'VolumeSummary.build',operation:'store_volume_summary',
        reason:'保存卷/篇摘要（派生数据）',evidence:[],
        changes:[{actionId:'volume:'+summary.volumeId,type:current?'update':'add',
          target:{entityType:'volume',entityId:summary.volumeId,displayName:summary.volumeId},
          path:path,before:current,after:summary,reason:'卷摘要',evidence:[],confidence:0.9}],
        baseStateHash:StoryStore.hash(StoryStore.state)},opts);
      cs.origin='derived';
      ChangeSetRuntime.validate(cs,opts);
      ChangeSetRuntime.approve(cs,String(opts.approver||'derived:volume-summary'),opts);
      var res=ChangeSetRuntime.apply(cs,opts);
      summary._store={ok:!!res.ok,errors:res.errors||[],changeSetId:cs.changeSetId};
    }
    return summary;
  },
  buildAll:function(options){
    var chapters=StoryStore.getChapters();
    var n=Math.ceil(chapters.length/VolumeSummary.GROUP_SIZE);
    var out=[];
    for(var g=0;g<n;g++)out.push(VolumeSummary.build(g,options));
    return out;
  }
};

// ===== Phase 6: ContextBudgeter（estimate / allocate / trim / report；按优先级确定性裁剪）=====
function cloneSection(s){
  var out={};
  Object.keys(s).forEach(function(k){out[k]=s[k];});
  return out;
}
var ContextBudgeter={
  DEFAULT_BUDGET:6000,
  MIN_SECTION_TOKENS:20,
  WEIGHTS:{hard:1,character:1,foreshadowing:1,arc:1,chapter:1,summary:1},
  estimate:function(value){
    if(value===null||value===undefined)return 0;
    if(typeof value==='number')return Math.max(0,Math.ceil(value));
    if(typeof value==='object')return estimateTokens(JSON.stringify(value));
    return estimateTokens(String(value));
  },
  makeSection:function(name,priority,text,meta){
    var s={name:String(name),priority:Number(priority)||0,text:String(text==null?'':text),
      estimatedTokens:ContextBudgeter.estimate(String(text==null?'':text)),included:true,truncated:false,reason:''};
    if(meta)Object.keys(meta).forEach(function(k){s[k]=meta[k];});
    return s;
  },
  TRUNCATION_MARKER:'…[truncated]',
  // 截断标记本身也必须计入预算，否则裁剪后会超预算并误伤高优先级分段
  cutToTokens:function(text,tokens){
    var str=String(text==null?'':text);
    var maxChars=Math.max(0,Math.floor(tokens*2));
    if(maxChars>=str.length)return str;
    var marker=ContextBudgeter.TRUNCATION_MARKER;
    var keep=Math.max(0,maxChars-marker.length);
    var out=str.slice(0,keep)+marker;
    var guard=0;
    while(ContextBudgeter.estimate(out)>tokens&&out.length>marker.length&&guard<64){
      keep=Math.max(0,keep-2);
      out=str.slice(0,keep)+marker;
      guard++;
    }
    return out;
  },
  // 确定性裁剪：从最低优先级开始，先截断、再丢弃；绝不随机
  trim:function(sections,budget){
    var list=(Array.isArray(sections)?sections:[]).map(cloneSection);
    var b=(typeof budget==='number'&&budget>0)?budget:ContextBudgeter.DEFAULT_BUDGET;
    var removed=[];
    function used(){return list.reduce(function(n,s){return n+(s.included?s.estimatedTokens:0);},0);}
    var order=list.slice().sort(function(a,c){
      if(c.priority!==a.priority)return c.priority-a.priority;
      return a.name<c.name?-1:(a.name>c.name?1:0);
    });
    for(var i=0;i<order.length;i++){
      if(used()<=b)break;
      var ref=order[i];
      var target=null;
      for(var j=0;j<list.length;j++){if(list[j].name===ref.name)target=list[j];}
      if(!target||!target.included)continue;
      var others=used()-target.estimatedTokens;
      var allowed=b-others;
      if(allowed<ContextBudgeter.MIN_SECTION_TOKENS){
        target.included=false;target.truncated=true;target.text='';target.estimatedTokens=0;
        target.reason='budget: dropped（优先级最低）';
        removed.push(target.name);
        continue;
      }
      var cut=ContextBudgeter.cutToTokens(target.text,allowed);
      target.text=cut;
      target.estimatedTokens=ContextBudgeter.estimate(cut);
      target.truncated=true;
      target.reason='budget: truncated to '+allowed+' tokens';
    }
    var total=list.reduce(function(n,s){return n+s.estimatedTokens;},0);
    var kept=list.filter(function(s){return s.included;}).reduce(function(n,s){return n+s.estimatedTokens;},0);
    return{sections:list,budget:b,effectiveBudget:b,usedTokens:kept,totalEstimatedTokens:total,
      truncated:list.some(function(s){return s.truncated;}),removed:removed};
  },
  allocate:function(sections,options){
    var opts=options||{};
    var budget=(typeof opts.maxInputTokens==='number'&&opts.maxInputTokens>0)?opts.maxInputTokens:ContextBudgeter.DEFAULT_BUDGET;
    var reserve=(typeof opts.reserveOutputTokens==='number')?opts.reserveOutputTokens:0;
    var effective=Math.max(ContextBudgeter.MIN_SECTION_TOKENS,budget-reserve);
    var out=ContextBudgeter.trim(sections,effective);
    out.budget=budget;
    out.reserveOutputTokens=reserve;
    out.effectiveBudget=effective;
    return out;
  },
  report:function(allocation){
    var a=allocation||{sections:[],budget:ContextBudgeter.DEFAULT_BUDGET,usedTokens:0,totalEstimatedTokens:0,truncated:false,removed:[]};
    return{
      totalEstimatedTokens:a.totalEstimatedTokens,
      budget:a.budget,
      usedTokens:a.usedTokens,
      reserveOutputTokens:a.reserveOutputTokens||0,
      effectiveBudget:(typeof a.effectiveBudget==='number')?a.effectiveBudget:a.budget,
      truncated:!!a.truncated,
      removed:(a.removed||[]).slice(),
      sections:(a.sections||[]).map(function(s){
        return{name:s.name,priority:s.priority,estimatedTokens:s.estimatedTokens,included:s.included,
          truncated:!!s.truncated,reason:s.reason||''};
      })
    };
  },
  join:function(allocation){
    var a=allocation||{sections:[]};
    return (a.sections||[]).filter(function(s){return s.included;})
      .slice().sort(function(x,y){
        if(x.priority!==y.priority)return x.priority-y.priority;
        return x.name<y.name?-1:(x.name>y.name?1:0);
      })
      .map(function(s){return '## '+s.name+'\n'+s.text;}).join('\n\n');
  }
};

// ===== Phase 6: StoryContextBuilder（不同任务 → 不同上下文；共享同一状态投影）=====
var StoryContextBuilder={
  TASKS:{EXTRACTION:'chapter_extraction',CONSISTENCY:'consistency_check',WRITING:'writing_assist',COPILOT:'copilot_analysis',SUMMARY:'chapter_summary'},
  // 单一状态投影：所有任务共享，禁止复制多套数据逻辑
  projectState:function(){
    var s=StoryStore.snapshot();
    return{meta:s.meta||{},chapters:s.chapters||[],characters:s.characters||[],
      foreshadowing:s.foreshadowing||[],timeline:s.timeline||[],relationships:s.relationships||[],
      world:s.world||{setting:{},locations:[],factions:[],rules:[]},narrative_state:s.narrative_state||{}};
  },
  chapterOf:function(p,chapterIdOrIdx){
    if(typeof chapterIdOrIdx==='number')return{chapter:p.chapters[chapterIdOrIdx]||null,index:chapterIdOrIdx};
    var out={chapter:null,index:-1};
    p.chapters.forEach(function(c,i){if(String(c.id)===String(chapterIdOrIdx)){out.chapter=c;out.index=i;}});
    return out;
  },
  renderCharacters:function(list){
    return list.map(function(c){
      var fields=c.fields||{};
      return '- '+c.id+' '+c.name+'（'+(c.charType||'')+'）'+
        (c.aliases&&c.aliases.length?(' 别名:'+c.aliases.join('/')):'')+
        (fields.personality?(' 性格:'+fields.personality):'')+
        (fields.ability?(' 能力:'+fields.ability):'')+
        (fields.goal?(' 目标:'+fields.goal):'')+
        ' 出场:'+(((c.presence||{}).appearCount)||0);
    }).join('\n')||'(无)';
  },
  renderChapter:function(ch,index){
    return '【第'+(index+1)+'章 '+(ch.title||'')+'】\n'+String(ch.content||'');
  },
  renderForeshadows:function(list){
    return list.map(function(f){return '- '+f.id+' '+f.content+'（埋设:'+f.chapterPlaced+' 预期:'+f.chapterExpected+' 状态:'+f.status+'）';}).join('\n')||'(无)';
  },
  renderTimeline:function(list){
    return list.slice(-10).map(function(t){return '- '+(t.time||'')+' '+(t.event||'');}).join('\n')||'(无)';
  },
  renderRelationships:function(list,chars){
    function name(id){var c=chars.filter(function(x){return x.id===id;})[0];return c?c.name:id;}
    return list.map(function(r){return '- '+name(r.fromId)+' → '+name(r.toId)+' ('+(r.type||'')+')';}).join('\n')||'(无)';
  },
  renderWorld:function(world){
    var out=[];
    if(world.setting)Object.keys(world.setting).forEach(function(k){out.push('- '+k+': '+world.setting[k]);});
    (world.rules||[]).forEach(function(r){out.push('- 规则 '+(r.id||'')+': '+(r.text||''));});
    (world.locations||[]).forEach(function(l){out.push('- 地点 '+(l.name||'')+' '+((l.description)||''));});
    return out.join('\n')||'(无)';
  },
  // 按 Rule 所需事实选择上下文（Consistency 用）
  factsForRules:function(ruleIds,p,chapterIdx){
    var rules=Array.isArray(ruleIds)?ruleIds:[];
    var ctx=buildAIContext(Math.max(0,chapterIdx));
    var lines=[];
    rules.forEach(function(id){
      if(id==='power_level_conflict'){
        lines.push('规则 '+id+' 需要：主角能力='+((ctx.analysis.realm.protagonist&&ctx.analysis.realm.protagonist.ability)||'未标注')+
          '，章节数='+ctx.analysis.realm.chapterCount+'，当前允许上限='+(REALM_LADDER[ctx.analysis.realm.ceiling]||'-'));
      }else if(id==='arc_stagnation'){
        var a=ctx.analysis.arc.protagonist||{};
        lines.push('规则 '+id+' 需要：主角='+(a.name||'-')+' arcStage='+(a.arcStage||'未标注')+
          ' 已出现='+(a.appearCount||0)+' 次 章节数='+ctx.analysis.arc.chapterCount);
      }else if(id==='character_inconsistency'){
        (ctx.analysis.characterInsights||[]).forEach(function(i){
          lines.push('规则 '+id+' 需要：'+i.name+' 一致性评分='+i.score+(i.reasons.length?('（'+i.reasons.join('、')+'）'):''));
        });
      }else if(id==='world_rule_conflict'){
        var world=p.world||{};
        lines.push('规则 '+id+' 需要：世界观规则 '+((world.rules||[]).length)+' 条，地点 '+((world.locations||[]).length)+' 个');
      }else if(id==='timeline_conflict'){
        lines.push('规则 '+id+' 需要：时间线 '+p.timeline.length+' 条');
      }else if(id==='foreshadow_overdue'){
        lines.push('规则 '+id+' 需要：未回收伏笔 '+p.foreshadowing.filter(function(f){return f.status==='pending';}).length+' 条');
      }else if(id==='relationship_inconsistency'){
        lines.push('规则 '+id+' 需要：关系 '+(p.relationships||[]).length+' 条');
      }else{
        lines.push('规则 '+id+' 需要：当前章节事实与实体索引');
      }
    });
    return lines.join('\n')||'(无)';
  },
  buildPrompt:function(task,allocation,options){
    var opts=options||{};
    var system=opts.system||'你是小说叙事分析助手，只输出 JSON，不得编造原文中不存在的内容。';
    var instructions=opts.instructions||'';
    var context=ContextBudgeter.join(allocation);
    var taskKey=String(task);
    var promptHash=StoryStore.hash({system:system,task:taskKey,context:context,instructions:instructions});
    return{system:system,instructions:instructions,context:context,
      user:(instructions?instructions+'\n\n':'')+context,
      promptHash:promptHash,
      estimatedTokens:ContextBudgeter.estimate(system+'\n'+instructions+'\n'+context)};
  },
  finish:function(task,chapterIdOrIdx,allocation,options){
    var opts=options||{};
    var prompt=StoryContextBuilder.buildPrompt(task,allocation,opts);
    var report=ContextBudgeter.report(allocation);
    var idx=(typeof chapterIdOrIdx==='number')?chapterIdOrIdx:(-1);
    var chapterId='';
    if(typeof chapterIdOrIdx!=='number'){
      chapterId=String(chapterIdOrIdx||'');
    }else{
      var ch=StoryStore.getChapterByIdx(chapterIdOrIdx);
      chapterId=ch?ch.id:'';
    }
    return{task:task,chapterId:chapterId,chapterIdx:idx,sections:allocation.sections,
      report:report,allocation:allocation,prompt:prompt,promptHash:prompt.promptHash};
  },
  // ① 抽取上下文：当前章节 + 必要角色索引 + 必要世界设定 + 必要伏笔
  buildExtractionContext:function(chapterIdOrIdx,options){
    var opts=options||{};
    var p=StoryContextBuilder.projectState();
    var loc=StoryContextBuilder.chapterOf(p,chapterIdOrIdx);
    var ch=loc.chapter||{};
    var parsed=(ch.aiAnalysis&&ch.aiAnalysis.characters)||[];
    var relevant=p.characters.filter(function(c){
      return parsed.indexOf(c.name)>=0||c.charType==='protagonist';
    });
    if(relevant.length<(opts.minCharacters||3)){
      p.characters.slice(0,opts.minCharacters||3).forEach(function(c){
        if(!relevant.some(function(x){return x.id===c.id;}))relevant.push(c);
      });
    }
    var pending=p.foreshadowing.filter(function(f){return f.status==='pending';});
    var sections=[
      ContextBudgeter.makeSection('chapter',0,StoryContextBuilder.renderChapter(ch,loc.index<0?0:loc.index),{kind:'chapter'}),
      ContextBudgeter.makeSection('characters',1,StoryContextBuilder.renderCharacters(relevant),{kind:'characters',count:relevant.length}),
      ContextBudgeter.makeSection('locations',2,StoryContextBuilder.renderWorld({setting:{},rules:[],locations:p.world.locations||[]}),{kind:'locations'}),
      ContextBudgeter.makeSection('foreshadowing',3,StoryContextBuilder.renderForeshadows(pending),{kind:'foreshadowing',count:pending.length}),
      ContextBudgeter.makeSection('worldRules',4,StoryContextBuilder.renderWorld({setting:p.world.setting||{},rules:p.world.rules||[],locations:[]}),{kind:'world'})
    ];
    var allocation=ContextBudgeter.allocate(sections,opts);
    return StoryContextBuilder.finish(StoryContextBuilder.TASKS.EXTRACTION,chapterIdOrIdx,allocation,opts);
  },
  // ② 一致性上下文：当前章节 + 相关实体历史 + 时间线 + 伏笔 + 关系 + 世界规则（规则驱动）
  buildConsistencyContext:function(chapterIdOrIdx,options){
    var opts=options||{};
    var p=StoryContextBuilder.projectState();
    var loc=StoryContextBuilder.chapterOf(p,chapterIdOrIdx);
    var ch=loc.chapter||{};
    var ruleIds=opts.rules||[];
    var sections=[
      ContextBudgeter.makeSection('chapter',0,StoryContextBuilder.renderChapter(ch,loc.index<0?0:loc.index),{kind:'chapter'}),
      ContextBudgeter.makeSection('ruleFacts',1,StoryContextBuilder.factsForRules(ruleIds,p,loc.index<0?0:loc.index),{kind:'ruleFacts',rules:ruleIds}),
      ContextBudgeter.makeSection('entities',2,StoryContextBuilder.renderCharacters(p.characters),{kind:'characters',count:p.characters.length}),
      ContextBudgeter.makeSection('timeline',3,StoryContextBuilder.renderTimeline(p.timeline),{kind:'timeline',count:p.timeline.length}),
      ContextBudgeter.makeSection('foreshadowing',4,StoryContextBuilder.renderForeshadows(p.foreshadowing),{kind:'foreshadowing',count:p.foreshadowing.length}),
      ContextBudgeter.makeSection('relationships',5,StoryContextBuilder.renderRelationships(p.relationships||[],p.characters),{kind:'relationships'}),
      ContextBudgeter.makeSection('worldRules',6,StoryContextBuilder.renderWorld(p.world),{kind:'world'})
    ];
    var allocation=ContextBudgeter.allocate(sections,opts);
    return StoryContextBuilder.finish(StoryContextBuilder.TASKS.CONSISTENCY,chapterIdOrIdx,allocation,opts);
  },
  // ③ 写作上下文：P0 硬设定 / P1 当前角色 / P2 未回收伏笔 / P3 当前弧 / P4 最近章节 / P5 更早摘要
  buildWritingContext:function(chapterIdOrIdx,options){
    var opts=options||{};
    var p=StoryContextBuilder.projectState();
    var loc=StoryContextBuilder.chapterOf(p,chapterIdOrIdx);
    var idx=loc.index<0?0:loc.index;
    var recentCount=(typeof opts.recentChapters==='number')?opts.recentChapters:3;
    var protagonist=p.characters.filter(function(c){return c.charType==='protagonist';})[0];
    var cast=p.characters.filter(function(c){return c.charType==='protagonist'||(c.presence&&c.presence.appearCount>0);});
    var pending=p.foreshadowing.filter(function(f){return f.status==='pending';});
    var recent=[];
    for(var i=Math.max(0,idx-recentCount);i<idx;i++){
      var c=p.chapters[i];
      if(!c)continue;
      var sum=ChapterSummary.get(c.id);
      recent.push('【第'+(i+1)+'章 '+(c.title||'')+'】'+((sum&&ChapterSummary.isValid(sum))?sum.summary:String(c.content||'').slice(0,120)));
    }
    var earlier=[];
    p.chapters.slice(0,Math.max(0,idx-recentCount)).forEach(function(c){
      var sum=ChapterSummary.get(c.id);
      if(sum&&ChapterSummary.isValid(sum))earlier.push(sum.summary);
    });
    (VolumeSummary.all?Object.keys(VolumeSummary.all()):[]).forEach(function(v){
      var vs=VolumeSummary.all()[v];
      if(vs&&vs.summary)earlier.push(vs.summary);
    });
    var arc=p.narrative_state.currentArc||'';
    var sections=[
      ContextBudgeter.makeSection('hardFacts',0,StoryContextBuilder.renderWorld({setting:p.world.setting||{},rules:p.world.rules||[],locations:p.world.locations||[]}),{kind:'world'}),
      ContextBudgeter.makeSection('characters',1,StoryContextBuilder.renderCharacters(cast),{kind:'characters',count:cast.length}),
      ContextBudgeter.makeSection('foreshadowing',2,StoryContextBuilder.renderForeshadows(pending),{kind:'foreshadowing',count:pending.length}),
      ContextBudgeter.makeSection('currentArc',3,'当前弧：'+(arc||'未标注')+'\n主角：'+((protagonist&&protagonist.name)||'未设定')+
        (protagonist&&protagonist.aiProfile&&protagonist.aiProfile.arcStage?('（阶段:'+protagonist.aiProfile.arcStage+'）'):''),{kind:'arc'}),
      ContextBudgeter.makeSection('recentChapters',4,recent.join('\n\n'),{kind:'chapters',count:recent.length}),
      ContextBudgeter.makeSection('summaries',5,earlier.join('\n\n'),{kind:'summaries',count:earlier.length})
    ];
    var allocation=ContextBudgeter.allocate(sections,opts);
    return StoryContextBuilder.finish(StoryContextBuilder.TASKS.WRITING,chapterIdOrIdx,allocation,opts);
  },
  // ④ Copilot 上下文：当前章节 + 角色 + 伏笔 + 诊断结论 + 世界规则
  buildCopilotContext:function(chapterIdOrIdx,options){
    var opts=options||{};
    var p=StoryContextBuilder.projectState();
    var loc=StoryContextBuilder.chapterOf(p,chapterIdOrIdx);
    var ch=loc.chapter||{};
    var diagnosis='';
    try{
      var report=AIRuntime.consistencyReport(loc.index<0?0:loc.index);
      diagnosis=report.issues.map(function(i){return '- ['+i.severity+'] '+i.ruleId+': '+i.message;}).join('\n')||'(无问题)';
    }catch(e){diagnosis='(诊断不可用)';}
    var sections=[
      ContextBudgeter.makeSection('chapter',0,StoryContextBuilder.renderChapter(ch,loc.index<0?0:loc.index),{kind:'chapter'}),
      ContextBudgeter.makeSection('characters',1,StoryContextBuilder.renderCharacters(p.characters),{kind:'characters',count:p.characters.length}),
      ContextBudgeter.makeSection('foreshadowing',2,StoryContextBuilder.renderForeshadows(p.foreshadowing.filter(function(f){return f.status==='pending';})),{kind:'foreshadowing'}),
      ContextBudgeter.makeSection('diagnosis',3,diagnosis,{kind:'diagnosis'}),
      ContextBudgeter.makeSection('worldRules',4,StoryContextBuilder.renderWorld(p.world),{kind:'world'})
    ];
    var allocation=ContextBudgeter.allocate(sections,opts);
    return StoryContextBuilder.finish(StoryContextBuilder.TASKS.COPILOT,chapterIdOrIdx,allocation,opts);
  },
  build:function(task,chapterIdOrIdx,options){
    var t=String(task||'');
    if(t===StoryContextBuilder.TASKS.EXTRACTION)return StoryContextBuilder.buildExtractionContext(chapterIdOrIdx,options);
    if(t===StoryContextBuilder.TASKS.CONSISTENCY)return StoryContextBuilder.buildConsistencyContext(chapterIdOrIdx,options);
    if(t===StoryContextBuilder.TASKS.WRITING)return StoryContextBuilder.buildWritingContext(chapterIdOrIdx,options);
    if(t===StoryContextBuilder.TASKS.COPILOT)return StoryContextBuilder.buildCopilotContext(chapterIdOrIdx,options);
    return StoryContextBuilder.buildExtractionContext(chapterIdOrIdx,options);
  }
};

// ===== Phase 6: AI Audit Store（AI 操作历史；独立本机存储；绝不成为故事事实）=====
var AI_AUDIT_KEY='novelcraft_ai_audit_v1';
var AIAuditStore={
  KEY:AI_AUDIT_KEY,MAX:100,
  FORBIDDEN:['apikey','api_key','authorization','token','password','secret','bearer'],
  sanitize:function(value,depth){
    var d=(typeof depth==='number')?depth:0;
    if(d>6)return null;
    if(value===null||value===undefined)return null;
    if(typeof value==='string')return value.length>20000?(value.slice(0,20000)+'…[audit truncated]'):value;
    if(typeof value==='number'||typeof value==='boolean')return value;
    if(Array.isArray(value))return value.slice(0,200).map(function(v){return AIAuditStore.sanitize(v,d+1);});
    if(typeof value==='object'){
      var out={};
      Object.keys(value).forEach(function(k){
        if(AIAuditStore.FORBIDDEN.indexOf(String(k).toLowerCase())>=0)return;
        out[k]=AIAuditStore.sanitize(value[k],d+1);
      });
      return out;
    }
    return null;
  },
  _load:function(){
    try{var raw=localStorage.getItem(AI_AUDIT_KEY);var arr=raw?JSON.parse(raw):[];return Array.isArray(arr)?arr:[];}
    catch(e){return[];}
  },
  _save:function(list){
    var trimmed=list.slice(-AIAuditStore.MAX);
    try{localStorage.setItem(AI_AUDIT_KEY,JSON.stringify(trimmed));}catch(e){}
    return trimmed.length;
  },
  linkChangeSet:function(auditId,changeSetId){
    var list=AIAuditStore._load();
    var found=null;
    list.forEach(function(e){if(e.auditId===auditId){e.changeSetId=String(changeSetId||'');found=e;}});
    AIAuditStore._save(list);
    return found;
  },
  record:function(entry){
    var e=AIAuditStore.sanitize(entry||{})||{};
    var ts=(typeof e.timestamp==='number')?e.timestamp:Date.now();
    e.timestamp=ts;
    e.auditId='au_'+StoryStore.hash({requestId:e.requestId||'',provider:e.provider||'',model:e.model||'',
      promptHash:e.promptHash||'',timestamp:ts});
    var list=AIAuditStore._load();
    list.push(e);
    AIAuditStore._save(list);
    return e;
  },
  list:function(options){
    var opts=options||{};
    var list=AIAuditStore._load().slice().sort(function(a,b){
      if(b.timestamp!==a.timestamp)return b.timestamp-a.timestamp;
      return a.auditId<b.auditId?-1:(a.auditId>b.auditId?1:0);
    });
    if(opts.limit>0)list=list.slice(0,opts.limit);
    return list;
  },
  get:function(auditId){return AIAuditStore._load().filter(function(e){return e.auditId===auditId;})[0]||null;},
  count:function(){return AIAuditStore._load().length;},
  last:function(){return AIAuditStore.list({limit:1})[0]||null;},
  clear:function(){try{localStorage.removeItem(AI_AUDIT_KEY);}catch(e){}return true;},
  assertNoSecret:function(value){
    var text=String(JSON.stringify(value)).toLowerCase();
    var bad=[];
    AIAuditStore.FORBIDDEN.forEach(function(k){if(text.indexOf(k)>=0)bad.push(k);});
    return{clean:bad.length===0,found:bad};
  }
};
// ===== Phase 6: Provider cancellation / 指数退避 =====
function createAbortController(){
  return (typeof AbortController==='function')?new AbortController():null;
}
function abortProviderError(){return makeProviderError(ProviderErrors.CANCELLED,'请求已取消（AbortController）');}
function retryDelayFor(attemptIndex,options){
  var opts=options||{};
  var base=(typeof opts.retryDelayMs==='number')?opts.retryDelayMs:500;
  var factor=(typeof opts.retryFactor==='number')?opts.retryFactor:2;
  var maxDelay=(typeof opts.maxRetryDelayMs==='number')?opts.maxRetryDelayMs:8000;
  return Math.min(maxDelay,Math.round(base*Math.pow(factor,Math.max(0,attemptIndex))));
}
function waitBeforeRetry(delayMs,options,asyncMode){
  var opts=options||{};
  if(typeof opts.sleep==='function')return opts.sleep(delayMs);
  if(!asyncMode||delayMs<=0||typeof setTimeout!=='function')return null;
  return new Promise(function(resolve){setTimeout(resolve,delayMs);});
}
var ProviderCancellation={
  active:null,
  begin:function(options){
    var opts=options||{};
    var ctrl=opts.controller||createAbortController();
    ProviderCancellation.active={controller:ctrl,signal:(opts.signal||(ctrl?ctrl.signal:null)),startedAt:Date.now(),aborted:false};
    return ProviderCancellation.active;
  },
  abort:function(reason){
    var a=ProviderCancellation.active;
    if(!a)return false;
    a.aborted=true;a.reason=String(reason||'user');
    if(a.controller&&typeof a.controller.abort==='function'){try{a.controller.abort();}catch(e){}}
    return true;
  },
  end:function(){var a=ProviderCancellation.active;ProviderCancellation.active=null;return a;},
  isAborted:function(){return !!(ProviderCancellation.active&&ProviderCancellation.active.aborted);}
};

// ===== Phase 6: 既有实体最小差异更新（只改模型显式断言且与原值不同的字段）=====
LLMProposalBridge.toEntityUpdates=function(input){
  input=input||{};
  var chapterId=String(input.chapterId||'');
  var extraction=input.extraction||normalizeChapterExtraction({});
  var verified=input.verified||{};
  var snap=StoryStore.snapshot();
  var updates=[],rejected=[];
  var ALLOWED_FIELDS=['personality','ability','goal'];
  extraction.characters.forEach(function(c){
    if(!c.fields)return;
    var r=StoryEngine.resolveEntity(c.name);
    if(!r||r.status!=='resolved'||!r.entityRef||r.entityRef.entityType!=='character')return;
    var id=r.entityRef.entityId;
    var current=(snap.characters||[]).filter(function(x){return x.id===id;})[0];
    if(!current)return;
    var ev=(verified[c.name]||[]);
    ALLOWED_FIELDS.forEach(function(f){
      var next=c.fields[f];
      if(typeof next!=='string'||!next)return;
      var before=String(((current.fields||{})[f])||'');
      if(before===next)return;                          // 最小差异：无变化不产生变更
      if(!ev.length){rejected.push({kind:'character_field',name:c.name,field:f,reason:'缺少可验证 evidence'});return;}
      updates.push({actionId:'llm:field:'+id+'.'+f,type:'update',
        target:{entityType:'character',entityId:id,displayName:current.name},
        path:'characters.'+id+'.fields.'+f,before:before,after:next,
        reason:'LLM 最小更新：'+f+'（'+current.name+'）',evidence:ev.slice(0,1),confidence:0.6});
    });
  });
  extraction.relationships.forEach(function(rel){
    var a=StoryEngine.resolveEntity(rel.from),b=StoryEngine.resolveEntity(rel.to);
    if(!a||!b||a.status!=='resolved'||b.status!=='resolved')return;
    var existing=(snap.relationships||[]).filter(function(x){
      return (x.fromId===a.entityRef.entityId&&x.toId===b.entityRef.entityId)||
             (x.fromId===b.entityRef.entityId&&x.toId===a.entityRef.entityId);
    })[0];
    if(!existing)return;
    var nextType=String(rel.type||'');
    if(!nextType||nextType===String(existing.type||''))return;
    updates.push({actionId:'llm:relation:'+existing.id+'.type',type:'update',
      target:{entityType:'relationship',entityId:existing.id,displayName:existing.id},
      path:'relationships.'+existing.id+'.type',before:String(existing.type||''),after:nextType,
      reason:'LLM 最小更新：关系类型',evidence:[],confidence:0.55});
  });
  return{updates:updates,rejected:rejected};
};

var _pendingLLMChangeSet=null;
var _lastLLMAnalysis=null;
function llmStatusHTML(result){
  if(!result)return '<div class="action-card"><div class="action-desc">尚未运行 LLM 分析。</div></div>';
  var s=result.summary||{};
  var cfg=ProviderSettings.masked();
  var state=result.source==='llm'?('<span class="badge badge-success">LLM 成功</span>'):('<span class="badge badge-warning">降级：确定性解析</span>');
  return '<div class="action-card"><div class="action-header"><span class="action-title">LLM 分析</span>'+state+'</div>'+
    '<div class="action-desc">Provider: '+((s.provider)||cfg.provider||'-')+' · Model: '+((s.model)||cfg.model||'-')+'</div>'+
    (result.reason?('<div class="action-desc text-muted">原因: '+result.reason+'</div>'):'')+
    (result.errors&&result.errors.length?('<div class="action-desc text-muted">错误: '+result.errors.map(function(e){return e&&e.code?e.code:e;}).join(', ')+'</div>'):'')+
    (s.latencyMs!==undefined?('<div class="action-desc text-muted">latency: '+s.latencyMs+'ms · requestId: '+(s.requestId||'-')+'</div>'):'')+
    '</div>';
}
function runLLMAnalysis(){
  if(!curChId)return null;
  var result=LLMChapterAnalysis.analyzeChapter(curChId,{});
  function render(r){
    _lastLLMAnalysis=r;
    _pendingLLMChangeSet=r?r.changeSet:null;
    var el=document.getElementById('copilotIssues');
    if(el){
      var html=llmStatusHTML(r);
      if(r&&r.changeSet&&r.changeSet.changes.length){
        html+='<div class="action-card"><div class="action-header"><span class="action-title">LLM 提案（需人工审批）</span>'+
          '<span class="badge badge-'+(r.changeSet.policy&&r.changeSet.policy.allowed?'warning':'danger')+'">'+(r.changeSet.changes.length)+' 项变更</span></div>'+
          '<div class="action-desc">'+r.changeSet.changes.map(function(c){return c.type+' '+c.path;}).join('<br/>')+'</div>'+
          '<div class="action-desc text-muted">ChangeSet: '+r.changeSet.changeSetId+'</div>'+
          '<div class="action-actions"><button class="btn btn-sm btn-primary" onclick="approveLLMAnalysis()">采用（人工批准）</button>'+
          '<button class="btn btn-sm" onclick="rejectLLMAnalysis()">忽略</button></div></div>';
      }
      if(r&&r.rejectedFacts&&r.rejectedFacts.length){
        html+=r.rejectedFacts.map(function(x){return '<div class="action-card severity-warning"><div class="action-desc">已拒绝：'+
          (x.kind||'')+' '+(x.name||x.content||x.from||'')+' — '+x.reason+'</div></div>';}).join('');
      }
      el.innerHTML=html;
    }
    if(r&&r.source==='llm')toast('LLM 分析完成（需人工审批）','success');
    else toast('LLM 不可用，已降级为确定性解析','info');
    return r;
  }
  if(isThenable(result))return result.then(render);
  return render(result);
}
function approveLLMAnalysis(){
  if(!_pendingLLMChangeSet)return{ok:false,status:'REJECTED',errors:['no pending llm changeset']};
  var approver='author:'+String((StoryStore.getMeta()||{}).title||'author');
  var res=LLMChapterAnalysis.applyApproved(_pendingLLMChangeSet,approver,{});
  toast(res.ok?'LLM 提案已批准并应用（'+((_pendingLLMChangeSet.changes||[]).length)+' 项变更）':'LLM 提案未应用：'+(res.errors||[]).join('；'),res.ok?'success':'error');
  _pendingLLMChangeSet=null;
  runCopilot();
  return res;
}
function rejectLLMAnalysis(){
  if(!_pendingLLMChangeSet)return{ok:false,status:'REJECTED',errors:['no pending llm changeset']};
  var cs=_pendingLLMChangeSet;
  ChangeSetRuntime.validate(cs,{});
  var res=ChangeSetRuntime.reject(cs,'作者拒绝 LLM 提案',{});
  StoryStore.appendActionDecision({planId:cs.changeSetId,actionId:cs.actionId||'',ruleId:'llm_extraction',
    issueId:'',action:cs.operation,decision:'rejected',changeSetIds:[],hasChanges:false,changeCount:0,executedCount:0,
    reason:'作者拒绝 LLM 提案',at:Date.now()});
  toast('LLM 提案已拒绝（REJECTED 已记录审计）','info');
  _pendingLLMChangeSet=null;
  return res;
}

// ===== Phase 5.3: UI result contract（"已执行" 只在真实验证通过时出现）=====
function applyResultMessage(res){
  if(!res)return'执行失败：无结果';
  var v=res.verified||{};
  if(res.ok&&v.hasChanges)return'已执行：'+v.executedCount+' 个动作 / '+v.changeCount+' 处状态变更';
  if(res.ok&&!v.hasChanges)return'状态未变化（未产生已验证的变更）';
  var failed=(res.results||[]).filter(function(r){return r.status==='failed'||r.status==='invalid'||r.status==='refused';});
  if(failed.length)return'执行失败：'+failed.map(function(r){return r.detail;}).join('；');
  if(v.success===false)return'验证失败：存在未应用的变更';
  return'未执行';
}

function runAIRuntime(){
  var idx=StoryStore.getChapters().length-1>=0?StoryStore.getChapters().length-1:0;
  var result=AIRuntime.run(idx);
  var v=result.verified||{};
  var msg=applyResultMessage({ok:true,verified:v,results:result.executed});
  var el=document.getElementById('aiRuntimeResult');
  if(el){
    el.innerHTML='<div class="card"><p class="text-sm">发现问题: '+result.analysis.issues.length+'</p>'+
      '<p class="text-sm">决策数: '+result.analysis.decisions.length+'</p>'+
      '<p class="text-sm">执行: '+(v.executedCount||0)+' 个动作 / '+(v.changeCount||0)+' 处状态变更</p>'+
      '<p class="text-sm">'+msg+'</p>'+
      '<p class="text-muted text-sm">变更集: '+((result.changeSetIds||[]).join(', ')||'无')+'</p></div>';
  }
  toast(msg,v.hasChanges?'success':'info');
  return result;
}

function renderIssueCard(issue,plan){
  var ev=(issue.evidence||[]).map(function(e){return e&&e.excerpt?('「'+e.excerpt+'」@'+e.sourceId):'';}).filter(Boolean).join(' ');
  var ref=issue.entityRef?('<span class="badge badge-info">'+issue.entityRef.entityType+':'+issue.entityRef.entityId+'</span>'):'';
  var loc=issue.location?('<span class="text-muted text-sm">'+(issue.location.chapterId||'-')+'</span>'):'';
  var sevBadge=(issue.severity==='blocking'||issue.severity==='error')?'danger':(issue.severity==='warning'?'warning':'info');
  var actions;
  if(plan&&!plan.diagnosisOnly){
    actions='<div class="action-actions"><button class="btn btn-sm btn-primary" onclick="approveAction(\''+plan.id+'\')">采用</button>'+
      '<button class="btn btn-sm" onclick="rejectAction(\''+plan.id+'\')">忽略</button></div>';
  }else{
    actions='<div class="badge badge-info">诊断（不修改状态）</div>';
  }
  return '<div class="action-card severity-'+issue.severity+'"><div class="action-header">'+
    '<span class="action-title">'+issue.ruleId+' · '+issue.title+'</span>'+
    '<span class="badge badge-'+sevBadge+'">'+issue.severity+'</span>'+ref+loc+'</div>'+
    '<div class="action-desc">'+issue.message+'</div>'+
    (ev?('<div class="action-desc text-muted">证据: '+ev+'</div>'):'')+
    (issue.suggestedFix?('<div class="action-desc">建议: '+issue.suggestedFix+'</div>'):'')+
    actions+'</div>';
}

function renderPlans(){
  var plans=(_lastActionPlans||[]);
  var actionsEl=document.getElementById('copilotActions');
  if(!actionsEl)return;
  if(!plans.length){actionsEl.innerHTML='<p class="text-muted text-sm">无建议动作</p>';return;}
  actionsEl.innerHTML=plans.map(function(p){
    var issue=p.issue||{ruleId:p.ruleId,title:p.ruleId,message:p.reason,severity:(p.priority>=9?'blocking':p.priority>=7?'error':p.priority>=5?'warning':'info'),evidence:p.evidence||[],entityRef:null,location:null,suggestedFix:p.suggestedFix||p.reason};
    var card=renderIssueCard(issue,p);
    if(p.status==='rejected')card=card.replace(/<div class="action-actions">[\s\S]*?<\/div>/,'<div class="badge badge-info">已拒绝（REJECTED 已记录）</div>');
    if(p.status==='applied'&&p.executionResult)card=card.replace(/<div class="action-actions">[\s\S]*?<\/div>/,'<div class="badge badge-success">'+p.executionResult.message+'</div>');
    return card;
  }).join('');
}

function runCopilot(){
  if(!curChId)return null;
  var ch=StoryStore.getChapter(curChId);if(!ch)return null;
  var idx=StoryStore.getChapters().indexOf(ch);
  var result=AIRuntime.runActionPlan(idx);
  _lastActionPlans=result.plans||[];
  var issuesEl=document.getElementById('copilotIssues');
  if(issuesEl){
    var issues=(result.analysis&&result.analysis.issues)||[];
    issuesEl.innerHTML=issues.length?issues.map(function(i){return renderIssueCard(i,null);}).join(''):'<p class="text-muted text-sm">未发现问题</p>';
  }
  renderPlans();
  return result;
}

function approveAction(planId){
  var plan=(_lastActionPlans||[]).filter(function(p){return p.id===planId;})[0];
  if(!plan)return{ok:false,status:'NOT_FOUND',errors:['plan not found: '+planId]};
  var res=AIRuntime.applyPlan(plan);
  var msg=applyResultMessage(res);
  toast(msg,res.ok?'success':'error');
  plan.executionResult={ok:res.ok,status:res.status,verified:res.verified,message:msg};
  plan.status=res.ok?'applied':'failed';
  renderPlans();
  return res;
}

function rejectAction(planId){
  var plan=(_lastActionPlans||[]).filter(function(p){return p.id===planId;})[0];
  if(!plan)return{ok:false,status:'NOT_FOUND',errors:['plan not found: '+planId]};
  var res=AIRuntime.rejectPlan(plan,'作者忽略');
  plan.status='rejected';
  plan.rejected={reason:'作者忽略',at:Date.now()};
  toast('已拒绝（REJECTED 已写入审计）','info');
  renderPlans();
  return res;
}

  if(el){
    var dims=[
      {icon:'⏰',name:'时间线一致性',rules:['timeline_conflict'],desc:'检查故事时间线是否有矛盾'},

    ];
    var byRule={};
    (report.issues||[]).forEach(function(i){byRule[i.ruleId]=i;});
    var summary='<div class="card"><div class="card-title">一致性评分（确定性）</div>'+
      '<p class="text-sm">评分: '+report.score.score+'/100</p>'+
      '<p class="text-sm">blocking: '+report.blockingIssues+' · error: '+report.errors+' · warning: '+report.warnings+' · info: '+report.infos+'</p>'+

    var dimHtml='<div class="card">'+dims.map(function(d){
      var issue=null;
      d.rules.forEach(function(r){if(byRule[r])issue=byRule[r];});
      var pass=!issue;
      return '<div class="consistency-item"><span class="consistency-icon">'+d.icon+'</span><div class="consistency-content">'+
        '<div class="consistency-name">'+d.name+(pass?' <span class="badge badge-success">通过</span>':' <span class="badge badge-danger">问题</span>')+'</div>'+
        '<div class="consistency-desc">'+(pass?d.desc:issue.message)+'</div></div></div>';
    }).join('')+'</div>';
    var plansByIssue={};
    (report.plans||[]).forEach(function(p){if(p.issueId)plansByIssue[p.issueId]=p;});
    var issueHtml='<div class="card"><div class="card-title">问题、证据与建议</div>'+
      ((report.issues||[]).length?report.issues.map(function(i){return renderIssueCard(i,plansByIssue[i.issueId]);}).join(''):'<p class="text-muted text-sm">未发现问题</p>')+'</div>';
    el.innerHTML=summary+dimHtml+issueHtml;
  }
  toast('一致性检查完成: '+report.score.score+'/100',report.blockingIssues?'error':'success');
  return report;
}

function runRegressionTests(){
  var result=AIRuntime.runRegressionTests();
  var el=document.getElementById('aiRuntimeResult');if(!el)return;
  el.innerHTML='<div class="card"><div class="card-title">回归测试结果</div>'+result.results.map(function(r){return'<div class="consistency-item"><span class="consistency-icon">'+(r.pass?'✅':'❌')+'</span><div class="consistency-content"><div class="consistency-name">Test '+r.id+': '+r.name+'</div><div class="consistency-desc">'+(r.pass?'通过':'失败')+'</div></div></div>';}).join('')+'<p class="text-sm mt-1">总计: '+result.results.filter(function(r){return r.pass;}).length+'/'+result.results.length+' 通过</p></div>';
  toast('回归测试完成: '+result.results.filter(function(r){return r.pass;}).length+'/'+result.results.length+'通过',result.allPass?'success':'error');
}

function showCharModal(charId){
  var c=charId?StoryStore.getCharacter(charId):null;
  showModal('人物'+(c?'编辑':'新建'),'<div class="form-group"><label class="form-label">姓名</label><input class="form-input" id="m-char-name" value="'+(c?c.name:'')+'" /></div><div class="grid grid-2"><div class="form-group"><label class="form-label">性别</label><input class="form-input" id="m-char-gender" value="'+(c?c.gender:'')+'" /></div><div class="form-group"><label class="form-label">年龄</label><input class="form-input" id="m-char-age" value="'+(c?c.age:'')+'" /></div></div><div class="form-group"><label class="form-label">类型</label><select class="form-select" id="m-char-type"><option value="protagonist"'+(c&&c.charType==='protagonist'?' selected':'')+'>主角</option><option value="supporting"'+(!c||c.charType==='supporting'?' selected':'')+'>配角</option><option value="antagonist"'+(c&&c.charType==='antagonist'?' selected':'')+'>反派</option></select></div><div class="form-group"><label class="form-label">能力</label><textarea class="form-textarea" id="m-char-ability">'+(c&&c.fields?c.fields.ability||'':'')+'</textarea></div><div class="form-group"><label class="form-label">背景</label><textarea class="form-textarea" id="m-char-bg">'+(c&&c.fields?c.fields.background||'':'')+'</textarea></div><div class="flex gap-1 mt-2"><button class="btn btn-primary" onclick="saveCharFromModal('+(c?"'"+c.id+"'":'null')+')" style="flex:1">'+(c?'保存':'创建')+'</button>'+(c?'<button class="btn btn-danger" onclick="deleteChar(\''+c.id+'\')">删除</button>':'')+'</div>');
}

function saveCharFromModal(id){
  var data={name:document.getElementById('m-char-name').value.trim()||'未命名',gender:document.getElementById('m-char-gender').value,age:document.getElementById('m-char-age').value,charType:document.getElementById('m-char-type').value,fields:{ability:document.getElementById('m-char-ability').value,background:document.getElementById('m-char-bg').value}};
  if(id){StoryStore.updateCharacter(id,data);}else{StoryStore.addCharacter(data);}
  closeModal();rChar(document.getElementById('page-characters'));renderSidebar('characters');toast('已保存','success');
}
function deleteChar(id){if(!confirm('确认删除？'))return;StoryStore.deleteCharacter(id);closeModal();rChar(document.getElementById('page-characters'));renderSidebar('characters');toast('已删除','success');}

function showForeshadowModal(){
  showModal('添加伏笔','<div class="form-group"><label class="form-label">伏笔内容</label><textarea class="form-textarea" id="m-fs-content"></textarea></div><div class="grid grid-2"><div class="form-group"><label class="form-label">埋设章节</label><input class="form-input" type="number" id="m-fs-plant" value="0" /></div><div class="form-group"><label class="form-label">预期回收章节</label><input class="form-input" type="number" id="m-fs-resolve" value="0" /></div></div><button class="btn btn-primary w-full" onclick="saveForeshadow()">添加</button>');
}
function saveForeshadow(){StoryStore.addForeshadow({content:document.getElementById('m-fs-content').value,chapterPlaced:parseInt(document.getElementById('m-fs-plant').value)||0,chapterExpected:parseInt(document.getElementById('m-fs-resolve').value)||0});closeModal();rPlot(document.getElementById('page-plot'));toast('已添加','success');}

function showWBModal(){
  var cats=['地图','国家','宗门','城市','秘境','组织','势力','职业','境界','技能','功法','法宝','装备','货币','植物','妖兽','种族','历史','神话'];
  showModal('新增世界观设定','<div class="form-group"><label class="form-label">分类</label><select class="form-select" id="m-wb-cat">'+cats.map(function(c){return'<option value="'+c+'">'+c+'</option>';}).join('')+'</select></div><div class="form-group"><label class="form-label">名称</label><input class="form-input" id="m-wb-name" /></div><div class="form-group"><label class="form-label">描述</label><textarea class="form-textarea" id="m-wb-desc"></textarea></div><button class="btn btn-primary w-full" onclick="saveWB()">添加</button>');
}
function saveWB(){var name=document.getElementById('m-wb-name').value.trim();if(!name){toast('请输入名称','error');return;}StoryStore.addLocation({name:name,category:document.getElementById('m-wb-cat').value,description:document.getElementById('m-wb-desc').value});closeModal();rWB(document.getElementById('page-worldbuilding'));toast('已添加','success');}

function showModal(title,content){var c=document.getElementById('modalContainer');c.innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-header"><span class="modal-title">'+title+'</span><button class="modal-close" onclick="closeModal()">×</button></div>'+content+'</div></div>';}
function closeModal(){document.getElementById('modalContainer').innerHTML='';}
function toast(msg,type){var c=document.getElementById('toastContainer');var t=document.createElement('div');t.className='toast toast-'+(type||'info');t.textContent=msg;if(c&&c.appendChild)c.appendChild(t);setTimeout(function(){if(t&&typeof t.remove==='function')t.remove();},3000);}

function exportData(){var data=StoryStore.exportJSON();var blob=new Blob([data],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='novel-data.json';a.click();toast('已导出','success');}
function importData(input){var file=input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){var res;try{res=StoryStore.importJSON(e.target.result);}catch(err){res={ok:false,errors:[String((err&&err.message)||err)]};}if(res&&res.ok){navigate(curPage);toast('已导入','success');}else{toast('导入失败：'+((res&&res.errors&&res.errors[0])||'数据不合法'),'error');}};reader.readAsText(file);}
function resetData(){if(!confirm('确认重置所有数据？'))return;StoryStore.reset();navigate('dashboard');toast('已重置','success');}

// Command palette
var _cmdItems=[{label:'仪表盘',action:function(){navigate('dashboard');}},{label:'章节编辑',action:function(){navigate('editor');}},{label:'人物中心',action:function(){navigate('characters');}},{label:'剧情规划',action:function(){navigate('plot');}},{label:'世界观',action:function(){navigate('worldbuilding');}},{label:'一致性检查',action:function(){navigate('consistency');}},{label:'数据中心',action:function(){navigate('data');}},{label:'设置',action:function(){navigate('settings');}},{label:'新建章节',action:function(){addChapter();}},{label:'新增人物',action:function(){showCharModal();}},{label:'AI分析',action:function(){runAIRuntime();}},{label:'回归测试',action:function(){runRegressionTests();}}];
var _cmdIdx=0;
function filterCmd(){var q=document.getElementById('cmdInput').value.toLowerCase();var filtered=_cmdItems.filter(function(i){return i.label.toLowerCase().indexOf(q)>=0;});var list=document.getElementById('cmdList');list.innerHTML=filtered.map(function(i,idx){return'<div class="cmd-item'+(idx===_cmdIdx?' active':'')+'" onclick="'+(i.cmd||'')+'selectCmd('+idx+')">'+i.label+'</div>';}).join('');_cmdFiltered=filtered;}
var _cmdFiltered=[];
function selectCmd(idx){if(_cmdFiltered[idx])_cmdFiltered[idx].action();closeCmd();}
function closeCmd(){document.getElementById('cmdOverlay').classList.remove('active');document.getElementById('cmdInput').value='';}
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('cmdOverlay').classList.add('active');document.getElementById('cmdInput').focus();filterCmd();}
  if(e.key==='Escape')closeCmd();
});

// ===== Init =====
StoryStore.load();
setTheme(StoryStore.getMeta().theme||'dark');
document.body.style.fontSize=(StoryStore.getMeta().fontSize||15)+'px';
navigate('dashboard');
// [Init] NovelCraft x Story OS initialized
</script>
