// ===== Phase 5.1: Runtime Contracts (pure data only, no executable values) =====
var CONTRACT_VERSION='5.1';
var StoryContract=(function(){
  var STATUS={PROPOSED:'PROPOSED',VALIDATING:'VALIDATING',VALID:'VALID',APPROVED:'APPROVED',
    APPLIED:'APPLIED',VERIFIED:'VERIFIED',REJECTED:'REJECTED',FAILED:'FAILED'};
  var STATUS_LIST=['PROPOSED','VALIDATING','VALID','APPROVED','APPLIED','VERIFIED','REJECTED','FAILED'];
  var CHANGE_TYPES=['add','remove','update'];

  function isPlainObject(v){return!!v&&typeof v==='object'&&!Array.isArray(v);}
  function collectFunctionPaths(value,path,out){
    out=out||[];path=path||'$';
    if(typeof value==='function'){out.push(path);return out;}
    if(Array.isArray(value)){value.forEach(function(v,i){collectFunctionPaths(v,path+'['+i+']',out);});return out;}
    if(isPlainObject(value)){Object.keys(value).forEach(function(k){collectFunctionPaths(value[k],path+'.'+k,out);});return out;}
    return out;
  }
  function deterministicId(prefix,payload){return prefix+'_'+StoryStore.hash(payload);}

  // --- contract factories (pure data) ---
  function makeEntityRef(entityType,entityId,displayName){
    return{entityType:String(entityType||''),entityId:String(entityId||''),displayName:String(displayName||'')};
  }
  function makeEvidence(sourceType,sourceId,start,end,excerpt){
    return{sourceType:String(sourceType||''),sourceId:String(sourceId||''),
      start:(typeof start==='number'?start:0),end:(typeof end==='number'?end:0),excerpt:String(excerpt||'')};
  }
  function makeStateChange(fields){
    fields=fields||{};
    var t=fields.target||{};
    return{
      changeId:String(fields.changeId||''),
      actionId:String(fields.actionId||''),
      type:String(fields.type||'update'),
      target:makeEntityRef(t.entityType,t.entityId,t.displayName),
      path:String(fields.path||''),
      before:(fields.before===undefined?null:fields.before),
      after:(fields.after===undefined?null:fields.after),
      reason:String(fields.reason||''),
      evidence:(Array.isArray(fields.evidence)?fields.evidence:[]).map(function(e){
        return makeEvidence(e&&e.sourceType,e&&e.sourceId,e&&e.start,e&&e.end,e&&e.excerpt);
      }),
      conflict:(fields.conflict===undefined?null:fields.conflict),
      confidence:(typeof fields.confidence==='number'?fields.confidence:null),
      requiresApproval:(fields.requiresApproval===true),
      policyReason:String(fields.policyReason||''),
      timestamp:(typeof fields.timestamp==='number'?fields.timestamp:0)
    };
  }
  function makeChangeSet(fields){
    fields=fields||{};
    return{
      changeSetId:String(fields.changeSetId||''),
      chapterId:String(fields.chapterId||''),
      sourceHash:String(fields.sourceHash||''),
      source:String(fields.source||''),
      operation:String(fields.operation||''),
      reason:String(fields.reason||''),
      policy:(fields.policy===undefined?null:fields.policy),
      analysis:(fields.analysis===undefined?null:fields.analysis),
      evidence:(Array.isArray(fields.evidence)?fields.evidence:[]).map(function(e){
        return makeEvidence(e&&e.sourceType,e&&e.sourceId,e&&e.start,e&&e.end,e&&e.excerpt);
      }),
      changes:(Array.isArray(fields.changes)?fields.changes:[]).slice(),
      createdAt:(typeof fields.createdAt==='number'?fields.createdAt:0),
      status:String(fields.status||STATUS.PROPOSED),
      baseStateHash:String(fields.baseStateHash||''),
      approval:(fields.approval===undefined?null:fields.approval),
      errors:(Array.isArray(fields.errors)?fields.errors:[]).slice(),
      warnings:(Array.isArray(fields.warnings)?fields.warnings:[]).slice()
    };
  }
  function makeValidationResult(valid,errors,warnings,checkedAt){
    return{valid:!!valid,errors:(errors||[]).slice(),warnings:(warnings||[]).slice(),
      checkedAt:(typeof checkedAt==='number'?checkedAt:0)};
  }
  function makeChangeSetId(source,operation,changes,scope){
    return deterministicId('cs',{source:String(source||''),operation:String(operation||''),
      scope:scope||null,
      shape:(changes||[]).map(function(c){return{actionId:c.actionId,type:c.type,path:c.path};})});
  }
  function makeChangeId(changeSetId,path,index){return deterministicId('chg',changeSetId+'|'+path+'|'+index);}

  // --- contract validation ---
  function validateChangeSet(changeSet,checkedAt){
    var errors=[],warnings=[];
    if(!isPlainObject(changeSet))return makeValidationResult(false,['changeSet: expected plain object'],[],checkedAt);
    if(typeof changeSet.changeSetId!=='string'||changeSet.changeSetId.indexOf('cs_')!==0)errors.push('changeSetId: must be a cs_ id');
    if(!changeSet.source)errors.push('source: required');
    if(!changeSet.operation)errors.push('operation: required');
    if(!Array.isArray(changeSet.changes))errors.push('changes: expected array');
    if(STATUS_LIST.indexOf(changeSet.status)<0)errors.push('status: unknown '+changeSet.status);
    if(typeof changeSet.createdAt!=='number')errors.push('createdAt: expected number');
    if(typeof changeSet.baseStateHash!=='string'||!changeSet.baseStateHash)warnings.push('baseStateHash: missing (stale detection disabled)');
    var fnPaths=collectFunctionPaths(changeSet);
    if(fnPaths.length)errors.push('changeSet: executable values at '+fnPaths.join(', '));
    (changeSet.changes||[]).forEach(function(ch,idx){
      var at='changes['+idx+']';
      if(!isPlainObject(ch)){errors.push(at+': expected object');return;}
      if(typeof ch.changeId!=='string'||ch.changeId.indexOf('chg_')!==0)errors.push(at+'.changeId: must be a chg_ id');
      if(!ch.actionId)errors.push(at+'.actionId: required');
      if(CHANGE_TYPES.indexOf(ch.type)<0)errors.push(at+'.type: must be add|remove|update');
      if(!isPlainObject(ch.target)||!ch.target.entityType||!ch.target.entityId)errors.push(at+'.target: entityType and entityId required');
      if(typeof ch.path!=='string'||ch.path.split('.').length<2)errors.push(at+'.path: must be a dotted path');
      if(typeof ch.reason!=='string'||!ch.reason)warnings.push(at+'.reason: empty');
      if(typeof ch.timestamp!=='number')errors.push(at+'.timestamp: expected number');
      if(!('before' in ch)||!('after' in ch))errors.push(at+': before and after are required (may be null)');
      if(!Array.isArray(ch.evidence))errors.push(at+'.evidence: expected array');
      else ch.evidence.forEach(function(e,i){
        if(!isPlainObject(e)){errors.push(at+'.evidence['+i+']: expected object');return;}
        if(!e.sourceType)errors.push(at+'.evidence['+i+'].sourceType: required');
        if(typeof e.sourceId!=='string')errors.push(at+'.evidence['+i+'].sourceId: expected string');
        if(typeof e.start!=='number'||typeof e.end!=='number')errors.push(at+'.evidence['+i+']: start/end must be numbers');
      });
    });
    return makeValidationResult(errors.length===0,errors,warnings,checkedAt);
  }

  // Phase 5.2: ChapterAnalysis id + Evidence validation bound to real source text
  function makeAnalysisId(chapterId,sourceHash){
    return deterministicId('ca',{chapterId:String(chapterId||''),sourceHash:String(sourceHash||''),contract:CONTRACT_VERSION});
  }
  function validateEvidence(evidence,sourceText,options){
    var errors=[],warnings=[];
    var at=(options&&typeof options.now==='number')?options.now:0;
    if(!isPlainObject(evidence))return makeValidationResult(false,['evidence: expected object'],[],at);
    if(!evidence.sourceType)errors.push('evidence.sourceType: required');
    if(typeof evidence.sourceId!=='string'||!evidence.sourceId)errors.push('evidence.sourceId: required');
    if(typeof evidence.excerpt!=='string'||!evidence.excerpt)errors.push('evidence.excerpt: required');
    if(typeof evidence.start!=='number'||typeof evidence.end!=='number'){
      errors.push('evidence.start/end: numbers required');
    }else{
      if(evidence.start<0)errors.push('evidence.start: must be >= 0');
      if(evidence.end<=evidence.start)errors.push('evidence.end: must be > start');
      if(typeof sourceText==='string'){
        if(evidence.end>sourceText.length)errors.push('evidence.end: beyond source length');
        if(evidence.excerpt!==sourceText.slice(evidence.start,evidence.end))errors.push('evidence.excerpt: must equal source.slice(start,end)');
      }
    }
    return makeValidationResult(errors.length===0,errors,warnings,at);
  }
  function validateEvidenceList(list,sourceText,options){
    var errors=[],warnings=[];
    var at=(options&&typeof options.now==='number')?options.now:0;
    if(!Array.isArray(list)||!list.length)return makeValidationResult(false,['evidence: at least one required'],[],at);
    list.forEach(function(e,i){
      var r=validateEvidence(e,sourceText,options);
      r.errors.forEach(function(msg){errors.push('evidence['+i+']: '+msg);});
    });
    return makeValidationResult(errors.length===0,errors,warnings,at);
  }

  // ===== Phase 5.3: ConsistencyIssue / ActionProposal contracts (pure data) =====
  function severityFromPriority(priority){
    var p=(typeof priority==='number')?priority:0;
    if(p>=9)return'blocking';
    if(p>=7)return'error';
    if(p>=5)return'warning';
    return'info';
  }
  function makeConsistencyIssue(fields){
    fields=fields||{};
    var issue={
      issueId:'',
      ruleId:String(fields.ruleId||''),
      severity:fields.severity||severityFromPriority(fields.priority),
      category:String(fields.category||'general'),
      title:String(fields.title||fields.ruleId||''),
      message:String(fields.message||''),
      entityRef:fields.entityRef?makeEntityRef(fields.entityRef.entityType,fields.entityRef.entityId,fields.entityRef.displayName):null,
      evidence:(Array.isArray(fields.evidence)?fields.evidence:[]).map(function(e){
        return makeEvidence(e&&e.sourceType,e&&e.sourceId,e&&e.start,e&&e.end,e&&e.excerpt);
      }),
      location:fields.location?{chapterId:String(fields.location.chapterId||''),
        chapterIndex:(typeof fields.location.chapterIndex==='number'?fields.location.chapterIndex:-1),
        path:String(fields.location.path||'')}:null,
      facts:fields.facts||{},
      suggestedFix:String(fields.suggestedFix||''),
      suggestedChangeSet:fields.suggestedChangeSet||null,
      createdAt:(typeof fields.createdAt==='number')?fields.createdAt:0
    };
    issue.issueId='ci_'+StoryStore.hash({ruleId:issue.ruleId,
      entity:issue.entityRef?issue.entityRef.entityId:'',location:issue.location,facts:issue.facts});
    return issue;
  }
  function makeActionProposal(fields){
    fields=fields||{};
    var proposal={
      actionId:'',
      actionType:String(fields.actionType||''),
      reason:String(fields.reason||''),
      evidence:(Array.isArray(fields.evidence)?fields.evidence:[]).map(function(e){
        return makeEvidence(e&&e.sourceType,e&&e.sourceId,e&&e.start,e&&e.end,e&&e.excerpt);
      }),
      proposedChanges:(Array.isArray(fields.proposedChanges)?fields.proposedChanges:[]).slice(),
      ruleId:String(fields.ruleId||''),
      issueId:String(fields.issueId||''),
      target:fields.target||null,
      confidence:(typeof fields.confidence==='number')?fields.confidence:null,
      requiresApproval:fields.requiresApproval!==false
    };
    proposal.actionId='ap_'+StoryStore.hash({ruleId:proposal.ruleId,issueId:proposal.issueId,type:proposal.actionType,target:proposal.target});
    return proposal;
  }
  function validateConsistencyIssue(issue,checkedAt){
    var errors=[],warnings=[];
    var at=(typeof checkedAt==='number')?checkedAt:0;
    if(!isPlainObject(issue))return makeValidationResult(false,['issue: expected object'],[],at);
    if(!issue.issueId||String(issue.issueId).indexOf('ci_')!==0)errors.push('issueId: must be a ci_ id');
    if(!issue.ruleId)errors.push('ruleId: required');
    if(['blocking','error','warning','info'].indexOf(issue.severity)<0)errors.push('severity: unknown '+issue.severity);
    if(typeof issue.message!=='string')errors.push('message: expected string');
    if(!('entityRef' in issue))errors.push('entityRef: required (may be null)');
    if(!Array.isArray(issue.evidence))errors.push('evidence: expected array');
    if(!issue.location||typeof issue.location!=='object')errors.push('location: required');
    if(!issue.facts||typeof issue.facts!=='object')errors.push('facts: expected object');
    if(typeof issue.suggestedFix!=='string')errors.push('suggestedFix: expected string');
    var fnPaths=collectFunctionPaths(issue);
    if(fnPaths.length)errors.push('issue: executable values at '+fnPaths.join(', '));
    return makeValidationResult(errors.length===0,errors,warnings,at);
  }

  return{
    CONTRACT_VERSION:CONTRACT_VERSION,STATUS:STATUS,STATUS_LIST:STATUS_LIST,CHANGE_TYPES:CHANGE_TYPES,
    makeEntityRef:makeEntityRef,makeEvidence:makeEvidence,makeStateChange:makeStateChange,
    severityFromPriority:severityFromPriority,makeConsistencyIssue:makeConsistencyIssue,
    makeActionProposal:makeActionProposal,validateConsistencyIssue:validateConsistencyIssue,
    makeChangeSet:makeChangeSet,makeValidationResult:makeValidationResult,
    makeChangeSetId:makeChangeSetId,makeChangeId:makeChangeId,makeAnalysisId:makeAnalysisId,
    validateEvidence:validateEvidence,validateEvidenceList:validateEvidenceList,
    validateChangeSet:validateChangeSet,collectFunctionPaths:collectFunctionPaths
  };
})();

// ===== Phase 5.1: ChangeSet lifecycle runtime =====
var ChangeSetRuntime=(function(){
  var S=StoryContract.STATUS;

  function isPlainObject(v){return!!v&&typeof v==='object'&&!Array.isArray(v);}
  function nowOf(options){return(options&&typeof options.now==='number')?options.now:Date.now();}
  function currentStateHash(){return StoryStore.hash(StoryStore.state);}
  function ledger(){return StoryStore.getChangeLedger();}
  function isAlreadyApplied(changeSetId){
    return ledger().some(function(e){return e.changeSetId===changeSetId&&(e.status===S.APPLIED||e.status===S.VERIFIED);});
  }
  function padIdx(n){var s=String(n);while(s.length<3)s='0'+s;return s;}

  function propose(input,options){
    input=input||{};
    var createdAt=nowOf(options);
    var shape=(input.changes||[]).map(function(c,idx){
      return{
        actionId:c.actionId||('action_'+padIdx(idx+1)),
        type:c.type||'update',
        target:c.target||{entityType:'state',entityId:'state',displayName:''},
        path:c.path||'',
        before:(c.before===undefined?null:c.before),
        after:(c.after===undefined?null:c.after),
        reason:c.reason||'',
        evidence:c.evidence||[],
        confidence:(typeof c.confidence==='number'?c.confidence:null),
        requiresApproval:c.requiresApproval===true,
        policyReason:c.policyReason||'',
        timestamp:(c.timestamp===undefined?createdAt:c.timestamp)
      };
    });
    var changeSetId=StoryContract.makeChangeSetId(input.source||'',input.operation||'',shape,
      {chapterId:input.chapterId||'',sourceHash:input.sourceHash||''});
    var changes=shape.map(function(c,idx){
      return StoryContract.makeStateChange({
        changeId:StoryContract.makeChangeId(changeSetId,c.path,idx),
        actionId:c.actionId,type:c.type,target:c.target,path:c.path,before:c.before,after:c.after,
        reason:c.reason,evidence:c.evidence,timestamp:c.timestamp,
        confidence:(typeof c.confidence==='number'?c.confidence:null),
        requiresApproval:c.requiresApproval===true,policyReason:c.policyReason||''
      });
    });
    return StoryContract.makeChangeSet({
      changeSetId:changeSetId,chapterId:input.chapterId||'',sourceHash:input.sourceHash||'',
      source:input.source||'',operation:input.operation||'',reason:input.reason||'',
      evidence:input.evidence||[],policy:input.policy||null,analysis:input.analysis||null,
      changes:changes,createdAt:createdAt,status:S.PROPOSED,baseStateHash:input.baseStateHash||currentStateHash()
    });
  }

  function validate(changeSet,options){
    var at=nowOf(options);
    if(!isPlainObject(changeSet))return{ok:false,status:S.REJECTED,validation:StoryContract.makeValidationResult(false,['changeSet: expected object'],[],at)};
    changeSet.status=S.VALIDATING;
    var validation=StoryContract.validateChangeSet(changeSet,at);
    var errors=validation.errors.slice(),warnings=validation.warnings.slice();
    changeSet.warnings=warnings;
    if(errors.length){
      changeSet.status=S.REJECTED;changeSet.errors=errors;
      return{ok:false,status:S.REJECTED,validation:StoryContract.makeValidationResult(false,errors,warnings,at)};
    }
    changeSet.errors=[];changeSet.status=S.VALID;
    return{ok:true,status:S.VALID,validation:StoryContract.makeValidationResult(true,[],warnings,at)};
  }

  function approve(changeSet,approver,options){
    if(!isPlainObject(changeSet))return{ok:false,status:null,errors:['changeSet: expected object']};
    if(changeSet.status===S.PROPOSED){
      var v=validate(changeSet,options);
      if(!v.ok)return{ok:false,status:changeSet.status,errors:v.validation.errors};
    }
    if(changeSet.status!==S.VALID)return{ok:false,status:changeSet.status,errors:['approve: status must be VALID, got '+changeSet.status]};
    // Phase 5.4: 真实 LLM 提案只能由"人"批准，系统/兼容批准人一律拒绝
    var who=String(approver||'');
    if(changeSet.requiresHumanApproval===true){
      var isSystem=(!who||who==='system'||who.indexOf('system:')===0||who.indexOf('compat:')===0||who==='auto');
      if(isSystem){
        changeSet.errors=(changeSet.errors||[]).concat(['human_approval_required']);
        return{ok:false,status:changeSet.status,errors:['human_approval_required']};
      }
      changeSet.approval={approver:who,approvedAt:nowOf(options),human:true};
    }else{
      changeSet.approval={approver:who||'author',approvedAt:nowOf(options)};
    }
    changeSet.status=S.APPROVED;
    return{ok:true,status:S.APPROVED,errors:[]};
  }

  function reject(changeSet,reason,options){
    if(!isPlainObject(changeSet))return{ok:false,status:null,errors:['changeSet: expected object']};
    changeSet.status=S.REJECTED;
    changeSet.rejection={reason:String(reason||''),rejectedAt:nowOf(options)};
    return{ok:true,status:S.REJECTED,errors:[]};
  }

  function checkPreconditions(changeSet){
    var failures=[];
    // Phase 5.2: compare against the normalized view (the same view verify() uses)
    var normalized=StoryStore.snapshot();
    (changeSet.changes||[]).forEach(function(ch){
      if(ch.type==='add')return;
      var current=StoryStore.valueAtPathIn(normalized,ch.path);
      var expected=(ch.before===undefined?null:ch.before);
      if(current===undefined&&expected===null)return;
      if(StoryStore.hash(current)!==StoryStore.hash(expected))failures.push(ch.path);
    });
    return failures;
  }

  function verify(changeSet,before,after,options){
    var errors=[],warnings=[];
    var diff=StoryStore.structuredDiff(before,after);
    var byPath={};
    diff.changes.forEach(function(c){byPath[c.path]=c;});
    var proposed={};
    (changeSet.changes||[]).forEach(function(ch){
      proposed[ch.path]=true;
      var observed=byPath[ch.path];
      if(observed){
        if(observed.changeType!==ch.type)errors.push('verify: '+ch.path+' expected '+ch.type+' observed '+observed.changeType);
        if(StoryStore.hash(observed.after)!==StoryStore.hash(ch.after))errors.push('verify: '+ch.path+' after value mismatch');
        return;
      }
      // Phase 5.2: object/array-valued changes are observed as sub-path changes
      var subs=diff.changes.filter(function(c){return c.path.indexOf(ch.path+'.')===0;});
      if(!subs.length){errors.push('verify: no observed change at '+ch.path);return;}
      var beforeVal=StoryStore.valueAtPathIn(before,ch.path);
      var afterVal=StoryStore.valueAtPathIn(after,ch.path);
      if(ch.type==='add'){
        if(beforeVal!==undefined)errors.push('verify: '+ch.path+' expected add but a value already existed');
        if(StoryStore.hash(afterVal)!==StoryStore.hash(ch.after))errors.push('verify: '+ch.path+' after value mismatch');
      }else if(ch.type==='remove'){
        if(afterVal!==undefined)errors.push('verify: '+ch.path+' expected remove but value still present');
      }else{
        if(ch.before!==null&&StoryStore.hash(beforeVal)!==StoryStore.hash(ch.before))errors.push('verify: '+ch.path+' before value mismatch');
        if(StoryStore.hash(afterVal)!==StoryStore.hash(ch.after))errors.push('verify: '+ch.path+' after value mismatch');
      }
    });
    diff.changes.forEach(function(c){
      if(proposed[c.path])return;
      var covered=Object.keys(proposed).some(function(p){return c.path.indexOf(p+'.')===0;});
      if(!covered)warnings.push('verify: unproposed change at '+c.path);
    });
    return{valid:errors.length===0,errors:errors,warnings:warnings,checkedAt:nowOf(options),changes:diff.changes};
  }

  function apply(changeSet,options){
    var at=nowOf(options);
    if(!isPlainObject(changeSet))return{ok:false,status:null,errors:['changeSet: expected object']};
    // gate 1: contract validity
    var validation=StoryContract.validateChangeSet(changeSet,at);
    if(!validation.valid){
      changeSet.status=S.REJECTED;changeSet.errors=validation.errors;
      return{ok:false,status:S.REJECTED,errors:validation.errors};
    }
    // gate 2: duplicate (never apply the same ChangeSet twice)
    if(isAlreadyApplied(changeSet.changeSetId))return{ok:false,status:changeSet.status,errors:['duplicate_changeset']};
    // gate 3: stale base state (must not overwrite newer state)
    if(changeSet.baseStateHash&&changeSet.baseStateHash!==currentStateHash()){
      return{ok:false,status:changeSet.status,errors:['stale_changeset']};
    }
    // gate 4: preconditions (before must match current state)
    var failed=checkPreconditions(changeSet);
    if(failed.length)return{ok:false,status:changeSet.status,errors:['precondition_failed: '+failed.join(', ')],paths:failed};
    // gate 5: approval
    if(changeSet.status!==S.APPROVED)return{ok:false,status:changeSet.status,errors:['changeset_not_approved']};

    var before=StoryStore.snapshot();
    changeSet.status=S.APPLIED;
    var results=[];
    try{
      results=AIExecutionLayerBridge.applyChangeSet(changeSet);
    }catch(e){
      StoryStore.rollback(before);
      changeSet.status=S.FAILED;changeSet.errors=[String((e&&e.message)||e)];
      return{ok:false,status:S.FAILED,errors:changeSet.errors};
    }
    var failedWrites=results.filter(function(r){return !r.ok;});
    if(failedWrites.length){
      StoryStore.rollback(before);
      changeSet.status=S.FAILED;
      changeSet.errors=failedWrites.map(function(r){return r.path+': '+(r.errors||[]).join('; ');});
      return{ok:false,status:S.FAILED,errors:changeSet.errors,results:results};
    }
    var after=StoryStore.snapshot();
    var verification=verify(changeSet,before,after,options);
    if(!verification.valid){
      StoryStore.rollback(before);
      changeSet.status=S.FAILED;changeSet.errors=verification.errors;
      return{ok:false,status:S.FAILED,errors:verification.errors,verification:verification};
    }
    changeSet.status=S.VERIFIED;
    StoryStore.appendChangeLedger({
      changeSetId:changeSet.changeSetId,source:changeSet.source,operation:changeSet.operation,

// ===== Phase 5.3: Action -> StateChange migration (ActionProposal -> ChangeSet；永不直写 StoryState) =====
var ActionMigration=(function(){
  var MIGRATED_STATE_ACTIONS=['introduce_conflict','resolve_foreshadow','create_protagonist','designate_protagonist','introduce_sidekick'];
  var DIAGNOSIS_ONLY_ACTIONS=['bring_protagonist_back','increase_pace','flag_inconsistency','flag_relationship_issue',
    'flag_timeline_conflict','flag_world_conflict','flag_power_conflict','flag_unused_character','flag_arc_stagnation',
    'flag_weak_hook','flag_ending_hook'];

  function statusFor(action){
    if(MIGRATED_STATE_ACTIONS.indexOf(action)>=0)return'MIGRATED';
    if(DIAGNOSIS_ONLY_ACTIONS.indexOf(action)>=0)return'MIGRATED_DIAGNOSIS_ONLY';
    return'UNKNOWN';
  }
  // Runtime Migration Matrix（供文档与测试使用）
  function matrix(){
    var all=MIGRATED_STATE_ACTIONS.concat(DIAGNOSIS_ONLY_ACTIONS);
    return all.map(function(action){
      var migrated=MIGRATED_STATE_ACTIONS.indexOf(action)>=0;
      return{
        action:action,
        status:migrated?'MIGRATED':'MIGRATED_DIAGNOSIS_ONLY',
        writesState:migrated,
        viaChangeSet:true,
        requiresApproval:migrated,
        verified:migrated,
        legacyPath:false
      };
    });
  }

  // 伏笔回收必须携带 evidence：从"埋设章节"的真实正文切片构造（excerpt === slice）
  function evidenceForForeshadow(fs){
    if(!fs)return[];
    var chapters=StoryStore.getChapters();
    var idx=(typeof fs.chapterPlaced==='number'&&fs.chapterPlaced>=0)?fs.chapterPlaced:0;
    var ch=chapters[idx]||chapters[chapters.length-1];
    if(!ch)return[];
    var text=String(ch.content||'');
    if(!text.length)return[];
    var marker='[[伏笔:'+fs.content+']]';
    var at=text.indexOf(marker);
    var len=marker.length;
    if(at<0){at=text.indexOf(fs.content);len=String(fs.content||'').length;}
    if(at<0||len<=0){at=0;len=Math.min(text.length,40);}
    if(at+len>text.length)at=Math.max(0,text.length-len);
    return[StoryContract.makeEvidence('chapter',ch.id,at,at+len,text.slice(at,at+len))];
  }

  function changesFor(decision,ctx){
    var out=[];
    var d=decision||{};
    var chapterCount=(ctx&&ctx.storyState&&ctx.storyState.chapters)?ctx.storyState.chapters.length:StoryStore.getChapters().length;
    var evidence=Array.isArray(d.evidence)?d.evidence:[];
    switch(d.action){
      case'introduce_conflict':{
        // 语义幂等：已存在 suggested 冲突则不再提议（旧 _applyDecision 的重复保护迁移至此）
        if(StoryStore.getConflicts().some(function(c){return c.status==='suggested';}))return[];
        var cid=StoryStore.nextId('conflicts');
        out.push({actionId:'action:introduce_conflict:add:'+cid,type:'add',
          target:{entityType:'conflict',entityId:cid,displayName:'核心冲突'},
          path:'conflicts.'+cid,before:null,
          after:{id:cid,type:'person_vs_person',description:'AI建议：引入核心冲突',parties:[],status:'suggested',
            chapterStarted:chapterCount,chapterResolved:null},
          reason:d.reason||'引入核心冲突',evidence:evidence,confidence:d.confidence||0.8});
        break;
      }
      case'resolve_foreshadow':{
        var fid=d.target;
        var fs=StoryStore.getForeshadow(fid);
        if(!fs||fs.status==='resolved')return[];
        var ev=evidence.length?evidence:evidenceForForeshadow(fs);
        if(!ev.length)return[];   // 必须存在 evidence（Policy 同样要求）
        out.push({actionId:'action:resolve_foreshadow:'+fid,type:'update',
          target:{entityType:'foreshadow',entityId:fid,displayName:fs.content},
          path:'foreshadowing.'+fid+'.status',before:fs.status,after:'resolved',
          reason:d.reason||('回收伏笔「'+fs.content+'」'),evidence:ev,confidence:d.confidence||0.9});
        break;
      }
      case'create_protagonist':{
        var pcid=StoryStore.nextId('characters');
        out.push({actionId:'action:create_protagonist:add:'+pcid,type:'add',
          target:{entityType:'character',entityId:pcid,displayName:'主角'},
          path:'characters.'+pcid,before:null,
          after:{id:pcid,name:'主角',gender:'',age:'',charType:'protagonist',tags:[],aliases:[],fields:{},relations:[],
            presence:{firstAppear:0,lastAppear:0,chapterIds:[],appearCount:0},
            aiProfile:{arcStage:'',consistencyScore:100,importance:10}},
          reason:d.reason||'创建主角',evidence:evidence,confidence:d.confidence||0.9});
        break;
      }
      case'designate_protagonist':{
        var tid=d.target;
        var ch=StoryStore.getCharacter(tid);
        if(!ch||ch.charType==='protagonist')return[];
        out.push({actionId:'action:designate_protagonist:'+tid,type:'update',
          target:{entityType:'character',entityId:tid,displayName:ch.name},
          path:'characters.'+tid+'.charType',before:ch.charType,after:'protagonist',
          reason:d.reason||('指定「'+ch.name+'」为主角'),evidence:evidence,confidence:d.confidence||0.85});
        break;
      }
      case'introduce_sidekick':{
        var sid=StoryStore.nextId('characters');
        out.push({actionId:'action:introduce_sidekick:add:'+sid,type:'add',
          target:{entityType:'character',entityId:sid,displayName:'新配角'},
          path:'characters.'+sid,before:null,
          after:{id:sid,name:'配角',gender:'',age:'',charType:'supporting',tags:[],aliases:[],fields:{},relations:[],
            presence:{firstAppear:0,lastAppear:0,chapterIds:[],appearCount:0},
            aiProfile:{arcStage:'',consistencyScore:100,importance:5}},
          reason:d.reason||'引入配角',evidence:evidence,confidence:d.confidence||0.6});
        break;
      }
      default:return[];   // 诊断类动作：不产生状态变更
    }
    return out;
  }

  function propose(decision,ctx,options){
    var d=decision||{};
    var drafts=changesFor(d,ctx||{});
    if(!drafts.length)return null;
    var cs=ChangeSetRuntime.propose({
      source:'ActionMigration.'+String(d.action||'unknown'),
      operation:'runtime_action',
      reason:d.reason||'',
      evidence:Array.isArray(d.evidence)?d.evidence:[],
      changes:drafts,
      baseStateHash:StoryStore.hash(StoryStore.state)
    },options||{});
    cs.ruleId=d.ruleId||'';
    cs.issueId=d.issueId||'';
    cs.actionId=d.actionId||'';
    cs.actionType=d.action||'';
    cs.policy=StoryPolicy.evaluateChangeSet(cs);
    return cs;
  }

  return{
    MIGRATED_STATE_ACTIONS:MIGRATED_STATE_ACTIONS,
    DIAGNOSIS_ONLY_ACTIONS:DIAGNOSIS_ONLY_ACTIONS,
    statusFor:statusFor,matrix:matrix,propose:propose,changesFor:changesFor,
    evidenceForForeshadow:evidenceForForeshadow
  };
})();

// ===== Phase 5.4: AI Provider Contract (Provider -> ProviderResult；永不触碰 StoryState) =====
// 隔离约束：Provider 区块只做 input -> output。不允许调用 StoryStore / StoryEngine / ExecutionLayer。
var ProviderErrors={
  CONFIG_ERROR:'CONFIG_ERROR',AUTH_ERROR:'AUTH_ERROR',NETWORK_ERROR:'NETWORK_ERROR',
  TIMEOUT:'TIMEOUT',RATE_LIMIT:'RATE_LIMIT',INVALID_RESPONSE:'INVALID_RESPONSE',
  SCHEMA_ERROR:'SCHEMA_ERROR',PROVIDER_ERROR:'PROVIDER_ERROR',BUDGET_EXCEEDED:'BUDGET_EXCEEDED',
  CANCELLED:'CANCELLED',UNKNOWN_ERROR:'UNKNOWN_ERROR'
};
function providerErrorCodes(){
  var out=[];Object.keys(ProviderErrors).forEach(function(k){out.push(ProviderErrors[k]);});return out;
}
function makeProviderError(code,message,details){
  var list=providerErrorCodes();
  var c=(list.indexOf(code)>=0)?code:ProviderErrors.UNKNOWN_ERROR;
  return{code:c,message:String(message||''),details:details||null,
    retryable:(c===ProviderErrors.TIMEOUT||c===ProviderErrors.NETWORK_ERROR||c===ProviderErrors.RATE_LIMIT||c===ProviderErrors.PROVIDER_ERROR)};
}
// 粗估 token（不实现复杂 tokenizer；CJK 与 ASCII 混合按 ~2 字符/token）
function estimateTokens(text){return Math.ceil(String(text==null?'':text).length/2);}
function checkTokenBudget(request,options){
  var opts=options||{},budget=opts.budget||{};
  var input=estimateTokens((request&&request.input)||'');
  var maxInput=(typeof budget.maxInputTokens==='number')?budget.maxInputTokens:0;
  var maxOutput=(typeof budget.maxOutputTokens==='number')?budget.maxOutputTokens:0;
  var want=(typeof opts.maxTokens==='number')?opts.maxTokens:0;
  if(maxInput>0&&input>maxInput)return{ok:false,inputTokens:input,error:makeProviderError(ProviderErrors.BUDGET_EXCEEDED,'输入超出预算（'+input+' > '+maxInput+' tokens）',{inputTokens:input,maxInputTokens:maxInput})};
  if(maxOutput>0&&want>maxOutput)return{ok:false,inputTokens:input,error:makeProviderError(ProviderErrors.BUDGET_EXCEEDED,'输出请求超出预算（'+want+' > '+maxOutput+' tokens）',{requestedMaxTokens:want,maxOutputTokens:maxOutput})};
  return{ok:true,inputTokens:input};
}
var AIProviderContract={
  REQUIRED_METHODS:['complete'],
  OPTIONAL_METHODS:['stream'],
  validate:function(p){
    var errors=[];
    if(!p||typeof p!=='object')return{valid:false,errors:['provider: expected object']};
    AIProviderContract.REQUIRED_METHODS.forEach(function(m){if(typeof p[m]!=='function')errors.push('provider.'+m+': required function');});
    if(p.stream!==undefined&&typeof p.stream!=='function')errors.push('provider.stream: expected function');
    if(!p.provider&&!p.providerId)errors.push('provider.provider: required');
    return{valid:errors.length===0,errors:errors};
  }
};
var PROVIDER_RESULT_FIELDS=['provider','model','requestId','success','output','structured','usage','latencyMs','error','rawResponse'];
function makeProviderResult(fields){
  var f=fields||{};
  return{
    provider:String(f.provider||''),
    model:String(f.model||''),
    requestId:String(f.requestId||''),
    success:f.success===true,
    output:(f.output===undefined?null:f.output),
    structured:(f.structured===undefined?null:f.structured),
    usage:{inputTokens:(f.usage&&typeof f.usage.inputTokens==='number')?f.usage.inputTokens:null,
      outputTokens:(f.usage&&typeof f.usage.outputTokens==='number')?f.usage.outputTokens:null,
      totalTokens:(f.usage&&typeof f.usage.totalTokens==='number')?f.usage.totalTokens:null},
    latencyMs:(typeof f.latencyMs==='number')?f.latencyMs:0,
    error:f.error||null,
    rawResponse:(f.rawResponse===undefined?null:f.rawResponse)
  };
}
function validateProviderResult(r){
  var errors=[];
  if(!r||typeof r!=='object')return{valid:false,errors:['result: expected object']};
  PROVIDER_RESULT_FIELDS.forEach(function(k){if(!(k in r))errors.push('result.'+k+': required');});
  if(typeof r.success!=='boolean')errors.push('result.success: expected boolean');
  if(r.error&&providerErrorCodes().indexOf(r.error.code)<0)errors.push('result.error.code: unknown '+r.error.code);
  if(r.success&&r.error)errors.push('result: success with error');
  if(!r.success&&!r.error)errors.push('result: failure without error');
  var fns=StoryContract.collectFunctionPaths({output:r.output,structured:r.structured});
  if(fns.length)errors.push('result: executable values at '+fns.join(', '));
  return{valid:errors.length===0,errors:errors};
}
function isThenable(v){return !!v&&typeof v==='object'&&typeof v.then==='function';}
function providerRequestId(cfg,request){
  // 纯本地确定性 id（不依赖 StoryStore / 时间 / 随机）
  var s=String((cfg&&cfg.provider)||'')+'|'+String((cfg&&cfg.model)||'')+'|'+String((request&&request.input)||'').slice(0,200);
  var h=0;
  for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;}
  return 'req_'+Math.abs(h).toString(36);
}

// ===== MockAIProvider（默认离线、无 API Key、无网络、确定性）=====
function mockExtractionFromRequest(request){
  var text=String((request&&request.input)||'');
  var chapterId=String((request&&request.chapterId)||'');
  var m=text.match(/[\u4e00-\u9fa5]{2,3}/);
  var name=m?m[0]:'主角';
  var at=text.indexOf(name);
  if(at<0)at=0;
  return{characters:[{name:name,evidence:[{sourceId:chapterId,start:at,end:at+name.length}]}],
    locations:[],events:[],relationships:[],foreshadowing:[],timeline:[],emotions:[]};
}
function MockAIProvider(options){
  var opts=options||{};
  var scenario=opts.scenario||'success';
  var canned=opts.output||null;
  return{
    providerId:'mock',provider:'mock',model:String(opts.model||'mock-model-v1'),
    offline:true,requiresApiKey:false,deterministic:true,
    scenarios:['success','timeout','network_error','auth_error','rate_limit','malformed_json','schema_error','empty','provider_error'],
    getScenario:function(){return scenario;},
    setScenario:function(s){scenario=String(s||'success');return scenario;},
    complete:function(request,o){return mockComplete(request,o,scenario,canned,opts);},
    stream:function(request,onChunk,o){
      var res=mockComplete(request,o,scenario,canned,opts);
      var text=String(res.rawResponse||'');
      var chunks=0;
      for(var i=0;i<text.length;i+=40){
        chunks++;
        if(typeof onChunk==='function')onChunk({delta:text.slice(i,i+40),index:chunks-1});
      }
      res.chunks=chunks;
      return res;
    }
  };
}
function mockComplete(request,options,scenario,canned,providerOpts){
  var model=String((providerOpts&&providerOpts.model)||'mock-model-v1');
  var requestId='mock-'+(scenario||'success');
  var inputTokens=estimateTokens((request&&request.input)||'');
  function fail(code,message,raw){
    return makeProviderResult({provider:'mock',model:model,requestId:requestId,success:false,output:null,structured:null,
      usage:{inputTokens:inputTokens,outputTokens:0,totalTokens:null},latencyMs:0,
      error:makeProviderError(code,message),rawResponse:(raw===undefined?null:raw)});
  }
  var sig=(options&&options.signal)||null;
  if(sig&&sig.aborted)return fail(ProviderErrors.CANCELLED,'请求已取消（AbortController）');
  if(scenario==='timeout')return fail(ProviderErrors.TIMEOUT,'模拟超时');
  if(scenario==='network_error')return fail(ProviderErrors.NETWORK_ERROR,'模拟网络错误');
  if(scenario==='auth_error')return fail(ProviderErrors.AUTH_ERROR,'模拟鉴权失败');
  if(scenario==='rate_limit')return fail(ProviderErrors.RATE_LIMIT,'模拟限流');
  if(scenario==='provider_error')return fail(ProviderErrors.PROVIDER_ERROR,'模拟服务端错误');
  if(scenario==='empty')return fail(ProviderErrors.INVALID_RESPONSE,'模型返回空响应','');
  if(scenario==='malformed_json')return fail(ProviderErrors.INVALID_RESPONSE,'模型输出不是合法 JSON（拒绝猜测）','{characters:[');
  if(scenario==='schema_error')return fail(ProviderErrors.SCHEMA_ERROR,'结构化输出不符合 schema',JSON.stringify({characters:'not-an-array'}));
  var structured=(canned||mockExtractionFromRequest(request));
  var text=JSON.stringify(structured);
  if(options&&options.schema&&typeof options.schema.validate==='function'){
    var v=options.schema.validate(structured);
    if(!v||v.valid!==true)return fail(ProviderErrors.SCHEMA_ERROR,'结构化输出不符合 schema',text);
  }
  return makeProviderResult({provider:'mock',model:model,requestId:requestId,success:true,output:text,structured:structured,
    usage:{inputTokens:inputTokens,outputTokens:estimateTokens(text),totalTokens:null},latencyMs:0,error:null,rawResponse:text});
}

// ===== OpenAI-compatible Provider（唯一真实 HTTP 实现；transport 可注入以便离线测试）=====
function defaultProviderTransport(url,init){
  if(typeof fetch!=='function')return Promise.reject(new Error('fetch unavailable (NETWORK_ERROR)'));
  return fetch(url,init).then(function(res){
    return res.text().then(function(t){return{ok:res.ok,status:res.status,text:t};});
  });
}
function classifyTransportThrow(e){
  var msg=String((e&&e.message)||e||'');
  var name=String((e&&e.name)||'');
  if(name==='AbortError'||/abort|cancel/i.test(msg))return abortProviderError();
  if(/timeout|timed out/i.test(msg))return makeProviderError(ProviderErrors.TIMEOUT,msg);
  if(/fetch|network|enotfound|econn|dns|socket|unavailable/i.test(msg))return makeProviderError(ProviderErrors.NETWORK_ERROR,msg);
  return makeProviderError(ProviderErrors.UNKNOWN_ERROR,msg);
}
function classifyHttpResponse(res){
  if(!res)return makeProviderError(ProviderErrors.UNKNOWN_ERROR,'空响应对象');
  var status=(typeof res.status==='number')?res.status:0;
  if(status===401||status===403)return makeProviderError(ProviderErrors.AUTH_ERROR,'HTTP '+status);
  if(status===429)return makeProviderError(ProviderErrors.RATE_LIMIT,'HTTP 429');
  if(status===400||status===404||status===422)return makeProviderError(ProviderErrors.CONFIG_ERROR,'HTTP '+status);
  if(status>=500)return makeProviderError(ProviderErrors.PROVIDER_ERROR,'HTTP '+status);
  if(res.ok===false&&status===0)return makeProviderError(ProviderErrors.NETWORK_ERROR,'传输失败');
  return null;
}
function buildProviderBody(cfg,request,options){
  var opts=options||{};
  var content=String((request&&request.input)||'');
  var sys=String((request&&request.system)||'你是结构化抽取器，只输出 JSON。');
  var messages=[{role:'system',content:sys},{role:'user',content:content}];
  var temperature=(typeof opts.temperature==='number')?opts.temperature:((typeof cfg.temperature==='number')?cfg.temperature:0.2);
  if((cfg.envelopeMode||'openai')==='ollama')return{model:String(cfg.model||''),messages:messages,stream:false,format:'json',options:{temperature:temperature}};
  var body={model:String(cfg.model||''),messages:messages,temperature:temperature,response_format:{type:'json_object'}};
  var mt=(typeof opts.maxTokens==='number')?opts.maxTokens:cfg.maxTokens;
  if(typeof mt==='number'&&mt>0)body.max_tokens=mt;
  return body;
}
function extractEnvelopeContent(envelope,mode){
  if(mode==='ollama'){
    if(envelope&&envelope.message&&typeof envelope.message.content==='string')return envelope.message.content;
    return null;
  }
  try{return envelope.choices[0].message.content;}catch(e){return null;}
}
function extractEnvelopeUsage(envelope,mode){
  if(mode==='ollama')return{inputTokens:(envelope&&envelope.prompt_eval_count)||null,outputTokens:(envelope&&envelope.eval_count)||null,totalTokens:null};
  var u=(envelope&&envelope.usage)||{};
  return{inputTokens:u.prompt_tokens||null,outputTokens:u.completion_tokens||null,totalTokens:u.total_tokens||null};
}
function openAICompatibleComplete(request,options,deps){
  var cfg=deps.cfg||{},apiKey=String(deps.apiKey||''),transport=deps.transport||defaultProviderTransport;
  var opts=options||{};
  var mode=cfg.envelopeMode||'openai';
  var model=String(cfg.model||'');
  var requestId=String(opts.requestId||providerRequestId(cfg,request));
  var attempts=0;
  var asyncMode=false;
  var retryDelays=[];
  var signal=opts.signal||cfg.signal||null;
  if(signal&&signal.aborted)return makeProviderResult({provider:String(cfg.provider||'openai-compatible'),model:model,
    requestId:requestId,success:false,error:abortProviderError()});
  var started=(typeof opts.now==='number')?opts.now:Date.now();
  function elapsed(){return Math.max(0,((typeof opts.now==='number')?opts.now:Date.now())-started);}
  function result(fields){
    var r=makeProviderResult({provider:String(cfg.provider||'openai-compatible'),model:model,requestId:requestId,
      success:fields.success===true,output:(fields.output===undefined?null:fields.output),
      structured:(fields.structured===undefined?null:fields.structured),
      usage:fields.usage||{inputTokens:null,outputTokens:null,totalTokens:null},

  var budget=checkTokenBudget(request,{budget:{maxInputTokens:cfg.maxInputTokens,maxOutputTokens:cfg.maxOutputTokens},maxTokens:opts.maxTokens});
  if(!budget.ok)return result({success:false,error:budget.error,usage:{inputTokens:budget.inputTokens,outputTokens:0,totalTokens:null}});
  if(!cfg.baseURL)return result({success:false,error:makeProviderError(ProviderErrors.CONFIG_ERROR,'缺少 baseURL')});
  if(!/^https?:\/\//.test(String(cfg.baseURL)))return result({success:false,error:makeProviderError(ProviderErrors.CONFIG_ERROR,'baseURL 必须是 http(s) 地址')});
  if(cfg.requiresApiKey!==false&&!apiKey)return result({success:false,error:makeProviderError(ProviderErrors.AUTH_ERROR,'缺少 API Key')});
  var url=String(cfg.baseURL).replace(/\/+$/,'')+String(cfg.path||'/chat/completions');
  var headers={'Content-Type':'application/json'};

  var init={method:'POST',headers:headers,body:JSON.stringify(buildProviderBody(cfg,request,opts))};

    if(!raw)return result({success:false,error:makeProviderError(ProviderErrors.INVALID_RESPONSE,'响应为空'),rawResponse:''});
    var envelope=null;

    try{structured=JSON.parse(content);}catch(e){return result({success:false,error:makeProviderError(ProviderErrors.INVALID_RESPONSE,'模型输出不是合法 JSON（拒绝猜测）'),rawResponse:content});}
    if(opts.schema&&typeof opts.schema.validate==='function'){
      var v=opts.schema.validate(structured);
      if(!v||v.valid!==true)return result({success:false,error:makeProviderError(ProviderErrors.SCHEMA_ERROR,'结构化输出不符合 schema',{errors:(v&&v.errors)||[]}),rawResponse:content});

    if(isThenable(out)){

      var chained=out.then(onValue,onThrow);
      if(typeof timeoutMs==='number'&&timeoutMs>0&&typeof setTimeout==='function'){

// ===== Provider Settings（API Key 只存本机 localStorage 的独立键，绝不进入 StoryState）=====
var PROVIDER_CONFIG_KEY='novelcraft_provider_config_v1';
var ProviderSettings={
  KEY:PROVIDER_CONFIG_KEY,
  defaults:function(){
    return{enabled:false,provider:'mock',baseURL:'',model:'mock-model-v1',apiKey:'',
      temperature:0.2,maxTokens:1024,timeoutMs:15000,maxRetries:1,maxInputTokens:6000,maxOutputTokens:1500};
  },
  load:function(){
    var d=ProviderSettings.defaults();
    try{
      var raw=localStorage.getItem(PROVIDER_CONFIG_KEY);
      var cfg=raw?JSON.parse(raw):{};
      Object.keys(d).forEach(function(k){if(cfg[k]===undefined)cfg[k]=d[k];});
      return cfg;
    }catch(e){return d;}
  },
  save:function(cfg){
    var d=ProviderSettings.defaults(),out={};
    Object.keys(d).forEach(function(k){out[k]=(cfg&&cfg[k]!==undefined)?cfg[k]:d[k];});
    try{localStorage.setItem(PROVIDER_CONFIG_KEY,JSON.stringify(out));}catch(e){}
    return out;
  },
  masked:function(cfg){
    cfg=cfg||ProviderSettings.load();
    var key=String(cfg.apiKey||'');
    return{enabled:!!cfg.enabled,provider:String(cfg.provider||''),baseURL:String(cfg.baseURL||''),
      model:String(cfg.model||''),hasApiKey:!!key,apiKeyMasked:key?('****'+key.slice(-4)):'',
      temperature:cfg.temperature,maxTokens:cfg.maxTokens,timeoutMs:cfg.timeoutMs};
  },
  clear:function(){try{localStorage.removeItem(PROVIDER_CONFIG_KEY);}catch(e){}return ProviderSettings.defaults();}
};
var ProviderRuntime={
  lastResult:null,lastChunks:0,
  resolve:function(options){
    var opts=options||{};
    if(opts.provider)return opts.provider;
    var cfg=opts.config||ProviderSettings.load();
    if(!cfg.enabled)return null;
    return ProviderRegistry.create(cfg);
  },
  config:function(options){return (options&&options.config)||ProviderSettings.load();},
  complete:function(provider,request,options){
    var check=AIProviderContract.validate(provider);
    if(!check.valid){
      var bad=makeProviderResult({success:false,error:makeProviderError(ProviderErrors.CONFIG_ERROR,check.errors.join('; '))});
      ProviderRuntime.lastResult=bad;
      return bad;
    }
    var res=provider.complete(request||{},options||{});
    if(isThenable(res))return res.then(function(r){ProviderRuntime.lastResult=r;return r;});
    ProviderRuntime.lastResult=res;
    return res;
  },
  stream:function(provider,request,onChunk,options){
    if(!provider||typeof provider.stream!=='function')return ProviderRuntime.complete(provider,request,options);
    var chunks=0;
    var wrapped=function(c){chunks++;if(typeof onChunk==='function')onChunk(c);};
    var res=provider.stream(request||{},wrapped,options||{});
    function done(r){r.chunks=chunks;ProviderRuntime.lastChunks=chunks;ProviderRuntime.lastResult=r;return r;}
    if(isThenable(res))return res.then(done);
    return done(res);
  },
  auditFields:function(res){
    if(!res)return null;
    return{provider:res.provider,model:res.model,requestId:res.requestId,
      promptHash:String((res.requestId||'')),usage:res.usage,latencyMs:res.latencyMs};
  }
};

// ===== Phase 5.4: LLM 结构化输出契约（JSON -> Parse -> Schema Validate -> Normalize）=====
var ChapterExtractionSchema={
  name:'ChapterExtraction',
  ARRAY_FIELDS:['characters','locations','events','relationships','foreshadowing','timeline','emotions'],
  validate:function(obj){
    var errors=[];
    if(!obj||typeof obj!=='object'||Array.isArray(obj))return{valid:false,errors:['extraction: expected object']};
    ChapterExtractionSchema.ARRAY_FIELDS.forEach(function(k){
      if(obj[k]===undefined)return;
      if(!Array.isArray(obj[k]))errors.push(k+': expected array');
    });
    if(Array.isArray(obj.characters)){
      obj.characters.forEach(function(c,i){
        if(!c||typeof c!=='object'){errors.push('characters['+i+']: expected object');return;}
        if(typeof c.name!=='string'||!c.name.length)errors.push('characters['+i+'].name: required string');
        if(c.confidence!==undefined&&typeof c.confidence!=='number')errors.push('characters['+i+'].confidence: expected number');
        if(c.evidence!==undefined&&!Array.isArray(c.evidence))errors.push('characters['+i+'].evidence: expected array');
        if(c.fields!==undefined&&(typeof c.fields!=='object'||Array.isArray(c.fields)))errors.push('characters['+i+'].fields: expected object');
      });
    }
    [['locations','name'],['events','event'],['foreshadowing','content'],['timeline','time'],['emotions','emotion']].forEach(function(pair){
      var k=pair[0],label=pair[1];
      if(!Array.isArray(obj[k]))return;
      obj[k].forEach(function(item,i){
        if(typeof item==='string')return;
        if(!item||typeof item!=='object'){errors.push(k+'['+i+']: expected string or object');return;}
        if(item[label]!==undefined&&typeof item[label]!=='string')errors.push(k+'['+i+'].'+label+': expected string');
      });
    });
    if(Array.isArray(obj.relationships)){
      obj.relationships.forEach(function(r,i){
        if(!r||typeof r!=='object'){errors.push('relationships['+i+']: expected object');return;}
        if(typeof r.from!=='string'&&typeof r.fromId!=='string')errors.push('relationships['+i+'].from: required string');
        if(typeof r.to!=='string'&&typeof r.toId!=='string')errors.push('relationships['+i+'].to: required string');
        if(r.type!==undefined&&typeof r.type!=='string')errors.push('relationships['+i+'].type: expected string');
      });
    }
    return{valid:errors.length===0,errors:errors};
  }
};
function normalizeChapterExtraction(obj){
  var out={};
  ChapterExtractionSchema.ARRAY_FIELDS.forEach(function(k){out[k]=Array.isArray(obj&&obj[k])?obj[k].slice():[];});
  out.characters=out.characters.filter(function(c){return c&&typeof c==='object'&&typeof c.name==='string'&&c.name.length;})
    .map(function(c){return{name:String(c.name),confidence:(typeof c.confidence==='number')?c.confidence:null,
      evidence:Array.isArray(c.evidence)?c.evidence.slice():[],
      fields:(c.fields&&typeof c.fields==='object'&&!Array.isArray(c.fields))
        ?{personality:String(c.fields.personality||''),ability:String(c.fields.ability||''),goal:String(c.fields.goal||'')}:null};});
  out.locations=out.locations.map(function(l){return (typeof l==='string')?{name:l}:{name:String((l&&(l.name||l.location))||'')};})
    .filter(function(l){return !!l.name;});
  out.events=out.events.map(function(e){return (typeof e==='string')?{event:e}:{event:String((e&&e.event)||''),evidence:Array.isArray(e&&e.evidence)?e.evidence.slice():[]};})
    .filter(function(e){return !!e.event;});
  out.foreshadowing=out.foreshadowing.map(function(f){return (typeof f==='string')?{content:f}:{content:String((f&&(f.content||f.text))||''),evidence:Array.isArray(f&&f.evidence)?f.evidence.slice():[]};})
    .filter(function(f){return !!f.content;});
  out.timeline=out.timeline.map(function(t){return (typeof t==='string')?{time:t}:{time:String((t&&(t.time||t.hint))||''),evidence:Array.isArray(t&&t.evidence)?t.evidence.slice():[]};})
    .filter(function(t){return !!t.time;});
  out.emotions=out.emotions.map(function(em){return (typeof em==='string')?{emotion:em}:{emotion:String((em&&(em.emotion||em.name))||'')};})
    .filter(function(em){return !!em.emotion;});
  out.relationships=out.relationships.map(function(r){
    return{from:String((r&&(r.from||r.fromId))||''),to:String((r&&(r.to||r.toId))||''),type:String((r&&r.type)||'')};
  }).filter(function(r){return !!r.from&&!!r.to;});
  return out;
}
// ===== Evidence 重新验证：LLM 提供的 evidence 不可信，必须由系统重新读取原文并 slice =====
function revalidateEvidence(rawList,chapterId,sourceText){
  var accepted=[],rejected=[];
  var text=String(sourceText||'');
  (Array.isArray(rawList)?rawList:[]).forEach(function(raw,i){
    var srcId=String((raw&&raw.sourceId)||chapterId||'');
    if(srcId!==String(chapterId||'')){rejected.push({index:i,reason:'sourceId 不匹配：'+srcId});return;}
    var start=(raw&&typeof raw.start==='number')?raw.start:null;
    var end=(raw&&typeof raw.end==='number')?raw.end:null;
    if(start===null&&raw&&typeof raw.excerpt==='string'){
      var at=text.indexOf(raw.excerpt);
      if(at<0){rejected.push({index:i,reason:'excerpt 无法在原文中定位'});return;}
      start=at;end=at+raw.excerpt.length;
    }
    if(start===null||end===null||start<0||end<=start||end>text.length){rejected.push({index:i,reason:'范围非法或越界'});return;}
    var slice=text.slice(start,end);
    if(raw&&typeof raw.excerpt==='string'&&raw.excerpt!==slice){rejected.push({index:i,reason:'excerpt 与原文切片不一致（疑似编造）'});return;}
    var ev=StoryContract.makeEvidence('chapter',srcId,start,end,slice);
    var v=StoryContract.validateEvidence(ev,text);
    if(!v.valid){rejected.push({index:i,reason:'Evidence 校验失败：'+v.errors.join('; ')});return;}
    accepted.push(ev);
  });
  return{accepted:accepted,rejected:rejected};
}
// ===== LLM Proposal：ProviderResult -> StateChange -> ChangeSet（before 一律由系统生成）=====
var LLMProposalBridge={
  toStateChanges:function(input){
    input=input||{};
    var chapterId=String(input.chapterId||'');
    var chapter=input.chapter||{};
    var extraction=input.extraction||normalizeChapterExtraction({});
    var verified=input.verified||{};
    var chapterIndex=(typeof input.chapterIndex==='number')?input.chapterIndex:0;
    var now=(typeof input.now==='number')?input.now:Date.now();
    var drafts=[],rejected=[];
    // before 一律由系统从"规范化快照"生成（与前置条件/verify 同一视图），绝不用 LLM 提供的状态
    var normalized=(StoryStore.snapshot().chapters||[]).filter(function(c){return c.id===chapterId;})[0]||chapter;
    var existing=(normalized&&normalized.aiAnalysis)?normalized.aiAnalysis:null;
    var afterAnalysis={
      characters:extraction.characters.map(function(c){return c.name;}),
      locations:extraction.locations.map(function(l){return l.name;}),
      events:extraction.events.map(function(e){return e.event;}),
      foreshadowHits:extraction.foreshadowing.map(function(f){return f.content;}),
      emotions:extraction.emotions.map(function(e){return e.emotion;}),
      timeHints:extraction.timeline.map(function(t){return t.time;}),
      lastParsed:now
    };
    if(StoryStore.hash(afterAnalysis)!==StoryStore.hash(existing)){
      drafts.push({actionId:'llm:aiAnalysis:'+chapterId,type:'update',
        target:{entityType:'chapter',entityId:chapterId,displayName:chapterId},
        path:'chapters.'+chapterId+'.aiAnalysis',before:existing,after:afterAnalysis,
        reason:'LLM 结构化抽取（人物 '+extraction.characters.length+' / 事件 '+extraction.events.length+'）',
        evidence:(verified[chapterId]||[]).slice(0,1),confidence:0.7});
    }
    extraction.characters.forEach(function(c){
      var r=StoryEngine.resolveEntity(c.name);
      if(r&&r.status==='resolved')return;
      var ev=(verified[c.name]||[]);
      if(!ev.length){rejected.push({kind:'character',name:c.name,reason:'缺少可验证 evidence（拒绝创建）'});return;}
      var id=StoryStore.nextId('characters');
      drafts.push({actionId:'llm:character:'+c.name,type:'add',
        target:{entityType:'character',entityId:id,displayName:c.name},
        path:'characters.'+id,before:null,
        after:{id:id,name:c.name,gender:'',age:'',charType:'supporting',tags:['llm'],aliases:[],fields:{},relations:[],
          presence:{firstAppear:chapterIndex,lastAppear:chapterIndex,chapterIds:[chapterIndex],appearCount:0},
          aiProfile:{arcStage:'',consistencyScore:100,importance:5}},
        reason:'LLM 抽取到新角色「'+c.name+'」',evidence:ev,confidence:0.7});
    });
    var entityUpdates=LLMProposalBridge.toEntityUpdates({chapterId:chapterId,extraction:extraction,verified:verified});
    entityUpdates.updates.forEach(function(u){drafts.push(u);});
    entityUpdates.rejected.forEach(function(x){rejected.push(x);});
    extraction.foreshadowing.forEach(function(f){
      var ev=(verified['fs:'+f.content]||[]);
      if(!ev.length){rejected.push({kind:'foreshadowing',content:f.content,reason:'伏笔变更必须携带可验证 evidence'});return;}
      var id=StoryStore.nextId('foreshadowing');
      drafts.push({actionId:'llm:foreshadowing:'+f.content,type:'add',
        target:{entityType:'foreshadow',entityId:id,displayName:f.content},
        path:'foreshadowing.'+id,before:null,
        after:{id:id,content:f.content,chapterPlaced:chapterIndex,chapterExpected:0,status:'pending',note:'LLM 抽取',linkedChapterId:null},
        reason:'LLM 抽取到伏笔',evidence:ev,confidence:0.65});
    });
    extraction.relationships.forEach(function(rel){
      var a=StoryEngine.resolveEntity(rel.from),b=StoryEngine.resolveEntity(rel.to);
      if(!a||!b||a.status!=='resolved'||b.status!=='resolved'){
        rejected.push({kind:'relationship',from:rel.from,to:rel.to,reason:'实体未解析，无法建立关系'});
        return;
      }
      var existingPair=(StoryStore.snapshot().relationships||[]).filter(function(x){
        return (x.fromId===a.entityRef.entityId&&x.toId===b.entityRef.entityId)||
               (x.fromId===b.entityRef.entityId&&x.toId===a.entityRef.entityId);
      })[0];
      if(existingPair)return;   // 已存在：改为最小差异更新（toEntityUpdates）
      var id=StoryStore.nextId('relationships');
      drafts.push({actionId:'llm:relationship:'+a.entityRef.entityId+'>'+b.entityRef.entityId,type:'add',
        target:{entityType:'relationship',entityId:id,displayName:rel.from+'->'+rel.to},
        path:'relationships.'+id,before:null,
        after:{id:id,fromId:a.entityRef.entityId,toId:b.entityRef.entityId,type:rel.type||'关联',note:'LLM 抽取'},
        reason:'LLM 抽取出关系',evidence:[],confidence:0.6});
    });
    return{drafts:drafts,rejected:rejected};
  },
  propose:function(input){
    input=input||{};
    var built=LLMProposalBridge.toStateChanges(input);
    if(!built.drafts.length)return null;
    var res=input.providerResult||null;
    var cs=ChangeSetRuntime.propose({
      source:'LLM.'+String(res?res.provider:'unknown'),

      promptHash:String(input.promptHash||StoryStore.hash({input:String((input.chapter&&input.chapter.content)||'').slice(0,500),task:'chapter_extraction'})),
      usage:res?res.usage:null,latencyMs:res?(res.latencyMs||0):0};

};

        summary:null};

    }

    if(!provider)return deterministic('LLM disabled：未配置或未启用 Provider',null,[]);
    var cfg=ProviderRuntime.config(opts);
    var built=StoryContextBuilder.buildExtractionContext(String(chapterId),
      {maxInputTokens:cfg.maxInputTokens,reserveOutputTokens:cfg.maxOutputTokens,
        instructions:'只输出 JSON：{"characters":[{"name":"","evidence":[{"start":0,"end":2}],"fields":{"personality":"","ability":"","goal":""}}],"locations":[],"events":[],"relationships":[],"foreshadowing":[],"timeline":[],"emotions":[]}'});
    var request={input:String(chapter.content||''),context:built.prompt.context,chapterId:String(chapterId),

    var res=ProviderRuntime.complete(provider,request,{schema:ChapterExtractionSchema,
      timeoutMs:cfg.timeoutMs,maxRetries:cfg.maxRetries,maxTokens:cfg.maxTokens,temperature:cfg.temperature,
      budget:{maxInputTokens:cfg.maxInputTokens,maxOutputTokens:cfg.maxOutputTokens},requestId:opts.requestId,
      promptHash:built.prompt.promptHash,signal:opts.signal});
    opts.promptHash=built.prompt.promptHash;
    opts.contextReport=built.report;
    if(isThenable(res))return res.then(function(r){return LLMChapterAnalysis.finish(chapterId,chapter,chapterIndex,r,opts,deterministic);});
    return LLMChapterAnalysis.finish(chapterId,chapter,chapterIndex,res,opts,deterministic);
  },
  finish:function(chapterId,chapter,chapterIndex,res,opts,deterministic){
    var promptHash=String(opts.promptHash||'');

        provider:fields.provider||'',model:fields.model||'',requestId:fields.requestId||'',
        usage:fields.usage||null,latencyMs:(typeof fields.latencyMs==='number')?fields.latencyMs:0,

      auditRecord({provider:res?res.provider:'',model:res?res.model:'',requestId:res?res.requestId:'',
        usage:res?res.usage:null,latencyMs:res?res.latencyMs:0,rawResponse:res?res.rawResponse:null,
        structured:null,error:LLMChapterAnalysis.lastError});

    if(!v.valid){
      LLMChapterAnalysis.lastError=makeProviderError(ProviderErrors.SCHEMA_ERROR,v.errors.join('; '));
      auditRecord({provider:res.provider,model:res.model,requestId:res.requestId,usage:res.usage,latencyMs:res.latencyMs,
        rawResponse:res.rawResponse,structured:res.structured,error:LLMChapterAnalysis.lastError});
      var outSchema=deterministic('schema failed -> reject -> deterministic fallback',res,[LLMChapterAnalysis.lastError]);
      outSchema.auditId=LLMChapterAnalysis.lastAuditId;
      return outSchema;
    }
    var auditId=auditRecord({provider:res.provider,model:res.model,requestId:res.requestId,usage:res.usage,
      latencyMs:res.latencyMs,rawResponse:res.rawResponse,structured:res.structured,error:null});
    var extraction=normalizeChapterExtraction(res.structured);
    var text=String(chapter.content||'');
    var verified={},evidenceRejected=[];
    verified[chapterId]=[];
    extraction.characters.forEach(function(c){
      var out=revalidateEvidence(c.evidence,chapterId,text);
      verified[c.name]=out.accepted;
      out.rejected.forEach(function(r){evidenceRejected.push({kind:'character',name:c.name,reason:r.reason});});
      if(out.accepted.length)verified[chapterId]=verified[chapterId].concat(out.accepted.slice(0,1));
    });
    extraction.foreshadowing.forEach(function(f){
      var out=revalidateEvidence(f.evidence,chapterId,text);
      verified['fs:'+f.content]=out.accepted;
      out.rejected.forEach(function(r){evidenceRejected.push({kind:'foreshadowing',content:f.content,reason:r.reason});});
    });
    var built=LLMProposalBridge.toStateChanges({chapterId:chapterId,chapter:chapter,chapterIndex:chapterIndex,
      extraction:extraction,verified:verified,providerResult:res,now:opts.now});
    var cs=LLMProposalBridge.propose({chapterId:chapterId,chapter:chapter,chapterIndex:chapterIndex,
      extraction:extraction,verified:verified,providerResult:res,options:opts,
      promptHash:String(opts.promptHash||'')});
    if(cs)cs.auditId=auditId;
    var out2={source:'llm',chapterId:chapterId,auditId:auditId,promptHash:promptHash,
      contextReport:opts.contextReport||null,
      analysis:StoryEngine.analyzeChapter(chapterId,{now:opts.now}),
      extraction:extraction,providerResult:res,changeSet:cs,drafts:built.drafts,rejectedFacts:built.rejected,
      evidenceRejected:evidenceRejected,errors:[],fallback:false,reason:'',llmEnabled:true,
      summary:{provider:res.provider,model:res.model,requestId:res.requestId,latencyMs:res.latencyMs,usage:res.usage,
        characters:extraction.characters.length,foreshadowing:extraction.foreshadowing.length,
        relationships:extraction.relationships.length}};
    LLMChapterAnalysis.lastResult=out2;
    return out2;
  },
  // ===== Phase 6: Copilot 流式分析（buffer → ProviderResult → validation → proposal；流式途中绝不写 StoryState）=====
  runStream:function(chapterId,options,onChunk){
    var opts=options||{};
    var chapter=StoryStore.getChapter(chapterId);
    if(!chapter)return null;
    var cfg=ProviderRuntime.config(opts);
    LLMStreamState={active:true,buffer:'',chunks:0,task:'chapter_extraction',chapterId:String(chapterId),
      startedAt:(typeof opts.now==='number')?opts.now:Date.now(),finishedAt:0,aborted:false,error:null};
    var provider=ProviderRuntime.resolve(opts);
    if(!provider){
      LLMStreamState.active=false;LLMStreamState.finishedAt=Date.now();
      var det=LLMChapterAnalysis.analyzeChapter(chapterId,opts);
      det.streamed=true;det.streamState={chunks:0,bufferLength:0,aborted:false};
      return det;
    }
    var built=StoryContextBuilder.buildExtractionContext(String(chapterId),
      {maxInputTokens:cfg.maxInputTokens,reserveOutputTokens:cfg.maxOutputTokens});
    var wrapped=function(c){
      LLMStreamState.chunks++;
      LLMStreamState.buffer+=String((c&&c.delta)||'');
      if(typeof onChunk==='function')onChunk(c,LLMStreamState);
    };
    var res=ProviderRuntime.stream(provider,{input:String(chapter.content||''),context:built.prompt.context,
      chapterId:String(chapterId),task:'chapter_extraction',system:built.prompt.system,promptHash:built.prompt.promptHash},
      wrapped,{schema:ChapterExtractionSchema,promptHash:built.prompt.promptHash,timeoutMs:cfg.timeoutMs,
        maxRetries:cfg.maxRetries,maxTokens:cfg.maxTokens,signal:opts.signal});
    function done(r){
      LLMStreamState.active=false;
      LLMStreamState.finishedAt=Date.now();
      LLMStreamState.error=r&&r.error?r.error:null;
      LLMStreamState.aborted=!!(r&&r.error&&r.error.code==='CANCELLED');
      var out=LLMChapterAnalysis.finish(chapterId,chapter,StoryStore.getChapters().indexOf(chapter),r,
        {provider:provider,config:opts.config,promptHash:built.prompt.promptHash,contextReport:built.report},
        function(reason,pr,errs){return LLMChapterAnalysis.analyzeChapter(chapterId,opts);});
      out.streamed=true;
      out.streamState={chunks:LLMStreamState.chunks,bufferLength:LLMStreamState.buffer.length,aborted:LLMStreamState.aborted};
      return out;
    }
    if(isThenable(res))return res.then(done);
    return done(res);
  },

  // 真实 LLM 产生的变更集只能由"人"批准：系统批准人一律拒绝
  applyApproved:function(changeSet,approver,options){
    if(!changeSet)return{ok:false,status:'REJECTED',errors:['changeSet: required']};
    var v=ChangeSetRuntime.validate(changeSet,options||{});
    if(!v.ok)return{ok:false,status:changeSet.status,errors:v.validation.errors};
    var ap=ChangeSetRuntime.approve(changeSet,String(approver||''),options||{});
    if(!ap.ok)return{ok:false,status:changeSet.status,errors:ap.errors};
    var res=ChangeSetRuntime.apply(changeSet,options||{});
    return{ok:!!res.ok,status:changeSet.status,verified:res.verification||null,results:res.results||[],errors:res.errors||[]};
  }
};
